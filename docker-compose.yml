services:
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/fizzdragon-pte-ltd-2}/studio-web:${WEB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.web
    depends_on:
      - server
    networks:
      - app

  server:
    image: ${IMAGE_PREFIX:-ghcr.io/fizzdragon-pte-ltd-2}/studio-server:${SERVER_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env.server
    networks:
      - app

networks:
  app:
    driver: bridge
