name: Build & Deploy

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com  # 阿里云 ACR 地址，按实际修改
  IMAGE_NAME: fizzdragon/studio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV=production" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> $GITHUB_ENV
            echo "DEPLOY_USER=${{ secrets.PROD_USER }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_OSS_BASE_URL=${{ secrets.PROD_OSS_BASE_URL }}" >> $GITHUB_ENV
          else
            echo "ENV=staging" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.STAGING_HOST }}" >> $GITHUB_ENV
            echo "DEPLOY_USER=${{ secrets.STAGING_USER }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_OSS_BASE_URL=${{ secrets.STAGING_OSS_BASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENV }}
          build-args: |
            NEXT_PUBLIC_OSS_BASE_URL=${{ env.NEXT_PUBLIC_OSS_BASE_URL }}

      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENV }}
            docker stop fizzdragon-studio || true
            docker rm fizzdragon-studio || true
            docker run -d \
              --name fizzdragon-studio \
              --restart unless-stopped \
              -p 3000:3000 \
              -e JAVA_STUDIO_URL=${{ secrets[format('{0}_JAVA_STUDIO_URL', env.ENV == 'production' && 'PROD' || 'STAGING')] }} \
              -e JAVA_CONTENT_URL=${{ secrets[format('{0}_JAVA_CONTENT_URL', env.ENV == 'production' && 'PROD' || 'STAGING')] }} \
              -e AI_GATEWAY_MODEL=${{ secrets.AI_GATEWAY_MODEL }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENV }}
            docker image prune -f
