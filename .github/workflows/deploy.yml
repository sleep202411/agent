name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Deploy target"
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fizzdragon-pte-ltd-2

jobs:
  # ─── Resolve deployment targets ───────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      server_tag: ${{ steps.resolve.outputs.server_tag }}
    steps:
      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="production"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            ENV="staging"
          else
            echo "::error::Unsupported branch: ${{ github.ref_name }}"
            exit 1
          fi

          if [ "$ENV" = "production" ]; then
            echo 'targets=["prod-cn","prod-com"]' >> $GITHUB_OUTPUT
            echo "server_tag=prod" >> $GITHUB_OUTPUT
          else
            echo 'targets=["staging"]' >> $GITHUB_OUTPUT
            echo "server_tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Guard production deployment
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref_name != 'main'
        run: |
          echo "::error::Production deploys are only allowed from the main branch."
          exit 1

  # ─── Build server image (once, shared across targets) ─
  build-server:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/studio-server:${{ needs.prepare.outputs.server_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Build web image (per target, NEXT_PUBLIC vars may differ) ─
  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/studio-web:${{ matrix.target }}
          build-args: |
            NEXT_PUBLIC_OSS_BASE_URL=${{ vars.OSS_BASE_URL }}
            SERVER_URL=http://localhost:3001
            JAVA_STUDIO_URL=${{ vars.JAVA_STUDIO_URL }}
            JAVA_CONTENT_URL=${{ vars.JAVA_CONTENT_URL }}
          cache-from: type=gha,scope=${{ matrix.target }}-web
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-web

  # ─── Deploy to target servers ─────────────────────────
  deploy:
    needs: [prepare, build-server, build-web]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    environment: ${{ matrix.target }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy
        run: |
          cat > .env << EOF
          IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
          WEB_TAG=${{ matrix.target }}
          SERVER_TAG=${{ needs.prepare.outputs.server_tag }}
          EOF

          cat > .env.server << EOF
          JAVA_STUDIO_URL=${{ vars.JAVA_STUDIO_URL }}
          JAVA_CONTENT_URL=${{ vars.JAVA_CONTENT_URL }}
          ALIBABA_API_KEY=${{ secrets.ALIBABA_API_KEY }}
          ALIBABA_BASE_URL=${{ secrets.ALIBABA_BASE_URL }}
          AI_MODEL=qwen-plus
          PORT=3001
          EOF

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
