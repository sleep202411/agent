name: Deploy

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com

jobs:
  # ─── Determine environment ─────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.vars.outputs.env }}
      tag: ${{ steps.vars.outputs.tag }}
      deploy_host: ${{ steps.vars.outputs.deploy_host }}
      deploy_user: ${{ steps.vars.outputs.deploy_user }}
      oss_base_url: ${{ steps.vars.outputs.oss_base_url }}
      java_studio_url: ${{ steps.vars.outputs.java_studio_url }}
      java_content_url: ${{ steps.vars.outputs.java_content_url }}
    steps:
      - id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production"       >> $GITHUB_OUTPUT
            echo "tag=production"       >> $GITHUB_OUTPUT
            echo "deploy_host=${{ secrets.PROD_HOST }}"           >> $GITHUB_OUTPUT
            echo "deploy_user=${{ secrets.PROD_USER }}"           >> $GITHUB_OUTPUT
            echo "oss_base_url=${{ secrets.PROD_OSS_BASE_URL }}"  >> $GITHUB_OUTPUT
            echo "java_studio_url=${{ secrets.PROD_JAVA_STUDIO_URL }}"   >> $GITHUB_OUTPUT
            echo "java_content_url=${{ secrets.PROD_JAVA_CONTENT_URL }}" >> $GITHUB_OUTPUT
          else
            echo "env=staging"          >> $GITHUB_OUTPUT
            echo "tag=staging"          >> $GITHUB_OUTPUT
            echo "deploy_host=${{ secrets.STAGING_HOST }}"           >> $GITHUB_OUTPUT
            echo "deploy_user=${{ secrets.STAGING_USER }}"           >> $GITHUB_OUTPUT
            echo "oss_base_url=${{ secrets.STAGING_OSS_BASE_URL }}"  >> $GITHUB_OUTPUT
            echo "java_studio_url=${{ secrets.STAGING_JAVA_STUDIO_URL }}"   >> $GITHUB_OUTPUT
            echo "java_content_url=${{ secrets.STAGING_JAVA_CONTENT_URL }}" >> $GITHUB_OUTPUT
          fi

  # ─── Build web & server in parallel ────────────────────
  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/fizzdragon/web:${{ github.sha }}
            ${{ env.REGISTRY }}/fizzdragon/web:${{ needs.prepare.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_OSS_BASE_URL=${{ needs.prepare.outputs.oss_base_url }}
            SERVER_URL=http://server:3001
            JAVA_STUDIO_URL=${{ needs.prepare.outputs.java_studio_url }}
            JAVA_CONTENT_URL=${{ needs.prepare.outputs.java_content_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-server:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/fizzdragon/server:${{ github.sha }}
            ${{ env.REGISTRY }}/fizzdragon/server:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to ECS ────────────────────────────────────
  deploy:
    needs: [prepare, build-web, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.prepare.outputs.deploy_host }}
          username: ${{ needs.prepare.outputs.deploy_user }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/apps/fizzdragon-platform

            export REGISTRY=${{ env.REGISTRY }}
            export TAG=${{ needs.prepare.outputs.tag }}

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
