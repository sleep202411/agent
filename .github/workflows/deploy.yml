name: Deploy

on:
  push:
    branches: [main, develop]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Deploy target"
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fizzdragon-pte-ltd-2

jobs:
  # ─── Resolve deployment targets ───────────────────────
  prepare:
    # Skip if comment is not /deploy on a PR
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/deploy')
      )
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      server_tag: ${{ steps.resolve.outputs.server_tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Get PR branch (comment trigger)
        id: pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.ref);
            // React with 🚀 to acknowledge
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            ENV="staging"
            echo "ref=${{ steps.pr.outputs.ref }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="production"
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            ENV="staging"
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "::error::Unsupported branch: ${{ github.ref_name }}"
            exit 1
          fi

          if [ "$ENV" = "production" ]; then
            echo 'targets=["prod-cn","prod-com"]' >> $GITHUB_OUTPUT
            echo "server_tag=prod" >> $GITHUB_OUTPUT
          else
            echo 'targets=["staging"]' >> $GITHUB_OUTPUT
            echo "server_tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Guard production deployment
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref_name != 'main'
        run: |
          echo "::error::Production deploys are only allowed from the main branch."
          exit 1

  # ─── Build server image (once, shared across targets) ─
  build-server:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/studio-server:${{ needs.prepare.outputs.server_tag }}
          no-cache: true

  # ─── Build web image (per target, VITE_ vars may differ) ─
  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/studio-web:${{ matrix.target }}
          build-args: |
            VITE_OSS_BASE_URL=${{ vars.OSS_BASE_URL }}
            VITE_BANNER_BASE_URL=${{ vars.BANNER_BASE_URL }}
            VITE_SITE_REGION=${{ vars.SITE_REGION }}
            VITE_PARENT_ORIGIN=${{ vars.PARENT_ORIGIN }}
            SERVER_URL=http://server:3001
            JAVA_STUDIO_URL=${{ vars.JAVA_STUDIO_URL }}
            JAVA_CONTENT_URL=${{ vars.JAVA_CONTENT_URL }}
          no-cache: true

  # ─── Deploy to target servers ─────────────────────────
  deploy:
    needs: [prepare, build-server, build-web]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    environment: ${{ matrix.target }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy
        run: |
          cat > .env << EOF
          COMPOSE_PROJECT_NAME=${{ matrix.target }}
          WEB_IMAGE=${{ env.IMAGE_PREFIX }}/studio-web:${{ matrix.target }}
          SERVER_IMAGE=${{ env.IMAGE_PREFIX }}/studio-server:${{ needs.prepare.outputs.server_tag }}
          WEB_PORT=${{ vars.WEB_PORT || '3000' }}
          SERVER_PORT=${{ vars.SERVER_PORT || '3001' }}
          JAVA_STUDIO_URL=${{ vars.JAVA_STUDIO_URL }}
          JAVA_CONTENT_URL=${{ vars.JAVA_CONTENT_URL }}
          ALIBABA_API_KEY=${{ secrets.ALIBABA_API_KEY }}
          ALIBABA_BASE_URL=${{ secrets.ALIBABA_BASE_URL }}
          AI_MODEL=${{ vars.AI_MODEL || 'qwen3-max' }}
          REDIS_IMAGE=${{ vars.REDIS_IMAGE || 'redis:7-alpine' }}
          EOF

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
