name: Build & Push (staging)

# CI **only builds and pushes images to GHCR**. The ECS hosts pull
# them on their own via `podman auto-update` (staging + prod CN) or
# Watchtower (prod COM) — see deploy/AUTO_DEPLOY.md.

on:
  # Manual only — auto-build on every `develop` push burned through
  # the free Actions minutes for negligible value (staging hosts pull
  # images themselves, so a cached previous build is usually fine for
  # day-to-day work). Re-enable the `push:` trigger when staging gets
  # promoted back into the regular CI loop.
  workflow_dispatch: # GHA UI or `gh workflow run build-staging.yml`

concurrency:
  group: build-staging-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fizzdragon-pte-ltd-2

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/studio-server:staging
          cache-from: type=gha,scope=server-staging
          cache-to: type=gha,scope=server-staging,mode=max

  build-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/studio-agent:staging
          cache-from: type=gha,scope=agent-staging
          cache-to: type=gha,scope=agent-staging,mode=max

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load apps/web/.env.staging into job env
        # Single source of truth: the env file already maintained for the
        # local dev / docs flow. Strips comments and blank lines, exports
        # everything else so the next step's build-args block can read it
        # via ${{ env.* }}.
        run: |
          grep -E '^[A-Z_]+=' apps/web/.env.staging >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/studio-web:staging
          build-args: |
            NEXT_PUBLIC_OSS_BASE_URL=${{ env.NEXT_PUBLIC_OSS_BASE_URL }}
            NEXT_PUBLIC_BANNER_BASE_URL=${{ env.NEXT_PUBLIC_BANNER_BASE_URL }}
            NEXT_PUBLIC_USER_BASE_URL=${{ env.NEXT_PUBLIC_USER_BASE_URL }}
            NEXT_PUBLIC_SITE_REGION=${{ env.NEXT_PUBLIC_SITE_REGION }}
            NEXT_PUBLIC_PARENT_ORIGIN=${{ env.NEXT_PUBLIC_PARENT_ORIGIN }}
            NEXT_PUBLIC_WS_HOST=${{ env.NEXT_PUBLIC_WS_HOST }}
            NEXT_PUBLIC_API_CONTENT_PREFIX=${{ env.NEXT_PUBLIC_API_CONTENT_PREFIX }}
            NEXT_PUBLIC_API_STUDIO_PREFIX=${{ env.NEXT_PUBLIC_API_STUDIO_PREFIX }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ env.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}
            SERVER_URL=http://server:3001
            JAVA_STUDIO_URL=${{ env.JAVA_STUDIO_URL }}
            JAVA_CONTENT_URL=${{ env.JAVA_CONTENT_URL }}
          cache-from: type=gha,scope=web-staging
          cache-to: type=gha,scope=web-staging,mode=max
