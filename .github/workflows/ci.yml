name: CI

on:
  pull_request:
    branches: [main, develop, feat/crew-v2-review]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fizzdragon
          POSTGRES_PASSWORD: fizzdragon
          POSTGRES_DB: task01
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U fizzdragon -d task01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres-gps:
        image: postgres:17
        env:
          POSTGRES_USER: fizzdragon
          POSTGRES_PASSWORD: fizzdragon
          POSTGRES_DB: gps_test
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U fizzdragon -d gps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres-actors:
        image: postgres:17
        env:
          POSTGRES_USER: fizzdragon
          POSTGRES_PASSWORD: fizzdragon
          POSTGRES_DB: ai_actor_review
        ports:
          - 55193:5432
        options: >-
          --health-cmd "pg_isready -U fizzdragon -d ai_actor_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis-rate-limit:
        image: redis:7
        ports:
          - 56385:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VITEST_MAX_WORKERS: 1
      TEST_REDIS_URL: redis://127.0.0.1:16379
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/task01?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --global npm@11.16.0

      - run: npm ci

      - name: Build cache contract
        run: npm run test:build-cache

      - name: Test orchestration contract
        run: npm run test:orchestration

      - name: Repository maintenance script regressions
        run: node --test scripts/cleanup-branches.test.mjs scripts/content-gps/offline-extraction.test.mjs deploy/diagnose-com-server.test.mjs

      - name: Generate database client
        run: npm run db:generate -w server

      - name: Create dedicated legacy Agent test database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U fizzdragon fizzdragon_legacy_agent_test

      - name: Apply product database migrations
        run: npm run db:deploy -w server

      - name: Create dedicated concurrency fixture database
        run: docker exec "${{ job.services.postgres-gps.id }}" createdb -U fizzdragon fd_audit

      - name: Create dedicated platform regression database
        run: docker exec "${{ job.services.postgres-gps.id }}" createdb -U fizzdragon audit_migrations_20261005

      - name: Migrate dedicated platform regression database
        env:
          DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
        run: npm run db:deploy -w server

      - name: Migrate dedicated AI Actor fixture
        env:
          DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55193/ai_actor_review
        run: npm run db:deploy -w server

      - uses: azure/setup-helm@v5

      - name: Helm render contract
        run: bash deploy/helm/fizzdragon/tests/agent-os-render.sh

      - name: Lint
        run: npx turbo run lint --concurrency=1

      - name: Server type-check runner contract
        run: npm run test:typecheck-runner -w server

      - name: Type check
        run: npx turbo run check-types --concurrency=1

      - name: Migration and workspace permission regressions
        run: |
          npm run test:crew-migrations -w server
          npm run test:workspace-migration -w server
          npm run test:workspace-permissions -w server

      - name: Create dedicated project-move database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U fizzdragon story_workspace_preview

      - name: Project-move and payer-isolation regressions
        env:
          DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/story_workspace_preview
        run: |
          npm run db:deploy -w server
          npm run test:story-project-move -w server

      - name: Health HTTP regressions
        run: npm run test:e2e -w server -- --runInBand

      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start local upload-test storage
        run: |
          docker run --detach --name fizz-ci-minio \
            --publish 127.0.0.1:19000:9000 \
            --env MINIO_ROOT_USER=fizz-local-test \
            --env MINIO_ROOT_PASSWORD=fizz-local-test-password \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs fizz-ci-minio
          exit 1

      - name: Test
        env:
          TASK01_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          LEGACY_AGENT_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/fizzdragon_legacy_agent_test?sslmode=disable
        run: npx turbo run test --concurrency=2

      - name: Server-rendered experience player regressions
        run: npm run test:experience-player -w web

      # GPS suites create/drop overlapping fixture tables: run serially on
      # their dedicated loopback database, never the migrated product database.
      - name: GPS database regressions
        env:
          CONTENT_GPS_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/gps_test?sslmode=disable
        run: npm run test:integration:gps -w server

      - name: Actor, rate-limit, publication and feedback regressions
        env:
          AI_ACTOR_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55193/ai_actor_review
          REDIS_RATE_LIMIT_INTEGRATION_URL: redis://127.0.0.1:56385/15
          FD_TEMPLATE_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/fd_audit
          IP_FEEDBACK_SQL_TEST: "1"
        run: npm run test:integration:audit -w server

      - name: Multipart upload integration
        env:
          TASK01_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          EPISODE_UPLOAD_INTEGRATION: "1"
        run: npm run test -w server -- --runInBand --runTestsByPath src/media/episode-upload.integration.spec.ts

      # Serial and fail-closed: these suites must execute, not report skipped.
      - name: Platform finance, contracts, exports and storage regressions
        env:
          CONTENT_GPS_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          LOCAL_AUDIT_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/task01
          TASK01_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/task01
          PROJECT_SECTIONS_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/task01
          PROJECT_SKILLS_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/task01
          CONTRACT_RETENTION_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          DISPUTE_LIST_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          REPORT_PURCHASE_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          STORYBOARD_EXPORT_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          TASK_CONTRACTS_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          TASK_DELIVERY_FOLDER_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          TASK_FEEDBACK_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          WITHDRAWAL_TEST_DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55441/audit_migrations_20261005
          S3_LOCAL_INTEGRATION: "1"
          STORYBOARD_RENDER_INTEGRATION: "1"
          MEDIA_RETENTION_SCALE: "1"
          WITHDRAWAL_SCALE_TEST: "1"
        run: npm run test:integration:platform -w server

      # Build-only fixtures: no production credentials or live service calls.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_REGION: global
          NEXT_PUBLIC_OSS_BASE_URL: https://oss.test.invalid
          NEXT_PUBLIC_BANNER_BASE_URL: https://banner.test.invalid
          NEXT_PUBLIC_STUDIO_HOST: https://studio.test.invalid
          NEXT_PUBLIC_PARENT_ORIGIN: https://web.test.invalid
          ADMIN_SITE: global
          ADMIN_API_BASE_URL: http://127.0.0.1:4399
          AURORA_PROXY_TARGET: http://127.0.0.1:4399
          JAVA_CONTENT_URL: http://127.0.0.1:18080
          JAVA_STUDIO_URL: http://127.0.0.1:18081
        run: npx turbo run build --concurrency=1

      - name: Remove local upload-test storage
        if: always()
        run: docker rm --force fizz-ci-minio || true
