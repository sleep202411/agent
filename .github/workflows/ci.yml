name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fizzdragon
          POSTGRES_PASSWORD: fizzdragon
          POSTGRES_DB: task01
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U fizzdragon -d task01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VITEST_MAX_WORKERS: 1
      TEST_REDIS_URL: redis://127.0.0.1:16379
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgres://fizzdragon:fizzdragon@127.0.0.1:55439/task01?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --global npm@11.16.0

      - run: npm ci

      - name: Generate database client
        run: npm run db:generate -w server

      - name: Apply product database migrations
        run: npm run db:deploy -w server

      - uses: azure/setup-helm@v5

      - name: Helm render contract
        run: bash deploy/helm/fizzdragon/tests/agent-os-render.sh

      - name: Lint
        run: npx turbo run lint --concurrency=1

      - name: Type check
        run: npx turbo run check-types --concurrency=2

      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        env:
          TASK01_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx turbo run test --concurrency=2

      # Build-only fixtures: no production credentials or live service calls.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_REGION: global
          NEXT_PUBLIC_OSS_BASE_URL: https://oss.test.invalid
          NEXT_PUBLIC_BANNER_BASE_URL: https://banner.test.invalid
          NEXT_PUBLIC_STUDIO_HOST: https://studio.test.invalid
          NEXT_PUBLIC_PARENT_ORIGIN: https://web.test.invalid
          ADMIN_SITE: global
          ADMIN_API_BASE_URL: http://127.0.0.1:4399
          AURORA_PROXY_TARGET: http://127.0.0.1:4399
          JAVA_CONTENT_URL: http://127.0.0.1:18080
          JAVA_STUDIO_URL: http://127.0.0.1:18081
        run: npx turbo run build --concurrency=1
