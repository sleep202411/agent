name: Deployment Python compatibility

on:
  pull_request:
    paths: ['deploy/**', '.github/workflows/deployment-python.yml']
  push:
    branches: [main, develop]
    paths: ['deploy/**', '.github/workflows/deployment-python.yml']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          allow-prereleases: false
      - name: Runtime and syntax compatibility
        run: |
          python3 --version
          python3 deploy/check-python.py
          python3 -m compileall -q deploy
      - name: Singapore deployment regressions (cloud and Docker mocked)
        run: python3 -m unittest discover -s deploy/aliyun-sg/tests -p 'test_*.py'
      - name: CN and shared deployment regressions (cloud mocked)
        run: python3 -m unittest discover -s deploy -p '*_test.py'
      - name: Public entrypoint imports
        run: |
          bash deploy/deploy-com.sh --help
          bash deploy/release-cn.sh --help
          bash deploy/run-cn-migrations.sh --help

  preview:
    name: Next Python preview (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          allow-prereleases: true
          check-latest: true
      - run: python3 --version
      - run: python3 -m compileall -q deploy
      - run: python3 -m unittest discover -s deploy/aliyun-sg/tests -p 'test_*.py'
      - run: python3 -m unittest discover -s deploy -p '*_test.py'
