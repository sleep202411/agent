name: Cleanup Merged Branches

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged feature branches
        uses: actions/github-script@v7
        with:
          script: |
            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const featureBranches = branches
              .filter(b => b.name.startsWith('feature/'));

            if (featureBranches.length === 0) {
              console.log('No feature branches to clean up');
              return;
            }

            // Check which feature branches are merged into main
            const deleted = [];
            for (const candidate of featureBranches) {
              const branch = candidate.name;
              const checkedSha = candidate.commit.sha;
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: 'main',
                  head: checkedSha,
                });

                if (comparison.status === 'behind' || comparison.status === 'identical') {
                  // Delete only the exact head we checked. GitHub deleteRef
                  // deletes by name and can erase work pushed after comparison.
                  require('node:child_process').execFileSync('git', [
                    'push',
                    `--force-with-lease=refs/heads/${branch}:${checkedSha}`,
                    'origin',
                    `:refs/heads/${branch}`,
                  ]);
                  deleted.push(branch);
                  console.log(`Deleted: ${branch}`);
                }
              } catch (e) {
                console.log(`Skipped ${branch}: ${e.message}`);
              }
            }

            if (deleted.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🧹 Cleaned up ${deleted.length} merged feature branch(es):\n${deleted.map(b => `- \`${b}\``).join('\n')}`,
              });
            }
