services:
  web:
    image: ${WEB_IMAGE:-fizzdragon-web}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-web
    restart: always
    # Pull-based auto-deploy: the host's `podman auto-update` (or
    # Watchtower on the docker host) detects when GHCR has a newer
    # digest for the tag this container was launched with, then pulls
    # and recreates the container. CI never SSHs into a server.
    labels:
      io.containers.autoupdate: registry              # podman auto-update
      com.centurylinklabs.watchtower.enable: "true"   # docker watchtower
    # Per-service memory caps so no single container can starve the others
    # when the host hits pressure. Sized for an 8c16g ECS + WORKER_CONCURRENCY=90:
    # web 1g, server 1g, agent 3g, agent-worker 10g, redis 1g → ~16g total,
    # leaves ~1g for system + 8g swap tail.
    mem_limit: 1g
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      SERVER_URL: http://server:3001
    depends_on:
      - server
    networks:
      - app

  server:
    image: ${SERVER_IMAGE:-fizzdragon-server}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-server
    restart: always
    labels:
      io.containers.autoupdate: registry
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 1g
    ports:
      - "${SERVER_PORT:-3001}:3001"
    # Run schema migrations inside the server image before Nest binds HTTP.
    # `prisma migrate deploy` is idempotent; if Postgres is still warming up,
    # the command fails and restart:always retries instead of serving with a
    # half-migrated schema.
    command: ["sh", "-c", "npm run db:deploy && node dist/main.js"]
    environment:
      PORT: 3001
      NEXT_PUBLIC_SITE_REGION: ${SITE_REGION:-global}
      JAVA_STUDIO_URL: ${JAVA_STUDIO_URL}
      JAVA_CONTENT_URL: ${JAVA_CONTENT_URL}
      JAVA_USER_QUERY_PWD: ${JAVA_USER_QUERY_PWD}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY}
      ALIBABA_BASE_URL: ${ALIBABA_BASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-alibaba}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      REDIS_URL: redis://redis:6379
      # Crew module persistence — see `postgres` service below.
      # Password sourced from .env (POSTGRES_PASSWORD). On managed-DB
      # deploys (Azure / Aliyun RDS) override DATABASE_URL directly
      # in the host .env and the `postgres` service can be commented
      # out of this file.
      DATABASE_URL: ${DATABASE_URL:-postgresql://fizzdragon:${POSTGRES_PASSWORD}@postgres:5432/fizzdragon?schema=public}
      # Supervisor chat + workflow endpoints live in the agent container.
      MASTRA_URL: http://agent:4111
      DISABLE_CONTENT_MODERATION: ${DISABLE_CONTENT_MODERATION:-false}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      - redis
      - agent
      - postgres
    networks:
      - app

  # Mastra API — supervisor agent + /chat/storyos stream + /workflow/* + /drafts/*.
  # NestJS proxies here via MASTRA_URL. Worker process lives in agent-worker,
  # same image, different command.
  agent:
    image: ${AGENT_IMAGE:-fizzdragon-agent}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-agent
    restart: always
    labels:
      io.containers.autoupdate: registry
      com.centurylinklabs.watchtower.enable: "true"
    # 3g because concurrent supervisor streams (dozens at once) each hold
    # their own conversation context + pending tool-call state.
    mem_limit: 3g
    environment:
      PORT: 4111
      MASTRA_HOST: 0.0.0.0
      MASTRA_DB_URL: file:/app/data/mastra.db
      REDIS_URL: redis://redis:6379
      JAVA_STUDIO_URL: ${JAVA_STUDIO_URL}
      JAVA_CONTENT_URL: ${JAVA_CONTENT_URL}
      # Router / persona provider selection. Leave provider unset to default
      # to DeepSeek (requires DEEPSEEK_API_KEY). Set STORYOS_*_PROVIDER=azure
      # or alibaba to override per-env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY:-}
      ALIBABA_BASE_URL: ${ALIBABA_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      STORYOS_ROUTER_PROVIDER: ${STORYOS_ROUTER_PROVIDER:-}
      STORYOS_ROUTER_MODEL: ${STORYOS_ROUTER_MODEL:-}
      STORYOS_PERSONA_PROVIDER: ${STORYOS_PERSONA_PROVIDER:-}
      STORYOS_PERSONA_MODEL: ${STORYOS_PERSONA_MODEL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_RESOURCE_NAME: ${AZURE_OPENAI_RESOURCE_NAME:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      # Optional — only needed for generate_project_cover tool.
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - agent_data:/app/data
    depends_on:
      - redis
    networks:
      - app

  # BullMQ consumer — runs the same Mastra workflows as the API but in a
  # separate process so an API crash doesn't kill in-flight runs. Shares the
  # libsql volume with `agent` for snapshot / resume state.
  agent-worker:
    image: ${AGENT_IMAGE:-fizzdragon-agent}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-agent-worker
    restart: always
    labels:
      io.containers.autoupdate: registry
      com.centurylinklabs.watchtower.enable: "true"
    # Worker ceiling highest because it holds live workflow state +
    # batched LLM buffers for bulk phases (parse_script on a 50K-char
    # novel, storyboard_phase generating 30 shots × N episodes in parallel).
    # Sized for WORKER_CONCURRENCY=90 × ~30-80MB per in-flight workflow.
    mem_limit: 10g
    command: ["npx", "tsx", "src/worker.ts"]
    environment:
      MASTRA_DB_URL: file:/app/data/mastra.db
      REDIS_URL: redis://redis:6379
      JAVA_STUDIO_URL: ${JAVA_STUDIO_URL}
      JAVA_CONTENT_URL: ${JAVA_CONTENT_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY:-}
      ALIBABA_BASE_URL: ${ALIBABA_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      STORYOS_ROUTER_PROVIDER: ${STORYOS_ROUTER_PROVIDER:-}
      STORYOS_ROUTER_MODEL: ${STORYOS_ROUTER_MODEL:-}
      STORYOS_PERSONA_PROVIDER: ${STORYOS_PERSONA_PROVIDER:-}
      STORYOS_PERSONA_MODEL: ${STORYOS_PERSONA_MODEL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_RESOURCE_NAME: ${AZURE_OPENAI_RESOURCE_NAME:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-1}
      STORYBOARD_GENERATE_CONCURRENCY: ${STORYBOARD_GENERATE_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - agent_data:/app/data
    depends_on:
      - redis
    networks:
      - app

  # ─── Postgres (crew module persistence) ────────────────
  # In-docker PG for the **.cn ECS** deploy. The .com side runs on
  # AKS with Azure Database for PostgreSQL Flexible Server (managed)
  # — this entire compose file isn't used there. This service is
  # justified for .cn while we hold off provisioning Aliyun RDS for
  # PG.
  #
  # Data lives in the named volume `pg_data`, which survives
  # container recreation BUT NOT host disk failure / ECS termination.
  # Belt-and-suspenders: enable a daily `pg_dump` to OSS before this
  # carries real production traffic.
  #
  # ⚠ NEVER run `docker compose down -v` on this stack — the `-v`
  #   flag deletes named volumes. Use `down` (no flag) to stop, or
  #   `restart` to bounce.
  #
  # Migration to managed DB (Aliyun RDS for PG) when ready:
  #   1. Replace DATABASE_URL in the `server` service env with the
  #      RDS connection string (sslmode=require).
  #   2. Remove `- postgres` from `server.depends_on`.
  #   3. Comment out this `postgres` service block. Keep `pg_data`
  #      volume declaration for one release in case rollback needed.
  postgres:
    # Docker Hub is blocked from the CN ECS; on that host set
    # POSTGRES_IMAGE to a GHCR mirror (ghcr.io/fizzdragon-pte-ltd-2/postgres:16-alpine)
    # — same workaround used for `redis` above. See DEPLOY.md for the
    # buildx-push recipe to re-mirror when bumping the PG version.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-pg
    restart: always
    labels:
      io.containers.autoupdate: registry
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 1g
    environment:
      POSTGRES_DB: fizzdragon
      POSTGRES_USER: fizzdragon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizzdragon"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  redis:
    # Redis Stack = Redis + RediSearch (vector) + RedisJSON + RedisBloom.
    # Wire-compatible with vanilla Redis; only difference: command is `redis-stack-server`
    # and config args flow through REDIS_ARGS env var.
    image: ${REDIS_IMAGE:-redis/redis-stack-server:7.4.0-v3}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-redis
    restart: always
    # Cap Redis memory so an attachment-cache / chat-event burst can't
    # eat everything. `noeviction` returns OOM on writes when the cap is
    # hit rather than evicting random keys — required because BullMQ
    # jobs and Mastra workflow state stored here MUST NOT be dropped
    # mid-run; LRU eviction would silently lose step state and surface
    # as `[reaper] cancelled stale run` + the user-facing "智能体没
    # 反应" symptom. Attachment / draft / chat keys carry their own
    # TTLs and age out cleanly without LRU pressure. Peak usage is
    # currently ~30M of 900M (3.4%); OOM is theoretical until usage
    # scales 30× from here, at which point raise the cap, don't loosen
    # the eviction policy.
    # 1g for WORKER_CONCURRENCY=90: BullMQ queue depth + draft cache
    # can peak at hundreds of MB when lots of workflows are mid-flight.
    mem_limit: 1g
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --maxmemory 900mb --maxmemory-policy noeviction"
    volumes:
      - redis_data:/data
    networks:
      - app

volumes:
  # redis_data + agent_data: NOT explicitly named — they fall through to
  # podman-compose's default `<projectName>_<volumeKey>`, which on 1.0.6
  # is the working-dir basename ("platform"). Result: staging and prod-cn
  # on the same ECS have been silently sharing `platform_redis_data` and
  # `platform_agent_data`. That's a latent bug worth fixing eventually,
  # but namespacing here would discard in-flight BullMQ jobs and libsql
  # workflow snapshots on next force-recreate — defer until a planned
  # maintenance window with the worker queue drained.
  redis_data:
  agent_data:
  # pg_data IS namespaced. Two PG containers can't safely share a data
  # dir (different passwords → init mismatch → crash loop), so this
  # collision would be fatal where the others are merely messy.
  pg_data:
    name: ${COMPOSE_PROJECT_NAME:-fizzdragon}_pg_data

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-fizzdragon}_network
