services:
  web:
    image: ${WEB_IMAGE:-fizzdragon-web}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-web
    restart: always
    # Per-service memory caps so no single container can starve the others
    # when the host hits pressure. Sized for an 8c16g ECS: web 1g, server
    # 1g, agent 2g, agent-worker 4g, redis 512m → ~8.5g with headroom.
    mem_limit: 1g
    # Bind to loopback by default so only the host's nginx (127.0.0.1) can
    # reach the app port. Override BIND_IP=0.0.0.0 in a staging env file if
    # you want to curl the container directly from another host.
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      SERVER_URL: http://server:3001
    depends_on:
      - server
    networks:
      - app

  server:
    image: ${SERVER_IMAGE:-fizzdragon-server}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-server
    restart: always
    mem_limit: 1g
    ports:
      - "${BIND_IP:-127.0.0.1}:${SERVER_PORT:-3001}:3001"
    environment:
      PORT: 3001
      JAVA_STUDIO_URL: ${JAVA_STUDIO_URL}
      JAVA_CONTENT_URL: ${JAVA_CONTENT_URL}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY}
      ALIBABA_BASE_URL: ${ALIBABA_BASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-alibaba}
      AI_MODEL: ${AI_MODEL:-qwen3-max}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      REDIS_URL: redis://redis:6379
      # Supervisor chat + workflow endpoints live in the agent container.
      MASTRA_URL: http://agent:4111
      DISABLE_CONTENT_MODERATION: ${DISABLE_CONTENT_MODERATION:-false}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      - redis
      - agent
    networks:
      - app

  # Mastra API — supervisor agent + /chat/storyos stream + /workflow/* + /drafts/*.
  # NestJS proxies here via MASTRA_URL. Worker process lives in agent-worker,
  # same image, different command.
  agent:
    image: ${AGENT_IMAGE:-fizzdragon-agent}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-agent
    restart: always
    mem_limit: 2g
    environment:
      PORT: 4111
      MASTRA_HOST: 0.0.0.0
      MASTRA_DB_URL: file:/app/data/mastra.db
      REDIS_URL: redis://redis:6379
      JAVA_STUDIO_URL: ${JAVA_STUDIO_URL}
      JAVA_CONTENT_URL: ${JAVA_CONTENT_URL}
      # Router / persona provider selection. Leave provider unset to default
      # to DeepSeek (requires DEEPSEEK_API_KEY). Set STORYOS_*_PROVIDER=azure
      # or alibaba to override per-env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY:-}
      ALIBABA_BASE_URL: ${ALIBABA_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      STORYOS_ROUTER_PROVIDER: ${STORYOS_ROUTER_PROVIDER:-}
      STORYOS_ROUTER_MODEL: ${STORYOS_ROUTER_MODEL:-}
      STORYOS_PERSONA_PROVIDER: ${STORYOS_PERSONA_PROVIDER:-}
      STORYOS_PERSONA_MODEL: ${STORYOS_PERSONA_MODEL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_RESOURCE_NAME: ${AZURE_OPENAI_RESOURCE_NAME:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      # Optional — only needed for generate_project_cover tool.
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - agent_data:/app/data
    depends_on:
      - redis
    networks:
      - app

  # BullMQ consumer — runs the same Mastra workflows as the API but in a
  # separate process so an API crash doesn't kill in-flight runs. Shares the
  # libsql volume with `agent` for snapshot / resume state.
  agent-worker:
    image: ${AGENT_IMAGE:-fizzdragon-agent}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-agent-worker
    restart: always
    # Worker ceiling highest because it holds live workflow state +
    # batched LLM buffers for bulk phases (parse_script on a 50K-char
    # novel, storyboard_phase generating 30 shots × N episodes in parallel).
    mem_limit: 4g
    command: ["npx", "tsx", "src/worker.ts"]
    environment:
      MASTRA_DB_URL: file:/app/data/mastra.db
      REDIS_URL: redis://redis:6379
      JAVA_STUDIO_URL: ${JAVA_STUDIO_URL}
      JAVA_CONTENT_URL: ${JAVA_CONTENT_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      ALIBABA_API_KEY: ${ALIBABA_API_KEY:-}
      ALIBABA_BASE_URL: ${ALIBABA_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      STORYOS_ROUTER_PROVIDER: ${STORYOS_ROUTER_PROVIDER:-}
      STORYOS_ROUTER_MODEL: ${STORYOS_ROUTER_MODEL:-}
      STORYOS_PERSONA_PROVIDER: ${STORYOS_PERSONA_PROVIDER:-}
      STORYOS_PERSONA_MODEL: ${STORYOS_PERSONA_MODEL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_RESOURCE_NAME: ${AZURE_OPENAI_RESOURCE_NAME:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-1}
      STORYBOARD_GENERATE_CONCURRENCY: ${STORYBOARD_GENERATE_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - agent_data:/app/data
    depends_on:
      - redis
    networks:
      - app

  redis:
    # Redis Stack = Redis + RediSearch (vector) + RedisJSON + RedisBloom.
    # Wire-compatible with vanilla Redis; only difference: command is `redis-stack-server`
    # and config args flow through REDIS_ARGS env var.
    image: ${REDIS_IMAGE:-redis/redis-stack-server:7.4.0-v3}
    container_name: ${COMPOSE_PROJECT_NAME:-fizzdragon}-redis
    restart: always
    # Cap Redis memory so an attachment-cache / chat-event burst can't eat
    # everything. `allkeys-lru` evicts least-recently-used when the cap is
    # hit — safe because our attachment / draft / workflow keys all have
    # TTLs anyway; the LRU eviction is just a backstop against runaway.
    mem_limit: 512m
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --maxmemory 450mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data:/data
    networks:
      - app

volumes:
  redis_data:
  agent_data:

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-fizzdragon}_network
