# Additive repair for the existing Singapore production isolation policies.
# Do not replace the Harness policies or allow unrestricted cluster traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fizzdragon-server-agent-os
  namespace: fizzdragon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fizzdragon
      app.kubernetes.io/instance: fizzdragon
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fizzdragon
              app.kubernetes.io/instance: fizzdragon
              app.kubernetes.io/component: agent-os
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fizzdragon
              app.kubernetes.io/instance: fizzdragon
              app.kubernetes.io/component: agent-os
      ports:
        - protocol: TCP
          port: 4301
