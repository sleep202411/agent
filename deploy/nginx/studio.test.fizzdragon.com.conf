# studio.test.fizzdragon.com (Staging)

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name studio.test.fizzdragon.com;

    client_max_body_size 1000M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.test.fizzdragon.com;

    client_max_body_size 1000M;

    # SSL
    ssl_certificate /usr/local/nginx/ssl/studio.test.fizzdragon.com.pem;
    ssl_certificate_key /usr/local/nginx/ssl/studio.test.fizzdragon.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_stapling on;
    ssl_stapling_verify on;

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 日志
    access_log /var/log/nginx/studio.test.fizzdragon.com.access.log;
    error_log /var/log/nginx/studio.test.fizzdragon.com.error.log;

    # ===== NestJS Server (/aurora prefix) =====

    # WebSocket endpoint for workflow events — long-lived, needs Upgrade
    # headers and a longer read timeout. Must come before the generic
    # /aurora/ block so the more specific prefix wins.
    location /aurora/workflow-events {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # New chat-events WS (replaces the old SSE stream from the TanStack era).
    # Frontend opens one WS per conversation via chat-events-client.ts and
    # receives message_added / message_updated / message_chunk / agent_state
    # frames. Without this block nginx strips the Upgrade header and the
    # handshake silently downgrades to HTTP.
    location /aurora/chat/subscribe-conversation {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Per-user entity-events WS — cross-session cache invalidation for
    # worlds/assets. Same upgrade treatment as the other WS endpoints.
    location /aurora/entity-events/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /aurora/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ===== Java Studio Service =====

    # 所有 /api/* (AI 生成、用户操作等)
    location /api/ {
        proxy_pass https://test.fizzdragon.com/test2/api/;
        proxy_http_version 1.1;
        proxy_set_header Host test.fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 匿名接口
    location /anon/ {
        proxy_pass https://test.fizzdragon.com/test2/anon/;
        proxy_http_version 1.1;
        proxy_set_header Host test.fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    # Studio 接口
    location /studio/ {
        proxy_pass https://test.fizzdragon.com/test2/studio/;
        proxy_http_version 1.1;
        proxy_set_header Host test.fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    # ===== Java Content Service =====

    location /user/ {
        proxy_pass https://test.fizzdragon.com/test1/user/;
        proxy_http_version 1.1;
        proxy_set_header Host test.fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /project/ {
        proxy_pass https://test.fizzdragon.com/test1/project/;
        proxy_http_version 1.1;
        proxy_set_header Host test.fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /vedio/ {
        proxy_pass https://test.fizzdragon.com/test1/vedio/;
        proxy_http_version 1.1;
        proxy_set_header Host test.fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /content/ {
        proxy_pass https://test.fizzdragon.com/test1/content/;
        proxy_http_version 1.1;
        proxy_set_header Host test.fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    # ===== TanStack Start (fallback) =====

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # 禁止隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
