# Top-level nginx.conf tuned for ~500 concurrent users on an 8c16g box.
#
# Place at /etc/nginx/nginx.conf (replacing the default AlmaLinux/CentOS
# ship). Diff vs the default is:
#   - worker_rlimit_nofile added (needed for worker_connections > 1024)
#   - events.worker_connections 1024 → 4096
#   - events.use epoll, multi_accept (Linux perf wins)
#   - http.keepalive_timeout 65 → 75
#   - http.keepalive_requests 1000 (new)
#   - http.server_tokens off (minor security hardening)
#   - http.types_hash_max_size 2048 (default warns on larger mime maps)
#
# reload behavior:
#   - worker_connections / keepalive / epoll / multi_accept / server_tokens
#     → `nginx -s reload` suffices (graceful, no downtime)
#   - worker_rlimit_nofile → requires full restart (`systemctl restart nginx`)
#     because the limit is bound at master start. Still ~1s blackout for new
#     connections, existing keep flowing.

user  nginx;
worker_processes  auto;

# Each worker can open up to 65535 file descriptors (for sockets). Must be
# >= worker_connections + overhead. Paired with the systemd override at
# /etc/systemd/system/nginx.service.d/override.conf (LimitNOFILE=65535).
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types_hash_max_size 2048;

    # Don't advertise the exact nginx version in error pages / headers.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    # Longer client-idle keepalive + per-connection reuse budget. Matters
    # under burst traffic because reusing keepalive sockets avoids the
    # TCP+TLS handshake cost on every request.
    keepalive_timeout  75;
    keepalive_requests 1000;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
