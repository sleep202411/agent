server {
    listen 80;
    server_name fizzstudio.fizzspace.cn;

    location ^~ /.well-known/ {
        root /opt/webapps/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fizzstudio.fizzspace.cn;

    client_max_body_size 1000M;
    ssl_certificate cert/fizzstudio.fizzspace.cn.pem;
    ssl_certificate_key cert/fizzstudio.fizzspace.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!3DES:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # NestJS server — single /aurora/ location handles both REST and
    # WebSocket. The trailing `/` on proxy_pass strips the /aurora prefix
    # so Nest's controllers (/users, /crews, ...) and WebSocketGateway
    # paths (/entity-events/subscribe, /chat/subscribe-conversation,
    # /notifications/subscribe) all match without it. This mirrors
    # AKS ingress's rewrite-target /$2 behaviour for /aurora paths.
    #
    # Upgrade / Connection headers are passed unconditionally — harmless
    # for non-WS requests (NestJS just treats them as plain HTTP) and
    # lets us avoid maintaining a separate location block per WS path.
    location /aurora/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        # 3600s read/send timeout covers long-lived WS heartbeats
        # (server pings every 30s, zombie reaper kicks at 90s). REST
        # calls finish well under this so the upper bound is harmless.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Java Studio service
    location /api/ {
        proxy_pass https://fizzdragon.fizzspace.cn/studio/api/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.fizzspace.cn;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /anon/ {
        proxy_pass https://fizzdragon.fizzspace.cn/studio/anon/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.fizzspace.cn;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /studio/ {
        proxy_pass https://fizzdragon.fizzspace.cn/studio/studio/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.fizzspace.cn;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    # Java Content service
    location /user/ {
        proxy_pass https://fizzdragon.fizzspace.cn/content/user/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.fizzspace.cn;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /project/ {
        proxy_pass https://fizzdragon.fizzspace.cn/content/project/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.fizzspace.cn;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /vedio/ {
        proxy_pass https://fizzdragon.fizzspace.cn/content/vedio/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.fizzspace.cn;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /content/ {
        proxy_pass https://fizzdragon.fizzspace.cn/content/content/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.fizzspace.cn;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    # TanStack Start (fallback)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
    }
}
