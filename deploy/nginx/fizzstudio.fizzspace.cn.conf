server {
    listen 80;
    server_name fizzstudio.fizzspace.cn;

    location ^~ /.well-known/ {
        root /opt/webapps/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fizzstudio.fizzspace.cn;

    client_max_body_size 100m;
    ssl_certificate cert/fizzstudio.fizzspace.cn.pem;
    ssl_certificate_key cert/fizzstudio.fizzspace.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!3DES:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
