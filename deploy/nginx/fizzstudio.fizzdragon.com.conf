server {
    listen 80;
    server_name fizzstudio.fizzdragon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fizzstudio.fizzdragon.com;

    client_max_body_size 1000M;

    ssl_certificate /etc/nginx/ssl/fizzstudio.fizzdragon.com.pem;
    ssl_certificate_key /etc/nginx/ssl/fizzstudio.fizzdragon.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket endpoint for workflow events — long-lived, needs Upgrade
    # headers and a longer read timeout. Must precede the generic /aurora/
    # block so nginx picks the more specific prefix.
    location /aurora/workflow-events {
        proxy_pass https://20.198.160.91;
        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # New chat-events WS (replaces the old SSE stream). One WS per
    # conversation carrying message_added / message_updated / message_chunk /
    # agent_state. Same upgrade treatment as /aurora/workflow-events.
    location /aurora/chat/subscribe-conversation {
        proxy_pass https://20.198.160.91;
        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Per-user entity-events WS — cross-session cache invalidation for
    # worlds/assets. Same upgrade treatment as the other WS endpoints.
    location /aurora/entity-events/ {
        proxy_pass https://20.198.160.91;
        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Per-user notifications WS — bell badge + toast push. Needs the
    # same upgrade headers as the other WS blocks; without a specific
    # location it would fall through to the catch-all /aurora/ block
    # below (which intentionally omits Upgrade/Connection so plain
    # REST under /aurora/* isn't rejected by AKS ingress).
    location /aurora/notifications/subscribe {
        proxy_pass https://20.198.160.91;
        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Per-user quota WS — live consume / refund deltas. Same upgrade
    # treatment as the other WS blocks; the catch-all /aurora/ block
    # below would otherwise 404 the upgrade on the AKS side.
    location /aurora/quota/subscribe {
        proxy_pass https://20.198.160.91;
        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # NestJS server (/aurora prefix)
    location /aurora/ {
        proxy_pass https://20.198.160.91;
        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Java Studio service
    location /api/ {
        proxy_pass https://fizzdragon.com/studio/api/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /anon/ {
        proxy_pass https://fizzdragon.com/studio/anon/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /studio/ {
        proxy_pass https://fizzdragon.com/studio/studio/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    # Java Content service
    location /user/ {
        proxy_pass https://fizzdragon.com/content/user/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /project/ {
        proxy_pass https://fizzdragon.com/content/project/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /vedio/ {
        proxy_pass https://fizzdragon.com/content/vedio/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    location /content/ {
        proxy_pass https://fizzdragon.com/content/content/;
        proxy_http_version 1.1;
        proxy_set_header Host fizzdragon.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 900s;
    }

    # Web (Next.js on AKS) — Upgrade/Connection headers REMOVED because
    # AKS ingress-nginx returns 404 when Connection: upgrade arrives
    # without a matching Upgrade header (i.e. plain HTTP). All WS endpoints
    # live under /aurora/*, which has its own WS-aware blocks above.
    location / {
        proxy_pass https://20.198.160.91;
        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
    }
}
