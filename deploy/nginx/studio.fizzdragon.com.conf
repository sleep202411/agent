# studio.fizzdragon.com 虚拟主机配置
#
# 与 fizzdragon.com.conf 同形态，部署在 ECS1 同一台机器。差异只有:
#   - server_name
#   - ssl_certificate / ssl_certificate_key 路径
#   - access_log / error_log 文件名
# 其余 location / 反代 / Java 后端短路逻辑完全照抄。

# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name studio.fizzdragon.com;

    client_max_body_size 1000M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务器
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.fizzdragon.com;

    client_max_body_size 1000M;

    ssl_certificate /etc/nginx/ssl/studio.fizzdragon.com.pem;
    ssl_certificate_key /etc/nginx/ssl/studio.fizzdragon.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    add_header 'Access-Control-Max-Age' 86400 always;

    access_log /var/log/nginx/studio.fizzdragon.com.access.log;
    error_log /var/log/nginx/studio.fizzdragon.com.error.log;

    root /home/fizzdragon/dist/;
    index index.html index.htm;

  location / {
        proxy_pass https://fizzstudio.fizzdragon.com;
        proxy_http_version 1.1;

        proxy_set_header Host fizzstudio.fizzdragon.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_ssl_server_name on;
        proxy_ssl_name fizzstudio.fizzdragon.com;

        proxy_redirect       https://fizzstudio.fizzdragon.com/  https://studio.fizzdragon.com/;
        # Cookie domain rewritten to the apex (fizzdragon.com) — same as
        # fizzdragon.com.conf — so login state set on either host is
        # bidirectionally visible across all *.fizzdragon.com subdomains.
        proxy_cookie_domain  fizzstudio.fizzdragon.com           fizzdragon.com;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # /content/ 保持不变
    location /content/ {
        proxy_pass http://localhost:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_request_buffering off;
        proxy_redirect off;
    }

    # /studio/ 默认配置（api 正常访问）
    location /studio/ {
        proxy_pass http://localhost:8090/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering on;
        proxy_request_buffering off;
    }

    # ==============================================
    # ✅ 你要的精准规则：/studio/proxy → 8090/proxy
    # ==============================================
    location /studio/proxy/ {
        proxy_pass http://localhost:8090/proxy/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 专用修复
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_next_upstream off;
        proxy_set_header Connection "";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'OK\n';
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
