# studio.test.fizzdragon.com 虚拟主机配置

# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name studio.test.fizzdragon.com;

    client_max_body_size 1000M;
    # 上传/下载超时设置
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 缓冲区优化（避免内存溢出）
    proxy_request_buffering off;
    proxy_buffering off;
    # 其他代理头部
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # ACME 挑战用于 Certbot 证书续期
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.test.fizzdragon.com www.studio.test.fizzdragon.com;

    client_max_body_size 1000M;

    # 上传/下载超时设置
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 缓冲区优化
    proxy_request_buffering off;
    proxy_buffering off;

    # 其他代理头部
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # SSL 证书配置
    ssl_certificate /usr/local/nginx/ssl/studio.test.fizzdragon.com.pem;
    ssl_certificate_key /usr/local/nginx/ssl/studio.test.fizzdragon.com.key;

    # SSL 优化配置
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 现代加密套件
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # OCSP 装订
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全头部
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    # 日志配置
    access_log /var/log/nginx/studio.test.fizzdragon.com.access.log;
    error_log /var/log/nginx/studio.test.fizzdragon.com.error.log;

    # ===== 主要修改在这里 =====
    # 代理到 Next.js 容器
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # ===== 修改结束 =====

    # 健康检查端点
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
