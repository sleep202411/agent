# ============================================================================
# Default values — production-com.
# Staging / future envs override via -f values.<env>.yaml.
# ============================================================================

# ---------------------------------------------------------------------------
# Cluster-level identifiers (must match cluster-bootstrap)
# ---------------------------------------------------------------------------
azure:
  # Master switch for the Azure-specific layer (Key Vault CSI projection +
  # Workload Identity SA/labels). false on non-Azure clusters (CN/ACK), where
  # the projected Secrets are instead created out-of-band via kubectl.
  enabled: true
  tenantId: 04aa24ae-21ea-447d-b33e-a9b6bfeda97a
  keyVault:
    name: kv-fizzdragon-com
  workloadIdentity:
    # UAMI client ID — must match the SA annotation in cluster-bootstrap.
    clientId: a4bef907-12cf-4f90-bf1a-951be21e6371
    serviceAccountName: fizzdragon-com-app
# ---------------------------------------------------------------------------
# Image registry (ACR)
# CI bumps `tag` per service via `helm upgrade --set <svc>.image.tag=<sha>`.
# ---------------------------------------------------------------------------
image:
  registry: acrfizzdragoncom.azurecr.io
  pullPolicy: IfNotPresent

# Written by the CN deployment script. A selective release is refused when the
# live fingerprint differs, because Helm upgrades the whole release even when
# only one image tag changes.
cnRelease:
  chartFingerprint: unset
# ---------------------------------------------------------------------------
# Ingress — only `web` is internet-facing. server/agent stay ClusterIP.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # One Ingress resource is rendered per entry below — each can have its
  # own TLS Secret, its own optional path rewrite, and its own optional
  # cert-manager ClusterIssuer.
  #
  # TLS Secret strategy (locked-in 2026-05-18):
  #   We use user-uploaded DigiCert certs stored as plain K8s TLS Secrets
  #   (created out-of-band via `kubectl create secret tls`, not in this
  #   chart so private keys never enter git). When a Secret already exists
  #   AND certManager is empty, ingress-nginx serves it as-is.
  #
  #   When DigiCert nears expiry (~2026-10), either upload renewed
  #   DigiCert and replace the same Secret, OR set certManager:
  #   letsencrypt-prod on the entry to flip to LE auto-renewal. cert-manager
  #   is already installed and ready (cluster-bootstrap), just dormant.
  entries:
    - name: main
      # Production host. DNS currently points at 136 ECS; flip to this
      # AKS LB IP (20.198.160.91) when ready to cut over.
      host: fizzstudio.fizzdragon.com
      secretName: fizzdragon-tls
      certManager: "" # empty = use pre-uploaded Secret, no cert-manager involvement
      rewriteTarget: "" # no path rewrite, serve full Next.js app
      # admin-ui lives on its dedicated host admin.fizzdragon.com (admin-fd entry).
      # A redundant admin-ui sub-ingress here resolved to path "/" (shared global
      # adminUi.ingress.path) and collided with this host's web "/" → the nginx
      # admission webhook rejected it, blocking ArgoCD sync. Off here.
      adminUi: false
    - name: studio
      # Dedicated subdomain for the standalone FizzStudio app (apps/studio).
      # The host was never publicly used while it pointed at the web app, so
      # flipping the backend is migration-free. /aurora/* still routes to the
      # server via the per-host aurora ingress.
      host: studio.fizzdragon.com
      secretName: fizzdragon-studio-tls
      certManager: ""
      rewriteTarget: ""
      adminUi: false
      service: studio
    - name: admin-fd
      # Dedicated admin host, moved off the legacy Java box (47.84.16.145) to
      # AKS on 2026-06-11. `adminUiOnly` renders ONLY the admin-ui ingress
      # (no web/aurora on this host); served at ROOT (basePath "/"). TLS is
      # auto-issued + auto-renewed by cert-manager via Let's Encrypt (unlike
      # the main/studio hosts which still serve hand-uploaded DigiCerts).
      host: admin.fizzdragon.com
      secretName: admin-fizzdragon-tls
      certManager: letsencrypt-prod
      rewriteTarget: ""
      adminUi: true
      adminUiOnly: true
# ---------------------------------------------------------------------------
# Shared environment (non-secret config) injected into every app pod
# that needs it. Secrets live in Key Vault, see secretProviderClass below.
# ---------------------------------------------------------------------------
sharedEnv:
  JAVA_STUDIO_URL: https://java.fizzdragon.com/studio
  JAVA_CONTENT_URL: https://java.fizzdragon.com/content
  USER_AVATAR_BASE_URL: https://user-aratar-sg.oss-ap-southeast-1.aliyuncs.com
  # Bailian's workspace-scoped domain, which Alibaba recommends over the shared
  # dashscope-intl gateway for latency and stability. Same key, same catalogue —
  # verified: both serve the identical 156 models.
  ALIBABA_BASE_URL: https://llm-5bmlxd1jjvyn71k0.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  # Agent LLM (StoryOS / personas). Blob container name is historical.
  AZURE_OPENAI_BASE_URL: https://fizzdragon-ai-foundry.openai.azure.com/openai/v1
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_BLOB_CONTAINER: foundry-outputs
  STORYOS_ROUTER_PROVIDER: anthropic
  STORYOS_ROUTER_MODEL: claude-sonnet-4-5
  STORYOS_PERSONA_PROVIDER: deepseek
  STORYOS_PERSONA_MODEL: deepseek-v4-flash
  LOG_LEVEL: info
# ---------------------------------------------------------------------------
# Secret Provider Class — KV → projected K8s Secret `fizzdragon-secrets`.
# Pods pull values via `envFrom: secretRef: fizzdragon-secrets`.
# Every entry maps a KV secret name → the env var name the app expects.
# ---------------------------------------------------------------------------
secrets:
  # K8s Secret name (after projection). Bumped only on schema changes.
  projectedName: fizzdragon-secrets
  # KV secret name → env var name inside the pod.
  mapping:
    - kv: alibaba-api-key
      env: ALIBABA_API_KEY
    - kv: deepseek-api-key
      env: DEEPSEEK_API_KEY
    - kv: anthropic-api-key
      env: ANTHROPIC_API_KEY
    # Agent chat models (not AI Job generation).
    - kv: azure-openai-api-key
      env: AZURE_OPENAI_API_KEY
    # Agent project-cover Flux calls only — AI Job gen does not use Replicate.
    - kv: image-cover-key
      env: REPLICATE_API_TOKEN
    - kv: fal-api-key
      env: FAL_API_KEY
    # Bailian (Model Studio) — one key serves Qwen, DeepSeek, GLM and Kimi in the
    # workspace. Named for the product, not for the SDK that used to read it.
    - kv: bailian-api-key
      env: BAILIAN_API_KEY
    - kv: byteplus-modelark-api-key
      env: BYTEPLUS_MODELARK_API_KEY
    # Seed Speech — dedicated BytePlus voice key, not the ModelArk inference key.
    - kv: byteplus-seed-speech-api-key
      env: BYTEPLUS_SEED_SPEECH_API_KEY
    # MiniMax Open Platform (MiniMax-H3 video). PREREQUISITE: create
    # `minimax-api-key` in Key Vault BEFORE deploying — CSI is fail-closed.
    - kv: minimax-api-key
      env: MINIMAX_API_KEY
    # ModelArk ASSETS plane (character likeness / liveness) — separate AK/SK
    # from the inference Bearer key; worker pods run the sync queues so these
    # live in the shared mapping. UNCOMMENT ONLY AFTER the KV secrets exist —
    # the CSI projection is fail-closed, so a mapping to a missing KV entry
    # breaks the whole projected Secret.
    # AK/SK live in KV (2026-07-08) for the AIGC media-asset registration track.
    - kv: byteplus-assets-ak
      env: BYTEPLUS_ASSETS_AK
    - kv: byteplus-assets-sk
      env: BYTEPLUS_ASSETS_SK
    # Enrollment token is real-person LIVENESS only (not AIGC). Keep commented
    # until the KV secret exists — uncommenting without it breaks the projection.
    # - kv: character-enrollment-token-key
    #   env: CHARACTER_ENROLLMENT_TOKEN_KEY
    - kv: blob-conn-string
      env: AZURE_BLOB_CONNECTION_STRING
    - kv: db-conn-string
      env: DATABASE_URL
    - kv: java-user-query-pwd
      env: JAVA_USER_QUERY_PWD
    # Managed Azure Cache for Redis (Basic C0). Replaces in-cluster Redis.
    # `redis-conn-string` is the rediss:// URL apps consume as REDIS_URL.
    # `redis-address` + `redis-password` are split form for KEDA's Redis
    # scaler (it wants host:port + password as separate fields, not a URL).
    - kv: redis-conn-string
      env: REDIS_URL
    - kv: redis-address
      env: REDIS_ADDRESS
    - kv: redis-password
      env: REDIS_PASSWORD
# Server-only secrets. Keep payment provider credentials out of web, agent,
# and worker pods; only NestJS billing routes need these values.
serverSecrets:
  projectedName: fizzdragon-server-secrets
  mapping:
    # Required by the project publication gateway. Reuse the regional Java
    # admin credential from Key Vault; only Nest and admin-ui receive it.
    - kv: java-admin-api-token
      env: JAVA_ADMIN_API_TOKEN
    - kv: airwallex-client-id
      env: AIRWALLEX_CLIENT_ID
    - kv: airwallex-api-key
      env: AIRWALLEX_API_KEY
    - kv: airwallex-login-as-account-id
      env: AIRWALLEX_LOGIN_AS_ACCOUNT_ID
    - kv: airwallex-linked-payment-account-id
      env: AIRWALLEX_LINKED_PAYMENT_ACCOUNT_ID
    - kv: airwallex-webhook-secret
      env: AIRWALLEX_WEBHOOK_SECRET
    # AppLovin (Axon) Conversions API access token — the "Reporting Key" from the
    # Axon dashboard (Account → General → Keys). Powers server-side purchase (S2S)
    # reporting for community billing. PREREQUISITE: create `axon-capi-access-token`
    # in Key Vault BEFORE deploying — the CSI projection is fail-closed.
    - kv: axon-capi-access-token
      env: AXON_CAPI_ACCESS_TOKEN
    # Required before server rollout: 32 random bytes encoded as 64 hex characters.
    # Preserve this key; saved creator bank details depend on it.
    - kv: creator-payout-details-key
      env: CREATOR_PAYOUT_DETAILS_KEY
    - kv: admin-mfa-secret-key
      env: ADMIN_MFA_SECRET_KEY
    - kv: legacy-mysql-user
      env: LEGACY_MYSQL_USER
    - kv: legacy-mysql-password
      env: LEGACY_MYSQL_PASSWORD
    - kv: agnes-api-key
      env: AGNES_API_KEY
    # HMAC token-signing secret for the self-hosted realtime WS plane
    # (REALTIME_TRANSPORT=self-hosted). PREREQUISITE: create the `realtime-ws-secret`
    # secret in Key Vault BEFORE deploying — the CSI projection fails if absent.
    # Shared Ably ROOT credential for server-owned token signing and
    # Conversations delivery. Nest signs least-privilege browser credentials,
    # publishes ordinary Conversations frames with Ably REST, and publishes
    # committed crew messages to Ably Chat REST. It opens no Ably Realtime
    # socket. Agent OS live events use the same server-owned credential.
    # PREREQUISITE: `ably-api-key` must exist in Key Vault BEFORE this ships.
    # The CSI projection is fail-closed — a mapping to a missing entry breaks
    # the WHOLE fizzdragon-server-secrets Secret, taking every other env var in
    # it down with it (Airwallex, admin MFA, legacy MySQL, the realtime HMAC).
    - kv: ably-api-key
      env: ABLY_API_KEY
    - kv: realtime-ws-secret
      env: REALTIME_WS_SECRET
    # Java points-migration bridge shared secret (/internal/points x-service-token).
    # PREREQUISITE: create `internal-service-token` in Key Vault BEFORE deploying —
    # the CSI projection fails if absent. (Set in kv-fizzdragon-com 2026-06-22.)
    - kv: internal-service-token
      env: INTERNAL_SERVICE_TOKEN
    # BoldSign production rollout (global/EU cell only). Keep these commented
    # until all three values exist in kv-fizzdragon-com; the CSI projection is
    # fail-closed. Then uncomment them and flip server.env.BOLDSIGN_ENABLED.
    # The sandbox API key/template created during local integration work must
    # never be copied into these production secret names.
    # - kv: boldsign-api-key
    #   env: BOLDSIGN_API_KEY
    # - kv: boldsign-crew-agreement-template-id
    #   env: BOLDSIGN_CREW_AGREEMENT_TEMPLATE_ID
    # - kv: boldsign-webhook-secret
    #   env: BOLDSIGN_WEBHOOK_SECRET
# Agent OS worker credentials — its OWN projection, deliberately not
# fizzdragon-server-secrets. CSI is fail-closed, so one bad entry breaks a whole
# projected Secret; keeping these apart means an unprovisioned Agent OS cannot
# take billing, auth and the legacy-MySQL bridge down with it.
agentOsSecrets:
  projectedName: fizzdragon-agent-os-secrets
  mapping:
    # The gateway<->worker boundary, checked in BOTH directions. The worker
    # refuses to boot without it, and the server rejects the .env.example value.
    - kv: agent-os-internal-token
      env: AGENT_OS_INTERNAL_TOKEN
    # Bailian's key. The vault entry names the vendor; the variable names the
    # protocol, because the endpoint is OpenAI-compatible and need not be Bailian.
    - kv: bailian-api-key
      env: AGENT_OS_OPENAI_API_KEY
    # Live event delivery. Optional at runtime — the UI falls back to the Nest
    # poll — but a missing vault entry breaks this WHOLE projection, taking the
    # internal token with it and stopping the worker from booting.
    - kv: ably-api-key
      env: ABLY_API_KEY
    # Durable LangGraph checkpoints and the execution-fence authority. The
    # worker refuses to boot without this scoped DSN; it must address the same
    # PostgreSQL database as public.agent_os_runs and allow DDL in agent_os.
    - kv: agent-os-checkpoint-database-url
      env: AGENT_OS_CHECKPOINT_DATABASE_URL
# The same vault entry projected a second time, for the Nest pod. Separate group
# for the same fail-closed reason: the server must not lose its own secrets
# because an Agent OS entry is missing.
agentOsServerSecrets:
  projectedName: fizzdragon-agent-os-server-secrets
  mapping:
    - kv: agent-os-internal-token
      env: AGENT_OS_INTERNAL_TOKEN

# admin-ui-only secret (least-privilege). The internet-facing ops console needs
# exactly ONE secret — the Java admin X-Admin-Api-Token used by news and text
# games — so it gets its OWN scoped
# projection, NOT the shared fizzdragon-secrets (which holds DB/Redis/LLM/blob
# creds — never pour those into a public-facing admin console).
# PREREQUISITE: create `java-admin-api-token` in Key Vault BEFORE deploying (CSI
# is fail-closed). On non-Azure clusters (CN/ACK) azure.enabled=false → inert.
adminUiSecrets:
  projectedName: fizzdragon-adminui-secrets
  mapping:
    # One token authenticates every Java admin call — 资讯 and 文游审核 both send
    # it as X-Admin-Api-Token. It was once named for the news module alone; the
    # Key Vault entry now carries the neutral name so nobody retires it while
    # decommissioning news. CSI is fail-closed: this key must exist in the vault
    # before this file references it, or admin-ui pods hang in ContainerCreating.
    - kv: java-admin-api-token
      env: JAVA_ADMIN_API_TOKEN
# ---------------------------------------------------------------------------
# web — Next.js front-of-stack. Public via Ingress.
# ---------------------------------------------------------------------------
web:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-web
    tag: 39fb16b650525d2d53a16e99d48ab50c3a8a28d9
  containerPort: 3000
  env:
    SERVER_URL: http://fizzdragon-server:3001
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule

# ---------------------------------------------------------------------------
# studio — the standalone FizzStudio app (apps/studio) on
# studio.fizzdragon.com. No secrets: backend access is the per-host /aurora
# ingress (browser-side) with the satoken cookie; the in-cluster rewrite
# below only covers SSR-side fetches.
# ---------------------------------------------------------------------------
studio:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-studio
    tag: 39fb16b650525d2d53a16e99d48ab50c3a8a28d9
  containerPort: 3000
  env:
    AURORA_PROXY_TARGET: http://fizzdragon-server:3001
    AURORA_STRIP_PREFIX: "1"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule

# ---------------------------------------------------------------------------
# admin-ui — internal operations console. Public host is temporary:
# https://fizzstudio.fizzdragon.com/admin
# Keep the ingress fail-closed until operator public IP CIDRs are set.
# ---------------------------------------------------------------------------
adminUi:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-admin-ui
    tag: 39fb16b650525d2d53a16e99d48ab50c3a8a28d9
  containerPort: 3000
  readinessPath: /login
  livenessPath: /login
  ingress:
    enabled: true
    path: /
    # No IP allowlist — admin is gated by login + MFA. The operator egress IP
    # rotates (VPN pool: e.g. 148.197.248.23 / 80.239.216.133 seen seconds apart),
    # so a single-CIDR lock isn't workable. To re-restrict, set this to a stable
    # operator CIDR, e.g. ["203.0.113.10/32"]; empty list = open.
    allowedCidrs: []
  env:
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_PUBLIC_ADMIN_UI_BASE_PATH: /
    ADMIN_SITE: global
    ADMIN_GLOBAL_API_BASE_URL: http://fizzdragon-server:3001/admin
    ADMIN_API_BASE_URL: http://fizzdragon-server:3001/admin
    # 资讯 (news) admin module → Java backend; the /content prefix is essential
    # (apex without it 302s to a different Sa-Token service).
    NEWS_API_BASE_URL: https://java.fizzdragon.com/content
    # 文游审核 → Java Studio。仅由 admin-ui 服务端调用，浏览器不直接访问。
    TEXT_GAME_API_BASE_URL: https://java.fizzdragon.com/studio
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# server — NestJS API. Internal (ClusterIP).
# ---------------------------------------------------------------------------
server:
  enabled: true
  # HA is already provided by the out-of-band HPA (min 3 replicas) — the realtime
  # plane is multi-pod, so this is just the pre-autoscale seed (ArgoCD ignores
  # /spec/replicas drift; the HPA owns the live count). The PodDisruptionBudget
  # (minAvailable: 1) keeps a node drain / rollout from ever dropping it to zero.
  replicaCount: 1
  # Graceful drain window: the preStop sleep deregisters the pod from the Service,
  # then the WS gateway closes sockets so clients reconnect to a healthy pod.
  terminationGracePeriodSeconds: 45
  migrateOnStart: true
  migrationJob:
    enabled: false
    revision: ""
    backupId: ""
    ttlSecondsAfterFinished: 86400
  image:
    repository: fizzdragon-server
    tag: 39fb16b650525d2d53a16e99d48ab50c3a8a28d9
  containerPort: 3001
  # Cloudflare R2 credentials, created with `kubectl create secret generic
  # fizzdragon-r2` rather than projected from Key Vault. Mounted optional, so this
  # list is safe to carry into a cell that has no such secret.
  extraSecretRefs:
    - fizzdragon-r2
  # Direct Google media generation through Vertex AI. ADC is supplied by
  # AKS→GCP Workload Identity Federation; no API key or service-account key is
  # stored in Kubernetes. These identifiers restore the already-provisioned
  # federation previously used by the retired agent platform worker.
  googleVertex:
    enabled: true
    project: glass-proxy-501907-d2
    imageLocation: global
    videoLocation: us-central1
    workloadIdentityFederation:
      projectNumber: "553701186007"
      pool: fizzdragon-aks
      provider: aks-com
      serviceAccountEmail: fizzdragon-agent-platform@glass-proxy-501907-d2.iam.gserviceaccount.com
  env:
    JAVA_ADMIN_API_TOKEN_HEADER: X-Admin-Api-Token
    # COM Java /user/levels/options verified 2026-10-06. FDY is not FD.
    # Public catalogue IDs, not credentials; CN must supply its own mapping.
    CREW_QUALIFICATION_CATALOG_JSON: '{"fdLevels":[{"id":1,"rank":1},{"id":2,"rank":2},{"id":3,"rank":3},{"id":7,"rank":4},{"id":8,"rank":5}],"skills":{"AI Producer":[13],"Art Director":[14],"Director":[15],"Editor":[16],"Music Composer":[17],"Instructor":[18],"Writer":[19]}}'
    # Emergency pause: Java still calls register_bonus after disabling its
    # legacy 500-point grant. Nest answers successfully without minting points.
    REGISTRATION_COMPUTE_BONUS_PAUSED: "true"
    # V8 heap in a 1Gi cgroup sits around ~476Mi and OOMs the API+WS+outbox
    # process under collab load (P2028 follows: Prisma maxWait cannot start a
    # transaction while GC is thrashing). 1536 leaves ~500Mi of the 2Gi limit
    # for native buffers / Y.Doc / pg. Do not raise replicaCount to "fix" heap.
    NODE_OPTIONS: "--max-old-space-size=1536"
    # Required public web origin for invitation links (CN overrides explicitly).
    NEXT_PUBLIC_SITE_REGION: global
    REFERRAL_INVITE_BASE_URL: https://fizzdragon.com
    # Required region-owned base for relative legacy Java project cover keys.
    # Never default this in code: an omitted value must fail the server at boot
    # instead of silently resolving .com/.cn data against another region.
    LEGACY_OSS_BASE_URL: https://fizzstudio-sg.oss-ap-southeast-1.aliyuncs.com
    # Mobile H5 generation defaults. Region-owned deploy facts — both ids must
    # exist (active + bound + provider credential present) in THIS region's
    # catalog or the server refuses to boot (StoryMobileModelDefaultsService).
    # No code fallback by design: a default pointing at a canonical the region
    # never catalogued must fail the rollout, not the user's quote.
    AGENT_OS_MOBILE_IMAGE_MODEL: wan-image-2.7
    AGENT_OS_MOBILE_VIDEO_MODEL: minimax-h3
    # Region-owned banner bucket that holds crew logos (relative keys). The admin
    # DTOs resolve crew.logo to an absolute URL with this base.
    BANNER_BASE_URL: https://fizzdragon-banner-sg.oss-ap-southeast-1.aliyuncs.com
    # Public, versioned preview media for the Git-governed Project Skill catalog.
    PROJECT_SKILL_PREVIEW_BASE_URL: https://r2.fizzdragon.com/product-skills/previews/v1
    FAL_ENABLED: "true"
    # Happy Oyster is a realtime world-model capability, not an ordinary fal
    # image/video preset. Its own explicit gate keeps provider availability and
    # boot-time credential validation independent from AI generation routing.
    WORLD_MODEL_HAPPY_OYSTER_ENABLED: "true"
    # BoldSign is intentionally OFF until the production API key, production
    # template ID, and webhook HMAC secret have all been provisioned in Key
    # Vault and mapped into fizzdragon-server-secrets. Once provisioned, flip
    # this to "true"; the server then fails startup on any missing credential.
    # Public callback: https://fizzdragon.com/aurora/webhooks/boldsign
    BOLDSIGN_ENABLED: "false"
    BOLDSIGN_API_BASE_URL: https://api-eu.boldsign.com
    BOLDSIGN_CREW_AGREEMENT_ROLE_INDEX: "1"
    BOLDSIGN_WEBHOOK_TOLERANCE_SECONDS: "300"
    # Cloudflare R2 over the S3-compatible API. `auto` is R2's only region and
    # path-style is required; the bucket is APAC-placed to sit beside the cluster.
    # Credentials (S3_ACCESS_KEY_ID / S3_ACCESS_KEY_SECRET) come from the
    # fizzdragon-r2 secret above. Cell default for com/global is s3_compatible
    # (R2); set OUTPUT_STORAGE_PROVIDER=azure_blob only to roll NEW writes back.
    # Existing MediaAsset rows keep reading from whatever provider they store.
    S3_ENDPOINT: https://c378107772065c0671dc6b2a00c06412.r2.cloudflarestorage.com
    S3_BUCKET: fizzdragon-media
    S3_REGION: auto
    S3_FORCE_PATH_STYLE: "true"
    # The S3 endpoint above is NOT publicly readable; this custom domain is what
    # the bucket serves on. Published chapter manifest URLs are minted from it,
    # and the publisher refuses to release without it rather than hand Java the
    # resolver's AWS-shaped fallback host, which does not exist for R2.
    MEDIA_PUBLIC_BASE_URL_S3_COMPATIBLE: https://r2.fizzdragon.com
    BAILIAN_ENABLED: "true"
    BYTEPLUS_MODELARK_ENABLED: "true"
    BYTEPLUS_SEED_SPEECH_ENABLED: "true"
    # MiniMax-H3 video (api.minimax.io). Key from KV: minimax-api-key.
    MINIMAX_ENABLED: "true"
    # BytePlus ModelArk ASSETS plane — register canvas MediaAssets as AIGC assets.
    # AK/SK come from KV (serverSecrets mapping). ACR = the paid capacity-reservation
    # subscription; its expiry is not queryable via API, so it's declared here and
    # drives the T-7d new-registration hard-block + 15d post-expiry grace window.
    MEDIA_ASSET_AIGC_REGISTRATION_ENABLED: "true"
    BYTEPLUS_ACR_EXPIRES_AT: "2027-06-29T16:59:59+08:00"
    PORT: "3001"
    AI_PROVIDER: alibaba
    # Agent User runner. First trial: ON + run-a-cycle-on-boot for observability.
    # Model MUST be a non-reasoning model — the default qwen3.6-plus (reasoning)
    # fails generateObject's structured-output schema (verified: qwen-plus OK ~2s,
    # qwen3.6-plus/qwen-max fail schema). Other knobs use code defaults (interval
    # 5m, 3 agents/tick, 3 actions/run, 60m/agent spacing).
    AGENT_USER_RUNNER_ENABLED: "true"
    AGENT_USER_RUNNER_RUN_ON_BOOT: "true"
    AGENT_USER_RUNNER_MODEL: qwen-plus
    # 公共媒体经 Front Door CDN 出（media.fizzdragon.com → FD → Blob）。
    # 删除/置空即回退为直连 blob（媒体 URL 由 server 读取时拼接）。
    MEDIA_PUBLIC_BASE_URL_AZURE_BLOB: https://media.fizzdragon.com
    # REDIS_URL comes from KV via projected `fizzdragon-secrets` (envFrom).
    MASTRA_URL: http://fizzdragon-agent:4111
    # Unified self-hosted realtime for ALL cells (collab already self-hosts; asset
    # /job pushes moved off Azure Web PubSub too, so there is no CN/COM transport
    # split). Requires REALTIME_WS_SECRET (serverSecrets below). Web PubSub was
    # decommissioned (P5) — self-hosted is the only transport; any other value
    # (e.g. unset) selects the no-op provider, so realtime stays off in local dev.
    REALTIME_TRANSPORT: self-hosted
    DISABLE_CONTENT_MODERATION: "false"
    AUTH_DISABLED: "false"
    # Incident 2026-09-25: consult the shared Redis user-ID blocklist on every
    # authenticated request, including a Java session served from Nest's cache.
    # Also blocks the exact bulk-signup email shape while new IDs are discovered.
    # Turn off after the incident has been resolved and reviewed.
    EMERGENCY_USER_BLOCKLIST_ENABLED: "true"
    PAYMENT_PROVIDER: airwallex
    AIRWALLEX_API_BASE_URL: https://api.airwallex.com
    # AppLovin (Axon) server-side Conversions API. AXON_PIXEL_ID is the
    # non-secret pixel/event key (same value as web NEXT_PUBLIC_AXON_PIXEL_KEY);
    # the AXON_CAPI_ACCESS_TOKEN secret is projected from Key Vault (serverSecrets
    # mapping below). The S2S reporter is a no-op until BOTH are set.
    AXON_PIXEL_ID: d34d9c48-8032-4b5e-a28a-2fa3082efb73
    # Billing checkout success/back URLs must originate from one of these. The
    # AKS web host (fizzstudio.fizzdragon.com) is NOT in the code's hardcoded
    # allowlist, so it must be listed here. localhost:9527 is for local testing
    # against prod — remove once recharge is validated.
    BILLING_ALLOWED_RETURN_ORIGINS: "https://fizzstudio.fizzdragon.com,https://fizzdragon.com,http://localhost:9527"
    # Legacy Java MySQL bridge (用户管理 / legacy points). Cross-cloud: this
    # Azure-AKS server reaches the Alibaba Singapore PolarDB over its PUBLIC
    # endpoint; the AKS egress IP (20.247.195.70) is whitelisted in the
    # `aks_com_prod` group on cluster pc-gs5p5dvjj5twh7w86. USER/PASSWORD come
    # from Key Vault via serverSecrets below.
    LEGACY_MYSQL_ENABLED: "true"
    LEGACY_MYSQL_HOST: fizzdragon-sg.rwlb.singapore.rds.aliyuncs.com
    LEGACY_MYSQL_PORT: "3306"
    LEGACY_MYSQL_DATABASE: fizzdragon_client
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: 1500m, memory: 2Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# agent-os — the Agent OS worker (LangGraph interactive runtime, apps/agent-os).
# A plain long-lived HTTP service on ClusterIP; the Nest server pod is its only
# caller. Every /v1 route checks x-agent-os-internal-token; /health is open so
# the kubelet can probe it.
# ---------------------------------------------------------------------------
agentOs:
  enabled: true
  # Runs, HITL commands, dispatch leases, journal suffixes and checkpoints are
  # PostgreSQL-authoritative. Replicas coordinate through fenced dispatch and
  # the per-conversation checkpoint execution lock.
  replicaCount: 1
  image:
    repository: fizzdragon-agent-os
    tag: 345482a8866edf93590cf6ba374f12d9e8f65ce9
  containerPort: 4301
  # Covers the preStop drain only — the process installs no SIGTERM handler, so
  # a longer window buys nothing.
  terminationGracePeriodSeconds: 30
  model:
    # Bailian's workspace domain. The key is a Key Vault value, never here.
    baseUrl: https://llm-5bmlxd1jjvyn71k0.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    viewerProfile: qwen3.7-plus
  checkpoint:
    schema: agent_os
    # Per-pod budget: saver transactions are short; guard sessions are pinned
    # only while a graph owns a conversation. Keep explicit for replica sizing.
    poolMax: 10
    lockPoolMax: 20
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }
  networkPolicy:
    enabled: true
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
      port: 53
    # The "except" list of the external rule. Without these the 0.0.0.0/0 rule
    # is an in-cluster allow-all.
    clusterCidrs:
      - 10.0.0.0/16
      - 10.244.0.0/16
    httpsPort: 443
    databasePort: 5432
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule

# ---------------------------------------------------------------------------
# agent — Mastra API. Internal. Storage in PG schema `mastra` (no PVC).
# ---------------------------------------------------------------------------
agent:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-agent
    tag: local-fix-20260522-stuck-lock
  containerPort: 4111
  env:
    PORT: "4111"
    MASTRA_HOST: "0.0.0.0"
    # DATABASE_URL + REDIS_URL come from KV via projected `fizzdragon-secrets`
    # (envFrom). Mastra storage uses PG schema `mastra` — see
    # apps/agent/src/mastra/index.ts.
    # Per-pod Anthropic concurrency cap. Tier 3 (160K OTPM) — 4 pods × 20
    # = 80 global active, ~80K OTPM peak, well under the 160K cap. Was
    # temporarily 6 under Tier 2; restored to 20 (the original default)
    # after Tier 3 upgrade 2026-05-23. See model-hardening.ts (RateLimiter).
    STORYOS_CLAUDE_MAX_CONCURRENCY: "20"
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 3Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# agent-worker — BullMQ consumer. Same image, different command.
# Scales 0→N via KEDA on BullMQ queue depth (Redis Lists).
# Storage in PG schema `mastra` — agent + agent-worker share PG, not a
# libsql file.
# ---------------------------------------------------------------------------
agentWorker:
  enabled: true
  # When keda.enabled=false this is the fixed replica count; when true,
  # KEDA's ScaledObject owns it (chart omits .spec.replicas in that case).
  # Start at 1 so the worker pool isn't empty before KEDA wakes up.
  replicaCount: 1
  image:
    repository: fizzdragon-agent
    tag: local-fix-20260522-stuck-lock
  command: ["npx", "tsx", "src/worker.ts"]
  env:
    # DATABASE_URL + REDIS_URL come from KV via projected `fizzdragon-secrets`
    # (envFrom).
    # Lower per-pod concurrency than the ECS-era 90 because B2as_v2 nodes
    # are 2c8g (vs ECS 8c16g single-host). KEDA scales pod count to make
    # up total throughput: 6 pods × 15 = 90 ≈ ECS baseline.
    WORKER_CONCURRENCY: "15"
    IMAGE_WORKER_CONCURRENCY: "2"
    STORYBOARD_GENERATE_CONCURRENCY: "6"
    # Match agent's Anthropic cap — workflow runs hit the same router.
    STORYOS_CLAUDE_MAX_CONCURRENCY: "20"
  # Pod fits cleanly on B2as_v2 (8GB node). At WORKER_CONCURRENCY=15 with
  # ~50MB per in-flight workflow, working set ~750MB + base 500MB ≈ 1.5Gi.
  # 3Gi limit leaves headroom for bulk phases (storyboard 30 shots batched).
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 1500m, memory: 3Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
  keda:
    enabled: true # On from day 1 — full production form.
    minReplicas: 1 # Keep at least one worker pod warm (queue is always-on).
    maxReplicas: 6 # 6 × WORKER_CONCURRENCY 15 = 90 ≈ ECS baseline.
    cooldownPeriod: 600 # 10 min before scaling down, matches docker-compose memory behaviour.
    pollingInterval: 15
    # Azure managed Redis is TLS-only (6380); Aliyun community Redis is plaintext 6379.
    enableTLS: "true"
    # BullMQ queue list watched by the redis scaler.
    # Names mirror QUEUE_NAME / IMAGE_QUEUE_NAME in apps/agent/src/mastra/workflows/engine/.
    queues:
      - bull:storyos-workflows:wait
      - bull:asset-images:wait
# ---------------------------------------------------------------------------
# Redis — MANAGED via Azure Cache for Redis Basic C0 (`redis-fizzdragon-com`).
# No in-cluster StatefulSet. Apps get rediss:// URL from KV `redis-conn-string`
# projected as REDIS_URL. KEDA gets host:port + password via TriggerAuthentication
# (templates/keda-trigger-authentication.yaml) reading from the same projected
# Secret.
#
# Upgrade path: bump SKU in Azure (Basic C0 → Standard C0 for HA, ~$32/mo).
# No chart change needed; KV connection string transparently rotates.
# ---------------------------------------------------------------------------
# Postgres — also managed (Azure PG `fizzdragon-ai-pg`). Same conn string is
# in KV `db-conn-string`, projected as `DATABASE_URL`. server (Prisma) owns
# `public.*` schema; agent (Mastra + raw pg for artifact-store) owns
# `mastra.*` schema. No PVC, no in-cluster DB, no shared filesystem.
