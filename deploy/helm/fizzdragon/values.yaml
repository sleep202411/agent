# ============================================================================
# Default values — production-com.
# Staging / future envs override via -f values.<env>.yaml.
# ============================================================================

# ---------------------------------------------------------------------------
# Cluster-level identifiers (must match cluster-bootstrap)
# ---------------------------------------------------------------------------
azure:
  # Master switch for the Azure-specific layer (Key Vault CSI projection +
  # Workload Identity SA/labels). false on non-Azure clusters (CN/ACK), where
  # the projected Secrets are instead created out-of-band via kubectl.
  enabled: true
  tenantId: 04aa24ae-21ea-447d-b33e-a9b6bfeda97a
  keyVault:
    name: kv-fizzdragon-com
  workloadIdentity:
    # UAMI client ID — must match the SA annotation in cluster-bootstrap.
    clientId: a4bef907-12cf-4f90-bf1a-951be21e6371
    serviceAccountName: fizzdragon-com-app
# ---------------------------------------------------------------------------
# Image registry (ACR)
# CI bumps `tag` per service via `helm upgrade --set <svc>.image.tag=<sha>`.
# ---------------------------------------------------------------------------
image:
  registry: acrfizzdragoncom.azurecr.io
  pullPolicy: IfNotPresent
# ---------------------------------------------------------------------------
# Ingress — only `web` is internet-facing. server/agent stay ClusterIP.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # One Ingress resource is rendered per entry below — each can have its
  # own TLS Secret, its own optional path rewrite, and its own optional
  # cert-manager ClusterIssuer.
  #
  # TLS Secret strategy (locked-in 2026-05-18):
  #   We use user-uploaded DigiCert certs stored as plain K8s TLS Secrets
  #   (created out-of-band via `kubectl create secret tls`, not in this
  #   chart so private keys never enter git). When a Secret already exists
  #   AND certManager is empty, ingress-nginx serves it as-is.
  #
  #   When DigiCert nears expiry (~2026-10), either upload renewed
  #   DigiCert and replace the same Secret, OR set certManager:
  #   letsencrypt-prod on the entry to flip to LE auto-renewal. cert-manager
  #   is already installed and ready (cluster-bootstrap), just dormant.
  entries:
    - name: main
      # Production host. DNS currently points at 136 ECS; flip to this
      # AKS LB IP (20.198.160.91) when ready to cut over.
      host: fizzstudio.fizzdragon.com
      secretName: fizzdragon-tls
      certManager: "" # empty = use pre-uploaded Secret, no cert-manager involvement
      rewriteTarget: "" # no path rewrite, serve full Next.js app
      # admin-ui lives on its dedicated host admin.fizzdragon.com (admin-fd entry).
      # A redundant admin-ui sub-ingress here resolved to path "/" (shared global
      # adminUi.ingress.path) and collided with this host's web "/" → the nginx
      # admission webhook rejected it, blocking ArgoCD sync. Off here.
      adminUi: false
    - name: studio
      # Dedicated subdomain for the standalone FizzStudio app (apps/studio).
      # The host was never publicly used while it pointed at the web app, so
      # flipping the backend is migration-free. /aurora/* still routes to the
      # server via the per-host aurora ingress.
      host: studio.fizzdragon.com
      secretName: fizzdragon-studio-tls
      certManager: ""
      rewriteTarget: ""
      adminUi: false
      service: studio
    - name: admin-fd
      # Dedicated admin host, moved off the legacy Java box (47.84.16.145) to
      # AKS on 2026-06-11. `adminUiOnly` renders ONLY the admin-ui ingress
      # (no web/aurora on this host); served at ROOT (basePath "/"). TLS is
      # auto-issued + auto-renewed by cert-manager via Let's Encrypt (unlike
      # the main/studio hosts which still serve hand-uploaded DigiCerts).
      host: admin.fizzdragon.com
      secretName: admin-fizzdragon-tls
      certManager: letsencrypt-prod
      rewriteTarget: ""
      adminUi: true
      adminUiOnly: true
# ---------------------------------------------------------------------------
# Shared environment (non-secret config) injected into every app pod
# that needs it. Secrets live in Key Vault, see secretProviderClass below.
# ---------------------------------------------------------------------------
sharedEnv:
  JAVA_STUDIO_URL: https://java.fizzdragon.com/studio
  JAVA_CONTENT_URL: https://java.fizzdragon.com/content
  ALIBABA_BASE_URL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  AZURE_OPENAI_BASE_URL: https://fizzdragon-ai-foundry.openai.azure.com/openai/v1
  AZURE_FOUNDRY_PROJECT_ENDPOINT: https://fizzdragon-ai-foundry.services.ai.azure.com/api/projects/fizzdragon-tools
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_BLOB_CONTAINER: foundry-outputs
  FOUNDRY_MODEL_ALLOWLIST: gpt-image-2
  FOUNDRY_EXECUTION_ENABLED: "true"
  STORYOS_ROUTER_PROVIDER: anthropic
  STORYOS_ROUTER_MODEL: claude-sonnet-4-5
  STORYOS_PERSONA_PROVIDER: deepseek
  STORYOS_PERSONA_MODEL: deepseek-v4-flash
  LOG_LEVEL: info
# ---------------------------------------------------------------------------
# Secret Provider Class — KV → projected K8s Secret `fizzdragon-secrets`.
# Pods pull values via `envFrom: secretRef: fizzdragon-secrets`.
# Every entry maps a KV secret name → the env var name the app expects.
# ---------------------------------------------------------------------------
secrets:
  # K8s Secret name (after projection). Bumped only on schema changes.
  projectedName: fizzdragon-secrets
  # KV secret name → env var name inside the pod.
  mapping:
    - kv: alibaba-api-key
      env: ALIBABA_API_KEY
    - kv: deepseek-api-key
      env: DEEPSEEK_API_KEY
    - kv: anthropic-api-key
      env: ANTHROPIC_API_KEY
    - kv: azure-openai-api-key
      env: AZURE_OPENAI_API_KEY
    - kv: image-cover-key
      env: REPLICATE_API_TOKEN
    - kv: fal-api-key
      env: FAL_API_KEY
    - kv: dashscope-api-key
      env: DASHSCOPE_API_KEY
    - kv: byteplus-modelark-api-key
      env: BYTEPLUS_MODELARK_API_KEY
    # ModelArk ASSETS plane (character likeness / liveness) — separate AK/SK
    # from the inference Bearer key; worker pods run the sync queues so these
    # live in the shared mapping. UNCOMMENT ONLY AFTER the KV secrets exist —
    # the CSI projection is fail-closed, so a mapping to a missing KV entry
    # breaks the whole projected Secret.
    # AK/SK live in KV (2026-07-08) for the AIGC media-asset registration track.
    - kv: byteplus-assets-ak
      env: BYTEPLUS_ASSETS_AK
    - kv: byteplus-assets-sk
      env: BYTEPLUS_ASSETS_SK
    # Enrollment token is real-person LIVENESS only (not AIGC). Keep commented
    # until the KV secret exists — uncommenting without it breaks the projection.
    # - kv: character-enrollment-token-key
    #   env: CHARACTER_ENROLLMENT_TOKEN_KEY
    - kv: blob-conn-string
      env: AZURE_BLOB_CONNECTION_STRING
    - kv: db-conn-string
      env: DATABASE_URL
    - kv: java-user-query-pwd
      env: JAVA_USER_QUERY_PWD
    # Managed Azure Cache for Redis (Basic C0). Replaces in-cluster Redis.
    # `redis-conn-string` is the rediss:// URL apps consume as REDIS_URL.
    # `redis-address` + `redis-password` are split form for KEDA's Redis
    # scaler (it wants host:port + password as separate fields, not a URL).
    - kv: redis-conn-string
      env: REDIS_URL
    - kv: redis-address
      env: REDIS_ADDRESS
    - kv: redis-password
      env: REDIS_PASSWORD
# Server-only secrets. Keep payment provider credentials out of web, agent,
# and worker pods; only NestJS billing routes need these values.
serverSecrets:
  projectedName: fizzdragon-server-secrets
  mapping:
    - kv: airwallex-client-id
      env: AIRWALLEX_CLIENT_ID
    - kv: airwallex-api-key
      env: AIRWALLEX_API_KEY
    - kv: airwallex-login-as-account-id
      env: AIRWALLEX_LOGIN_AS_ACCOUNT_ID
    - kv: airwallex-linked-payment-account-id
      env: AIRWALLEX_LINKED_PAYMENT_ACCOUNT_ID
    - kv: airwallex-webhook-secret
      env: AIRWALLEX_WEBHOOK_SECRET
    # AppLovin (Axon) Conversions API access token — the "Reporting Key" from the
    # Axon dashboard (Account → General → Keys). Powers server-side purchase (S2S)
    # reporting for community billing. PREREQUISITE: create `axon-capi-access-token`
    # in Key Vault BEFORE deploying — the CSI projection is fail-closed.
    - kv: axon-capi-access-token
      env: AXON_CAPI_ACCESS_TOKEN
    - kv: admin-mfa-secret-key
      env: ADMIN_MFA_SECRET_KEY
    - kv: legacy-mysql-user
      env: LEGACY_MYSQL_USER
    - kv: legacy-mysql-password
      env: LEGACY_MYSQL_PASSWORD
    - kv: agnes-api-key
      env: AGNES_API_KEY
    # HMAC token-signing secret for the self-hosted realtime WS plane
    # (REALTIME_TRANSPORT=self-hosted). PREREQUISITE: create the `realtime-ws-secret`
    # secret in Key Vault BEFORE deploying — the CSI projection fails if absent.
    # Studio Agent delivery. The Nest server uses this ROOT key for exactly one
    # thing — signing per-thread Ably token requests, locally, with an HMAC. It
    # opens no Ably connection and publishes nothing; the activity worker does
    # that, from its own copy of the same key (studioAgentDeliverySecrets).
    # PREREQUISITE: `ably-api-key` must exist in Key Vault BEFORE this ships.
    # The CSI projection is fail-closed — a mapping to a missing entry breaks
    # the WHOLE fizzdragon-server-secrets Secret, taking every other env var in
    # it down with it (Airwallex, admin MFA, legacy MySQL, the realtime HMAC).
    - kv: ably-api-key
      env: ABLY_API_KEY
    - kv: realtime-ws-secret
      env: REALTIME_WS_SECRET
    # Java points-migration bridge shared secret (/internal/points x-service-token).
    # PREREQUISITE: create `internal-service-token` in Key Vault BEFORE deploying —
    # the CSI projection fails if absent. (Set in kv-fizzdragon-com 2026-06-22.)
    - kv: internal-service-token
      env: INTERNAL_SERVICE_TOKEN
# New Agent Platform keys are isolated from the legacy server projection so an
# unprovisioned migration cannot break billing/auth/server startup. This
# projection is mounted only when agentPlatform.enabled=true.
agentPlatformServerSecrets:
  projectedName: fizzdragon-agent-platform-server-secrets
  mapping:
    - kv: agent-platform-server-private-key
      env: AGENT_PLATFORM_JWT_PRIVATE_KEY_B64
    - kv: agent-platform-domain-jwks
      env: AGENT_DOMAIN_JWKS_B64
# The admission API cannot invoke a model. Its projection therefore contains no
# model-provider credential.
agentPlatformApiSecrets:
  projectedName: fizzdragon-agent-platform-api-secrets
  mapping:
    - kv: agent-memory-api-database-url
      env: AGENT_MEMORY_DATABASE_URL
    - kv: agent-platform-api-domain-private-key
      env: DOMAIN_GATEWAY_JWT_PRIVATE_KEY_B64
# Only the Worker receives realtime and business-command credentials. Vertex
# identity is supplied through ADC/Workload Identity, never an API key.
agentPlatformWorkerSecrets:
  projectedName: fizzdragon-agent-platform-worker-secrets
  mapping:
    - kv: ably-api-key
      env: ABLY_API_KEY
    - kv: agent-memory-worker-database-url
      env: AGENT_MEMORY_DATABASE_URL
    - kv: agent-platform-worker-domain-private-key
      env: DOMAIN_GATEWAY_JWT_PRIVATE_KEY_B64
# DDL capability is held by a one-shot release Job, never either runtime.
agentPlatformMigrationSecrets:
  projectedName: fizzdragon-agent-platform-migration-secrets
  mapping:
    - kv: agent-memory-migration-database-url
      env: AGENT_MEMORY_MIGRATION_DATABASE_URL
# Insert-only ClickHouse identity for the Agent observability Collector. Agent
# API and Worker pods never receive these values.
agentObservabilitySecrets:
  projectedName: fizzdragon-agent-observability-secrets
  mapping:
    - kv: agent-observability-clickhouse-endpoint
      env: CLICKHOUSE_ENDPOINT
    - kv: agent-observability-clickhouse-username
      env: CLICKHOUSE_USERNAME
    - kv: agent-observability-clickhouse-password
      env: CLICKHOUSE_PASSWORD
    - kv: agent-observability-clickhouse-database
      env: CLICKHOUSE_DATABASE
# Studio Agent's durable runtime uses three least-privilege projections.
# Provision every
# referenced Key Vault secret before enabling; CSI projection is fail-closed.
studioAgentTemporalSecrets:
  projectedName: fizzdragon-studio-agent-temporal-secrets
  mapping:
    - kv: temporal-client-ca
      env: TEMPORAL_TLS_CA
    - kv: temporal-client-cert
      env: TEMPORAL_TLS_CERT
    - kv: temporal-client-key
      env: TEMPORAL_TLS_KEY
studioAgentGatewaySecrets:
  projectedName: fizzdragon-studio-agent-gateway-secrets
  mapping:
    - kv: studio-agent-runtime-token
      env: STUDIO_AGENT_RUNTIME_TOKEN
studioAgentModelSecrets:
  projectedName: fizzdragon-studio-agent-model-secrets
  mapping:
    - kv: alibaba-api-key
      env: ALIBABA_API_KEY
# Studio Agent DELIVERY credential, projected for the ACTIVITY worker only.
# That worker is the single publisher: it opens an `@ably/ai-transport`
# AgentSession on the thread's channel and streams the turn onto it. The CONTROL
# worker runs workflows, which are deterministic and never touch the network, so
# it is deliberately not given the key.
# PREREQUISITE: create `ably-api-key` in Key Vault BEFORE deploying. CSI is
# fail-closed; its own projection is small on purpose, so a missing entry costs
# delivery rather than also taking the model key and the gateway token down.
studioAgentDeliverySecrets:
  projectedName: fizzdragon-studio-agent-delivery-secrets
  mapping:
    - kv: ably-api-key
      env: ABLY_API_KEY
# admin-ui-only secret (least-privilege). The internet-facing ops console needs
# exactly ONE secret — the Java 资讯 X-Admin-Api-Token — so it gets its OWN scoped
# projection, NOT the shared fizzdragon-secrets (which holds DB/Redis/LLM/blob
# creds — never pour those into a public-facing admin console).
# PREREQUISITE: create `news-api-token` in Key Vault BEFORE deploying (CSI is
# fail-closed). On non-Azure clusters (CN/ACK) azure.enabled=false → inert.
adminUiSecrets:
  projectedName: fizzdragon-adminui-secrets
  mapping:
    - kv: news-api-token
      env: NEWS_API_TOKEN
# ---------------------------------------------------------------------------
# web — Next.js front-of-stack. Public via Ingress.
# ---------------------------------------------------------------------------
web:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-web
    tag: 58ce596abdf2a6148c60736291488557fbb2b860
  containerPort: 3000
  env:
    SERVER_URL: http://fizzdragon-server:3001
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule

# ---------------------------------------------------------------------------
# studio — the standalone FizzStudio app (apps/studio) on
# studio.fizzdragon.com. No secrets: backend access is the per-host /aurora
# ingress (browser-side) with the satoken cookie; the in-cluster rewrite
# below only covers SSR-side fetches.
# ---------------------------------------------------------------------------
studio:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-studio
    tag: c38243cb380572d13ab3b60b1e98eb7a38bc68cf
  containerPort: 3000
  env:
    AURORA_PROXY_TARGET: http://fizzdragon-server:3001
    AURORA_STRIP_PREFIX: "1"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule

# ---------------------------------------------------------------------------
# admin-ui — internal operations console. Public host is temporary:
# https://fizzstudio.fizzdragon.com/admin
# Keep the ingress fail-closed until operator public IP CIDRs are set.
# ---------------------------------------------------------------------------
adminUi:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-admin-ui
    tag: 4e9aaf02663832258cb8fdb2ac766ffaaeb6f0c8
  containerPort: 3000
  readinessPath: /login
  livenessPath: /login
  ingress:
    enabled: true
    path: /
    # No IP allowlist — admin is gated by login + MFA. The operator egress IP
    # rotates (VPN pool: e.g. 148.197.248.23 / 80.239.216.133 seen seconds apart),
    # so a single-CIDR lock isn't workable. To re-restrict, set this to a stable
    # operator CIDR, e.g. ["203.0.113.10/32"]; empty list = open.
    allowedCidrs: []
  env:
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_PUBLIC_ADMIN_UI_BASE_PATH: /
    ADMIN_SITE: global
    ADMIN_GLOBAL_API_BASE_URL: http://fizzdragon-server:3001/admin
    ADMIN_API_BASE_URL: http://fizzdragon-server:3001/admin
    # 资讯 (news) admin module → Java backend; the /content prefix is essential
    # (apex without it 302s to a different Sa-Token service).
    NEWS_API_BASE_URL: https://java.fizzdragon.com/content
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# server — NestJS API. Internal (ClusterIP).
# ---------------------------------------------------------------------------
server:
  enabled: true
  # HA is already provided by the out-of-band HPA (min 3 replicas) — the realtime
  # plane is multi-pod, so this is just the pre-autoscale seed (ArgoCD ignores
  # /spec/replicas drift; the HPA owns the live count). The PodDisruptionBudget
  # (minAvailable: 1) keeps a node drain / rollout from ever dropping it to zero.
  replicaCount: 1
  # Graceful drain window: the preStop sleep deregisters the pod from the Service,
  # then the WS gateway closes sockets so clients reconnect to a healthy pod.
  terminationGracePeriodSeconds: 45
  migrateOnStart: true
  image:
    repository: fizzdragon-server
    tag: 8bd0d1afdb1d25ef35ca2439d241bf155a71556c
  containerPort: 3001
  # Cloudflare R2 credentials, created with `kubectl create secret generic
  # fizzdragon-r2` rather than projected from Key Vault. Mounted optional, so this
  # list is safe to carry into a cell that has no such secret.
  extraSecretRefs:
    - fizzdragon-r2
  env:
    FAL_ENABLED: "true"
    # Cloudflare R2 over the S3-compatible API. `auto` is R2's only region and
    # path-style is required; the bucket is APAC-placed to sit beside the cluster.
    # Credentials (S3_ACCESS_KEY_ID / S3_ACCESS_KEY_SECRET) come from the
    # fizzdragon-r2 secret above. Only jobs that pin s3_compatible write here —
    # OUTPUT_STORAGE_PROVIDER stays unset so every other surface keeps its cell
    # default of azure_blob.
    S3_ENDPOINT: https://c378107772065c0671dc6b2a00c06412.r2.cloudflarestorage.com
    S3_BUCKET: fizzdragon-media
    S3_REGION: auto
    S3_FORCE_PATH_STYLE: "true"
    # The S3 endpoint above is NOT publicly readable; this custom domain is what
    # the bucket serves on. Published chapter manifest URLs are minted from it,
    # and the publisher refuses to release without it rather than hand Java the
    # resolver's AWS-shaped fallback host, which does not exist for R2.
    MEDIA_PUBLIC_BASE_URL_S3_COMPATIBLE: https://r2.fizzdragon.com
    BAILIAN_ENABLED: "true"
    BYTEPLUS_MODELARK_ENABLED: "true"
    # BytePlus ModelArk ASSETS plane — register canvas MediaAssets as AIGC assets.
    # AK/SK come from KV (serverSecrets mapping). ACR = the paid capacity-reservation
    # subscription; its expiry is not queryable via API, so it's declared here and
    # drives the T-7d new-registration hard-block + 15d post-expiry grace window.
    MEDIA_ASSET_AIGC_REGISTRATION_ENABLED: "true"
    BYTEPLUS_ACR_EXPIRES_AT: "2027-06-29T16:59:59+08:00"
    PORT: "3001"
    AI_PROVIDER: alibaba
    # Agent User runner. First trial: ON + run-a-cycle-on-boot for observability.
    # Model MUST be a non-reasoning model — the default qwen3.6-plus (reasoning)
    # fails generateObject's structured-output schema (verified: qwen-plus OK ~2s,
    # qwen3.6-plus/qwen-max fail schema). Other knobs use code defaults (interval
    # 5m, 3 agents/tick, 3 actions/run, 60m/agent spacing).
    AGENT_USER_RUNNER_ENABLED: "true"
    AGENT_USER_RUNNER_RUN_ON_BOOT: "true"
    AGENT_USER_RUNNER_MODEL: qwen-plus
    # 公共媒体经 Front Door CDN 出（media.fizzdragon.com → FD → Blob）。
    # 删除/置空即回退为直连 blob（媒体 URL 由 server 读取时拼接）。
    MEDIA_PUBLIC_BASE_URL_AZURE_BLOB: https://media.fizzdragon.com
    # REDIS_URL comes from KV via projected `fizzdragon-secrets` (envFrom).
    MASTRA_URL: http://fizzdragon-agent:4111
    # Unified self-hosted realtime for ALL cells (collab already self-hosts; asset
    # /job pushes moved off Azure Web PubSub too, so there is no CN/COM transport
    # split). Requires REALTIME_WS_SECRET (serverSecrets below). Web PubSub was
    # decommissioned (P5) — self-hosted is the only transport; any other value
    # (e.g. unset) selects the no-op provider, so realtime stays off in local dev.
    REALTIME_TRANSPORT: self-hosted
    DISABLE_CONTENT_MODERATION: "false"
    AUTH_DISABLED: "false"
    PAYMENT_PROVIDER: airwallex
    AIRWALLEX_API_BASE_URL: https://api.airwallex.com
    # AppLovin (Axon) server-side Conversions API. AXON_PIXEL_ID is the
    # non-secret pixel/event key (same value as web NEXT_PUBLIC_AXON_PIXEL_KEY);
    # the AXON_CAPI_ACCESS_TOKEN secret is projected from Key Vault (serverSecrets
    # mapping below). The S2S reporter is a no-op until BOTH are set.
    AXON_PIXEL_ID: d34d9c48-8032-4b5e-a28a-2fa3082efb73
    # Billing checkout success/back URLs must originate from one of these. The
    # AKS web host (fizzstudio.fizzdragon.com) is NOT in the code's hardcoded
    # allowlist, so it must be listed here. localhost:9527 is for local testing
    # against prod — remove once recharge is validated.
    BILLING_ALLOWED_RETURN_ORIGINS: "https://fizzstudio.fizzdragon.com,https://fizzdragon.com,http://localhost:9527"
    # Legacy Java MySQL bridge (用户管理 / legacy points). Cross-cloud: this
    # Azure-AKS server reaches the Alibaba Singapore PolarDB over its PUBLIC
    # endpoint; the AKS egress IP (20.247.195.70) is whitelisted in the
    # `aks_com_prod` group on cluster pc-gs5p5dvjj5twh7w86. USER/PASSWORD come
    # from Key Vault via serverSecrets below.
    LEGACY_MYSQL_ENABLED: "true"
    LEGACY_MYSQL_HOST: fizzdragon-sg.rwlb.singapore.rds.aliyuncs.com
    LEGACY_MYSQL_PORT: "3306"
    LEGACY_MYSQL_DATABASE: fizzdragon_client
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# agent-platform — replacement unified Agent system.
#
# Deliberately disabled until the three immutable target images and all scoped
# Key Vault entries are provisioned. Enabling is atomic: Helm renders the API,
# Worker, memory migration Job, Service, PDBs, and HPA, while the server mounts
# the matching gateway/domain keys and exposes the new product boundary.
# ---------------------------------------------------------------------------
agentPlatform:
  enabled: true
  memory:
    # Both existing roles are non-owners. The API role is read-only; the Worker
    # role has DML. Each process verifies current_user during readiness.
    apiDatabaseRole: fizzdragon_agent_api
    workerDatabaseRole: fizzdragon_agent_worker
  api:
    replicaCount: 3
    image:
      repository: fizzdragon-agent-platform-api
      tag: f376f064c751c85b06a50e9634285ee11dda8414
    port: 4111
    terminationGracePeriodSeconds: 45
    memoryPoolMax: 10
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 2000m, memory: 2Gi }
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      cpuUtilization: 65
  worker:
    replicaCount: 3
    image:
      repository: fizzdragon-agent-platform-worker
      tag: f376f064c751c85b06a50e9634285ee11dda8414
    healthPort: 3010
    metricsPort: 9464
    terminationGracePeriodSeconds: 240
    memoryPoolMax: 20
    maxConcurrentWorkflows: 128
    maxConcurrentDocumentWorkflows: 16
    activityConcurrency:
      control: 16
      inference: 16
      tool: 32
      lifecycle: 8
      cleanup: 8
      # Map wall clock is sections/lane rounded up; the document lane has its
      # own Worker and task queue, so it never takes a slot from an interactive
      # turn. Kept level with `inference` so one large document can claim at
      # most one interactive lane's worth of provider concurrency.
      document: 16
    resources:
      requests: { cpu: 1000m, memory: 2Gi }
      limits: { cpu: 4000m, memory: 8Gi }
  migrator:
    image:
      repository: fizzdragon-agent-memory-migrator
      tag: f376f064c751c85b06a50e9634285ee11dda8414
    activeDeadlineSeconds: 600
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }
  model:
    provider: google-vertex
    project: glass-proxy-501907-d2
    location: global
    # Keyless AKS→GCP workload identity federation. The Worker's projected
    # K8s token is exchanged at this provider for short-lived credentials
    # impersonating serviceAccountEmail; no Google key file exists anywhere.
    workloadIdentityFederation:
      projectNumber: "553701186007"
      pool: fizzdragon-aks
      provider: aks-com
      serviceAccountEmail: fizzdragon-agent-platform@glass-proxy-501907-d2.iam.gserviceaccount.com
    interactiveId: gemini-2.5-flash
    reasoningId: gemini-2.5-pro
    observerId: gemini-2.5-flash
  temporal:
    address: fizzdragon-temporal:7233
    namespace: fizzdragon
    taskQueue: fizzdragon-agent-platform-v1
    workerDeploymentName: fizzdragon-agent-platform
  observability:
    endpoint: http://fizzdragon-otel-collector:4318/v1/traces
    collectorHealthUrl: http://fizzdragon-otel-collector:13133/
    collector:
      enabled: true
      replicaCount: 3
      image:
        registry: docker.io
        repository: otel/opentelemetry-collector-contrib
        tag: 0.157.0
        digest: sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
      otlpHttpPort: 4318
      healthPort: 13133
      metricsPort: 8888
      goMemLimit: 820MiB
      storage:
        storageClassName: managed-csi-premium
        size: 30Gi
      terminationGracePeriodSeconds: 60
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { cpu: 2000m, memory: 1Gi }
  gateway:
    domainUrl: http://fizzdragon-server:3001
    jwksUrl: http://fizzdragon-server:3001/agent-platform/.well-known/jwks.json
    jwtIssuer: https://fizzdragon.com/agent-platform
    jwtAudience: fizzdragon-agent-platform
    domainJwtIssuer: fizzdragon-agent-platform
    domainJwtAudience: fizzdragon-domain-gateway
    apiDomainSigningKeyId: agent-platform-api-domain-v1
    workerDomainSigningKeyId: agent-platform-worker-domain-v1
    serverSigningKeyId: agent-platform-server-v1
  admission:
    providerLane: gemini
    retryAfterSeconds: 5
    reservation:
      tokenUnitsPerRun: 131072
      costMicrousdPerRun: 500000
    maxActive:
      global: 64
      perWorkspace: 8
      perActor: 2
      perProviderLane: 32
    maxReservedTokenUnits:
      global: 8388608
      perWorkspace: 1048576
      perActor: 262144
      perProviderLane: 4194304
    maxReservedCostMicrousd:
      global: 32000000
      perWorkspace: 4000000
      perActor: 1000000
      perProviderLane: 16000000
  # Egress containment for the API and Worker. See
  # templates/agent-platform-networkpolicy.yaml for why the external rule is a
  # subtraction rather than an endpoint allow-list.
  networkPolicy:
    enabled: true
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
      port: 53
    # This cluster's own private space, subtracted from the external rule. Both
    # values are AKS install-time properties: 10.0.0.0/16 is the serviceCidr and
    # 10.244.0.0/16 the pod CIDR (the same two ranges the studio-agent-runtime
    # CIDR floor was widened to catch). Verify after any cluster rebuild:
    #   az aks show -n <cluster> -g <rg> --query networkProfile
    clusterCidrs:
      - 10.0.0.0/16
      - 10.244.0.0/16
    # agent_memory sits on a managed Postgres endpoint whose address Azure does
    # not contract; the ports are what the two processes may speak once they are
    # outside the cluster, not who they may speak to.
    databasePort: 5432
    httpsPort: 443
  maxModelSteps: 48
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# agent — Mastra API. Internal. Storage in PG schema `mastra` (no PVC).
# ---------------------------------------------------------------------------
agent:
  enabled: true
  replicaCount: 1
  image:
    repository: fizzdragon-agent
    tag: local-fix-20260522-stuck-lock
  containerPort: 4111
  env:
    PORT: "4111"
    MASTRA_HOST: "0.0.0.0"
    # DATABASE_URL + REDIS_URL come from KV via projected `fizzdragon-secrets`
    # (envFrom). Mastra storage uses PG schema `mastra` — see
    # apps/agent/src/mastra/index.ts.
    # Per-pod Anthropic concurrency cap. Tier 3 (160K OTPM) — 4 pods × 20
    # = 80 global active, ~80K OTPM peak, well under the 160K cap. Was
    # temporarily 6 under Tier 2; restored to 20 (the original default)
    # after Tier 3 upgrade 2026-05-23. See model-hardening.ts (RateLimiter).
    STORYOS_CLAUDE_MAX_CONCURRENCY: "20"
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 3Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# agent-worker — BullMQ consumer. Same image, different command.
# Scales 0→N via KEDA on BullMQ queue depth (Redis Lists).
# Storage in PG schema `mastra` — agent + agent-worker share PG, not a
# libsql file.
# ---------------------------------------------------------------------------
agentWorker:
  enabled: true
  # When keda.enabled=false this is the fixed replica count; when true,
  # KEDA's ScaledObject owns it (chart omits .spec.replicas in that case).
  # Start at 1 so the worker pool isn't empty before KEDA wakes up.
  replicaCount: 1
  image:
    repository: fizzdragon-agent
    tag: local-fix-20260522-stuck-lock
  command: ["npx", "tsx", "src/worker.ts"]
  env:
    # DATABASE_URL + REDIS_URL come from KV via projected `fizzdragon-secrets`
    # (envFrom).
    # Lower per-pod concurrency than the ECS-era 90 because B2as_v2 nodes
    # are 2c8g (vs ECS 8c16g single-host). KEDA scales pod count to make
    # up total throughput: 6 pods × 15 = 90 ≈ ECS baseline.
    WORKER_CONCURRENCY: "15"
    IMAGE_WORKER_CONCURRENCY: "2"
    STORYBOARD_GENERATE_CONCURRENCY: "6"
    # Match agent's Anthropic cap — workflow runs hit the same router.
    STORYOS_CLAUDE_MAX_CONCURRENCY: "20"
  # Pod fits cleanly on B2as_v2 (8GB node). At WORKER_CONCURRENCY=15 with
  # ~50MB per in-flight workflow, working set ~750MB + base 500MB ≈ 1.5Gi.
  # 3Gi limit leaves headroom for bulk phases (storyboard 30 shots batched).
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 1500m, memory: 3Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
  keda:
    enabled: true # On from day 1 — full production form.
    minReplicas: 1 # Keep at least one worker pod warm (queue is always-on).
    maxReplicas: 6 # 6 × WORKER_CONCURRENCY 15 = 90 ≈ ECS baseline.
    cooldownPeriod: 600 # 10 min before scaling down, matches docker-compose memory behaviour.
    pollingInterval: 15
    # Azure managed Redis is TLS-only (6380); Aliyun community Redis is plaintext 6379.
    enableTLS: "true"
    # BullMQ queue list watched by the redis scaler.
    # Names mirror QUEUE_NAME / IMAGE_QUEUE_NAME in apps/agent/src/mastra/workflows/engine/.
    queues:
      - bull:storyos-workflows:wait
      - bull:asset-images:wait
# ---------------------------------------------------------------------------
# Temporal — self-hosted, one cluster per region, in the application namespace.
#
# Self-hosted rather than Temporal Cloud because .cn runs in mainland China:
# the worker<->frontend link is a continuous long-polling gRPC connection that
# would cross the border, and workflow histories carry user story content, so
# routing them offshore is a data-export problem. Running Cloud for .com and
# self-hosting for .cn would mean two operational models for one feature.
#
# Persistence is a DEDICATED Postgres server, never the application database:
# Temporal's officially tested versions top out at PostgreSQL 16 while the
# application server runs 18, and its write load has no business sharing IOPS
# with user-facing queries.
# ---------------------------------------------------------------------------
temporal:
  image:
    # Upstream images, mirrored into each region's own registry rather than
    # pulled from Docker Hub: .cn cannot reach it at all, and prod should not
    # depend on a public registry staying up. Carried under the platform
    # registry prefix like every other component, so a region overrides
    # image.registry once and these follow.
    #
    #   az acr import --name acrfizzdragoncom \
    #     --source docker.io/temporalio/server:1.31.2 \
    #     --image temporalio-server:1.31.2
    repository: temporalio-server
    tag: 1.31.2
    adminToolsRepository: temporalio-admin-tools
    adminToolsTag: 1.31.2
    pullPolicy: IfNotPresent
  # All four roles in one process. The split into separate Deployments buys
  # per-role tuning and a smaller blast radius, neither of which pays for
  # itself at this volume; two anti-affine replicas already survive a pod or
  # node loss. Splitting later is a config change, not a data migration.
  services: history,matching,frontend,worker
  replicaCount: 2
  frontendPort: 7233
  membershipPort: 6933
  # IMMUTABLE once the first server boots — the shard count is baked into the
  # persistence layout, so changing it later means migrating all data. 512 is
  # the standard production value; the docker-compose default of 4 is a
  # development convenience that permanently caps throughput.
  numHistoryShards: 512
  namespace: fizzdragon
  # Workflow history retention. History is the dominant storage consumer, and
  # it grows with turn volume until this bound.
  retention: 168h
  database:
    # Dedicated server, PostgreSQL 16. Empty by default: the chart refuses to
    # render rather than invent an endpoint.
    host: fizzdragon-temporal-pg.postgres.database.azure.com
    port: 5432
    user: temporal
    name: temporal
    visibilityName: temporal_visibility
    # Azure and Alibaba both require TLS on managed Postgres.
    tlsEnabled: true
    # Deliberately small. Temporal's defaults are sized for a database it owns
    # exclusively; these are per-replica and this server is modest.
    maxConns: 20
    maxIdleConns: 10
    maxConnLifetime: 1h
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 2Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      value: worker
      operator: Equal
      effect: NoSchedule
# Temporal server database credentials. The password never enters git; .com
# projects it from Key Vault, .cn creates the Secret out-of-band with kubectl.
temporalDatabaseSecrets:
  projectedName: fizzdragon-temporal-db-secrets
  mapping:
    - kv: temporal-db-password
      env: POSTGRES_PWD
# ---------------------------------------------------------------------------
# studio-agent-runtime — provider-independent Temporal execution plane.
#
# The temporal.address below must match the in-cluster Temporal Service for
# plaintext to be permitted; any other endpoint forces mTLS. See
# templates/studio-agent-runtime.yaml.
# ---------------------------------------------------------------------------
studioAgentRuntime:
  image:
    repository: fizzdragon-studio-agent-runtime
    tag: f254d5394f8aeb4e60677e7915ac734ff204a3aa
  internalBaseUrl: http://fizzdragon-server:3001
  temporal:
    # The in-cluster Temporal Service this chart renders. Kept in values rather
    # than hardcoded so a future external endpoint is a values change — but see
    # tlsMode: pointing this anywhere else makes mTLS mandatory.
    address: fizzdragon-temporal:7233
    namespace: fizzdragon
    # Stable Worker Deployment name. Immutable releases are build IDs within
    # this deployment; changing it strands pinned workflow histories.
    workerDeploymentName: fizzdragon-studio-agent
    # Optional TLS hostname override. Leave empty when the endpoint certificate
    # already matches the hostname in address.
    serverName: ""
    # Plaintext is permitted for exactly one address: the in-cluster Temporal
    # Service this chart owns, whose traffic never leaves the node network.
    # The template compares the address against the rendered Service name, so
    # repointing at any external endpoint fails the render until this is mtls.
    # Issuing and rotating a CA plus client certs for a ClusterIP hop buys
    # nothing that the cluster boundary does not already provide.
    tlsMode: disabled
    connectTimeoutMs: 5000
    healthProbeIntervalMs: 5000
    reconnectMinDelayMs: 500
    reconnectMaxDelayMs: 30000
    pollerStaleMs: 30000
  model:
    baseUrl: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    textId: qwen3-max
    visionId: qwen3-vl-plus
    # Total timeout on one streaming model call. Bounded by the model
    # activity's 16-minute startToClose; see apps/studio-agent-runtime/src/config.ts.
    timeoutMs: 600000
    maxOutputTokens: 8192
  # Runtime egress is default-denied. Kubernetes NetworkPolicy cannot select a
  # public dependency by DNS name, so operators must provide the exact
  # environment-specific destination CIDRs. The template rejects missing or
  # intentionally broad catch-all ranges.
  networkPolicy:
    enabled: true
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
      port: 53
    # Temporal needs no CIDRs: it is in-cluster, so the workers reach it by pod
    # selection and the port comes from temporal.frontendPort.
    # dashscope-intl.aliyuncs.com sits behind an Alibaba NLB whose addresses
    # rotate, so this rule is structurally weak: enumerating a public provider's
    # IPs is either stale or a maintenance treadmill. It is the best a
    # CIDR-based policy can do — an FQDN-aware engine (Cilium) is the real fix
    # if egress enforcement is ever turned on. Re-resolve after provider changes:
    #   dig +short dashscope-intl.aliyuncs.com
    model:
      port: 443
      cidrs:
        - 47.236.0.0/16
        - 47.245.0.0/16
    # The managed Postgres endpoint the Temporal server may reach. A /24 floor
    # is enforced — this is one endpoint, not a range.
    #
    # fizzdragon-temporal-pg resolves into 20.205.236.0/24 today. Azure does not
    # contract a stable address for a managed Postgres endpoint, so a failover
    # that moves it out of this /24 breaks Temporal's egress. Re-resolve after
    # any maintenance event:
    #   dig +short fizzdragon-temporal-pg.postgres.database.azure.com
    database:
      port: 5432
      cidrs:
        - 20.205.236.0/24
    gateway:
      port: 3001
  # Immutable per-root-turn envelope. The server snapshots these values when
  # it creates or promotes a turn; child tasks share that one durable budget.
  # `maxCapabilityInputRejectionsPerRoot` is the exception: it bounds how many
  # malformed tool inputs one turn tree may be told to correct, charges nothing,
  # and is read live at each gate rather than snapshotted.
  budget:
    maxChildDepth: 4
    maxChildRuns: 24
    maxConcurrentChildRuns: 8
    maxModelStepsPerRun: 32
    maxModelStepsPerRoot: 128
    maxCapabilityInputRejectionsPerRoot: 3
    maxTotalTokenUnits: 1000000
    maxContextBytesPerStep: 2000000
    imageTokenReserveUnits: 8192
    minOutputTokenUnitsPerStep: 256
    wallTimeMs: 3600000
  # Server-side, cross-replica admission. Every accepted root reserves one
  # complete root budget until its canonical terminal transaction.
  admission:
    leaseMs: 120000
    reconcileIntervalMs: 5000
    reconcileBatchSize: 50
    maxActiveRootRuns:
      global: 512
      perWorkspace: 64
      perUser: 4
    maxReservedTokenUnits:
      global: 512000000
      perWorkspace: 64000000
      perUser: 4000000
  attachmentCleanup:
    ttlMs: 86400000
    pollIntervalMs: 30000
    batchSize: 25
    discoveryBatchSize: 500
    leaseMs: 60000
    maxAttempts: 12
    retryBaseMs: 10000
    retryMaxMs: 1800000
  gatewayTimeoutMs: 30000
  healthPort: 3010
  metricsPort: 9464
  shutdownGraceMs: 30000
  shutdownForceMs: 120000
  # Kubernetes must outlive Temporal's force-shutdown deadline.
  terminationGracePeriodSeconds: 150
  control:
    replicaCount: 2
    maxConcurrentWorkflowTasks: 64
    maxConcurrentWorkflowPolls: 16
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
  activities:
    replicaCount: 2
    maxConcurrentTasks: 16
    maxConcurrentPolls: 8
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 2000m, memory: 2Gi }
  nodeSelector:
    pool: worker
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
# ---------------------------------------------------------------------------
# Redis — MANAGED via Azure Cache for Redis Basic C0 (`redis-fizzdragon-com`).
# No in-cluster StatefulSet. Apps get rediss:// URL from KV `redis-conn-string`
# projected as REDIS_URL. KEDA gets host:port + password via TriggerAuthentication
# (templates/keda-trigger-authentication.yaml) reading from the same projected
# Secret.
#
# Upgrade path: bump SKU in Azure (Basic C0 → Standard C0 for HA, ~$32/mo).
# No chart change needed; KV connection string transparently rotates.
# ---------------------------------------------------------------------------
# Postgres — also managed (Azure PG `fizzdragon-ai-pg`). Same conn string is
# in KV `db-conn-string`, projected as `DATABASE_URL`. server (Prisma) owns
# `public.*` schema; agent (Mastra + raw pg for artifact-store) owns
# `mastra.*` schema. No PVC, no in-cluster DB, no shared filesystem.
