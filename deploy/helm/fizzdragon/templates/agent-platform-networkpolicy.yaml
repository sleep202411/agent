{{- if .Values.agentPlatform.enabled -}}
{{- $platform := .Values.agentPlatform -}}
{{- $policy := $platform.networkPolicy -}}
{{- if not $policy.enabled -}}
{{- fail "agentPlatform.networkPolicy.enabled must be true" -}}
{{- end -}}
{{- if empty $policy.dns.namespaceSelector -}}
{{- fail "agentPlatform.networkPolicy.dns.namespaceSelector must explicitly identify the cluster DNS namespace" -}}
{{- end -}}
{{- if empty $policy.dns.podSelector -}}
{{- fail "agentPlatform.networkPolicy.dns.podSelector must explicitly identify the cluster DNS pods" -}}
{{- end -}}
{{- if empty $policy.clusterCidrs -}}
{{- fail "agentPlatform.networkPolicy.clusterCidrs must list this cluster's own Service and pod CIDRs; the external egress rule is a subtraction and is an allow-all without them" -}}
{{- end -}}
{{- range $cidr := $policy.clusterCidrs -}}
{{- $parts := splitList "/" $cidr -}}
{{- if ne (len $parts) 2 -}}
{{- fail (printf "agentPlatform.networkPolicy.clusterCidrs entry %q is not a CIDR" $cidr) -}}
{{- end -}}
{{- end -}}
{{/*
  Agent Platform egress containment.

  Same posture as studio-agent-runtime, which this replaces: default-deny for
  every Agent Platform pod, then name what each role may reach. The in-cluster
  dependencies are pod-selected, so those rules are exact and stable.

  The external half cannot be. The Worker talks to three anycast estates —
  Vertex through the Google Frontend, Ably, and Entra ID for the federated ADC
  token exchange — none of which contracts a stable address, and all of which
  resolve differently from inside this cluster than from wherever a maintainer
  runs dig. A guessed ipBlock list fails closed on inference, realtime delivery
  and model auth at the same moment, so the external rule is written as a
  subtraction instead: leave the cluster, on the ports these processes actually
  speak, and nothing else. That still removes every lateral path — the product
  and Temporal databases, Redis, every other pod, and the node IMDS credential
  endpoint — which is what an escaped parser in the untrusted-document path
  reaches for first. It does not stop HTTPS egress to an attacker-controlled
  host; only an FQDN-aware engine (Cilium) can, which is the same conclusion
  the studio-agent-runtime model rule already recorded.

  Roles are selected by fizzdragon.com/agent-platform-role, never by component:
  the Worker's component name carries the release hash and its Deployment is
  kept across builds, so a component-selected policy would strand every
  draining old-build pod under the default deny. The two roles are named rather
  than matched with Exists — the Collector carries the same label key, and a
  deny it inherits without a matching allow rule is a telemetry outage, since
  its ClickHouse endpoint is a Key Vault value this chart cannot address.
*/}}
{{- $temporalCtx := merge (dict "component" "temporal") . -}}
{{- $serverCtx := merge (dict "component" "server") . -}}
{{- $collectorCtx := merge (dict "component" "otel-collector") . -}}
{{- $denyCtx := merge (dict "component" "agent-platform-egress-deny") . -}}
{{- $apiCtx := merge (dict "component" "agent-platform-api-egress") . -}}
{{- $workerCtx := merge (dict "component" "agent-platform-worker-egress") . -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" $denyCtx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $denyCtx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fizzdragon.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: fizzdragon.com/agent-platform-role
        operator: In
        values:
          - api
          - worker
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" $apiCtx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $apiCtx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fizzdragon.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      fizzdragon.com/agent-platform-role: api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $policy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $policy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ $policy.dns.port }}
        - protocol: TCP
          port: {{ $policy.dns.port }}
    {{/*
      A bare podSelector is this namespace only, which is what every in-cluster
      dependency of the Agent Platform is.
    */}}
    - to:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.temporal.frontendPort }}
    {{/* Domain gateway and the product JWKS the API verifies invocations with. */}}
    - to:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $serverCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.containerPort }}
    {{/* Traces, plus the health port the readiness probe reports as degraded. */}}
    - to:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $collectorCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $platform.observability.collector.otlpHttpPort }}
        - protocol: TCP
          port: {{ $platform.observability.collector.healthPort }}
    {{/*
      The API holds no model or realtime credential, so its only destination
      outside the cluster is the agent_memory endpoint on Postgres.
    */}}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $cidr := $policy.clusterCidrs }}
              - {{ $cidr | quote }}
              {{- end }}
              # Node metadata (IMDS). A pod that can reach it can mint the
              # node identity's tokens and step outside its own projection.
              - "169.254.0.0/16"
      ports:
        - protocol: TCP
          port: {{ $policy.databasePort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" $workerCtx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $workerCtx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fizzdragon.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      fizzdragon.com/agent-platform-role: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $policy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $policy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ $policy.dns.port }}
        - protocol: TCP
          port: {{ $policy.dns.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.temporal.frontendPort }}
    {{/* Every business command the Worker issues goes through this one port. */}}
    - to:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $serverCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.containerPort }}
    {{/* The Worker exports traces but never probes Collector health. */}}
    - to:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $collectorCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $platform.observability.collector.otlpHttpPort }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $cidr := $policy.clusterCidrs }}
              - {{ $cidr | quote }}
              {{- end }}
              # Node metadata (IMDS). A pod that can reach it can mint the
              # node identity's tokens and step outside its own projection.
              - "169.254.0.0/16"
      ports:
        - protocol: TCP
          port: {{ $policy.databasePort }}
        - protocol: TCP
          port: {{ $policy.httpsPort }}
{{- end }}
