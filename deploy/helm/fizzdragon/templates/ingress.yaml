{{- if .Values.ingress.enabled }}
{{- range .Values.ingress.entries }}
{{- $entry := . }}
{{- if not $entry.adminUiOnly }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ $entry.name }}-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" (merge (dict "component" (printf "ingress-%s" $entry.name)) $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Fail fast on stale upstreams. Default proxy-connect-timeout is 5s,
    # so during a rollout (when the EndpointSlice update races with
    # ingress-nginx's internal upstream cache) every request blocks 5s
    # on the dead pod IP before retrying the live one. Cluster-internal
    # connects complete in <100ms; 2s is generous but still bounds the
    # user-visible blip to a fraction of the old behaviour.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "2"
    {{- if $entry.rewriteTarget }}
    nginx.ingress.kubernetes.io/rewrite-target: {{ $entry.rewriteTarget | quote }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- end }}
    {{- if $entry.certManager }}
    cert-manager.io/cluster-issuer: {{ $entry.certManager | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts:
        - {{ $entry.host | quote }}
      secretName: {{ $entry.secretName }}
  rules:
    - host: {{ $entry.host | quote }}
      http:
        paths:
          {{- if $entry.rewriteTarget }}
          - path: /(.*)
            pathType: ImplementationSpecific
          {{- else }}
          - path: /
            pathType: Prefix
          {{- end }}
            backend:
              service:
                # Per-entry backend — `service: studio` routes a host to the
                # studio app; default stays the web app.
                name: {{ $.Release.Name }}-{{ $entry.service | default "web" }}
                port:
                  number: {{ (index $.Values ($entry.service | default "web")).containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ $entry.name }}-aurora-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" (merge (dict "component" (printf "ingress-%s-aurora" $entry.name)) $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # See main ingress block above for rationale.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "2"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- if $entry.certManager }}
    cert-manager.io/cluster-issuer: {{ $entry.certManager | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts:
        - {{ $entry.host | quote }}
      secretName: {{ $entry.secretName }}
  rules:
    - host: {{ $entry.host | quote }}
      http:
        paths:
          - path: /aurora(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $.Release.Name }}-server
                port:
                  number: {{ $.Values.server.containerPort }}
{{- end }}
{{- if and $.Values.adminUi.enabled $.Values.adminUi.ingress.enabled (ne $entry.adminUi false) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ $entry.name }}-admin-ui-ingress
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" (merge (dict "component" (printf "ingress-%s-admin-ui" $entry.name)) $) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "2"
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- if and $entry.adminUiOnly (ne ($.Values.adminUi.env.NEXT_PUBLIC_ADMIN_UI_BASE_PATH | default "/admin") "/") }}
    # Dedicated admin host (no web app at root): bounce / → the admin base path.
    # Skipped when the base path is "/" (admin served at root) — an app-root of
    # "/" would redirect / → / infinitely (ERR_TOO_MANY_REDIRECTS).
    nginx.ingress.kubernetes.io/app-root: {{ $.Values.adminUi.env.NEXT_PUBLIC_ADMIN_UI_BASE_PATH | default "/admin" | quote }}
    {{- end }}
    {{- if $.Values.adminUi.ingress.allowedCidrs }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," $.Values.adminUi.ingress.allowedCidrs | quote }}
    {{- end }}
    {{- if $entry.certManager }}
    cert-manager.io/cluster-issuer: {{ $entry.certManager | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts:
        - {{ $entry.host | quote }}
      secretName: {{ $entry.secretName }}
  rules:
    - host: {{ $entry.host | quote }}
      http:
        paths:
          - path: {{ $.Values.adminUi.ingress.path | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $.Release.Name }}-admin-ui
                port:
                  number: {{ $.Values.adminUi.containerPort }}
{{- end }}
{{- end }}
{{- end }}
