{{- if .Values.adminUi.enabled -}}
{{- $component := "admin-ui" -}}
{{- $ctx := merge (dict "component" $component) . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.adminUi.replicaCount }}
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fizzdragon.componentLabels" $ctx | nindent 8 }}
        {{- include "fizzdragon.workloadIdentityLabels" . | nindent 8 }}
    spec:
      {{- if and .Values.azure.enabled .Values.adminUiSecrets.mapping }}
      serviceAccountName: {{ .Values.azure.workloadIdentity.serviceAccountName }}
      {{- end }}
      containers:
        - name: admin-ui
          image: {{ include "fizzdragon.componentImage" (dict "registry" .Values.image.registry "image" .Values.adminUi.image "component" "adminUi") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.adminUi.containerPort }}
          env:
            {{- include "fizzdragon.componentEnv" .Values.adminUi | nindent 12 }}
          {{- if .Values.adminUiSecrets.mapping }}
          {{/* secret source differs per cell: Azure KV CSI on .com, an
               out-of-band kubectl secret on .cn — same projectedName either way.
               optional:true so a not-yet-created secret degrades gracefully. */}}
          envFrom:
            - secretRef:
                name: {{ .Values.adminUiSecrets.projectedName }}
                optional: true
          {{- end }}
          {{- if and .Values.azure.enabled .Values.adminUiSecrets.mapping }}
          volumeMounts:
            - name: adminui-kv-secrets
              mountPath: /mnt/adminui-secrets
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.adminUi.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.adminUi.readinessPath | quote }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.adminUi.livenessPath | quote }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      {{- if and .Values.azure.enabled .Values.adminUiSecrets.mapping }}
      volumes:
        - name: adminui-kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-adminui-kv
      {{- end }}
      {{- with .Values.adminUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.adminUi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.adminUi.containerPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fizzdragon.componentSelector" $ctx | nindent 4 }}
{{- end }}
