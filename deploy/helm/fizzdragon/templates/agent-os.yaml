{{- if .Values.agentOs.enabled -}}
{{- $agentOs := .Values.agentOs -}}
{{/*
  toString is load-bearing: bump_tag writes the tag unquoted, and an
  all-numeric revision would parse as a float, making the comparison below
  panic with "incompatible types for comparison".
*/}}
{{- $imageTag := required "agentOs.image.tag is required" $agentOs.image.tag | toString -}}
{{- if eq $imageTag "latest" -}}
{{- fail "agentOs.image.tag must be an immutable deployment revision, never latest" -}}
{{- end -}}
{{- $component := "agent-os" -}}
{{- $ctx := merge (dict "component" $component) . -}}
{{- $datastore := $agentOs.datastore -}}
{{- if not (empty $datastore.caConfigMapName) -}}
{{- $_ := required "agentOs.datastore.caMountPath is required with a CA ConfigMap" $datastore.caMountPath -}}
{{- if not (hasPrefix "/" $datastore.caMountPath) -}}
{{- fail "agentOs.datastore.caMountPath must be an absolute path" -}}
{{- end -}}
{{- end -}}
{{- $serverName := include "fizzdragon.componentName" (merge (dict "component" "server") .) -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $agentOs.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fizzdragon.componentLabels" $ctx | nindent 8 }}
        {{- include "fizzdragon.workloadIdentityLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $agentOs.terminationGracePeriodSeconds }}
      enableServiceLinks: false
      {{- if .Values.azure.enabled }}
      serviceAccountName: {{ .Values.azure.workloadIdentity.serviceAccountName }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component }}
          image: {{ include "fizzdragon.componentImage" (dict "registry" .Values.image.registry "image" $agentOs.image "component" "agentOs") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $agentOs.containerPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: AGENT_OS_PORT
              value: {{ $agentOs.containerPort | quote }}
            {{- /*
              Explicit even though the image sets it: the process defaults to
              loopback, which is right on a laptop and makes every probe get
              connection-refused here.
            */}}
            - name: AGENT_OS_BIND_ADDRESS
              value: "0.0.0.0"
            {{- /* Derived from the Service this chart renders, never a literal. */}}
            - name: AGENT_OS_DOMAIN_URL
              value: {{ printf "http://%s:%v" $serverName .Values.server.containerPort | quote }}
            - name: AGENT_OS_OPENAI_BASE_URL
              value: {{ required "agentOs.model.baseUrl is required" $agentOs.model.baseUrl | quote }}
            - name: AGENT_OS_VIEWER_MODEL_PROFILE
              value: {{ required "agentOs.model.viewerProfile is required" $agentOs.model.viewerProfile | quote }}
            - name: AGENT_OS_CHECKPOINT_SCHEMA
              value: {{ $agentOs.checkpoint.schema | quote }}
            - name: AGENT_OS_CHECKPOINT_POOL_MAX
              value: {{ $agentOs.checkpoint.poolMax | quote }}
            - name: AGENT_OS_CHECKPOINT_LOCK_POOL_MAX
              value: {{ $agentOs.checkpoint.lockPoolMax | quote }}
            {{- if $datastore.databaseSecret.name }}
            - name: AGENT_OS_CHECKPOINT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $datastore.databaseSecret.name | quote }}
                  key: {{ required "agentOs.datastore.databaseSecret.key is required" $datastore.databaseSecret.key | quote }}
                  optional: false
            {{- end }}
          {{- /*
            ONLY the scoped projection. The worker's explicit checkpoint DSN
            points to the same PostgreSQL authority as public.agent_os_runs,
            but does not expose the server's unrelated secret bundle.
          */}}
          envFrom:
            - secretRef:
                name: {{ .Values.agentOsSecrets.projectedName }}
          volumeMounts:
            {{- if not (empty $datastore.caConfigMapName) }}
            - name: datastore-ca
              mountPath: {{ $datastore.caMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.azure.enabled }}
            - name: agent-os-secrets
              mountPath: /mnt/agent-os-secrets
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $agentOs.resources | nindent 12 }}
          {{- /*
            /health is the ONLY unauthenticated route. Any other path returns
            401 and the pod CrashLoops with a perfectly healthy process.
          */}}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                {{- /*
                  Deregister from the Service before SIGTERM. The process
                  installs no handler, so this buys ordering, not a drain —
                  raising the grace period would buy nothing.
                */}}
                command: ["sh", "-c", "sleep 8"]
      volumes:
        {{- if not (empty $datastore.caConfigMapName) }}
        - name: datastore-ca
          configMap:
            name: {{ $datastore.caConfigMapName | quote }}
            optional: false
        {{- end }}
        {{- if .Values.azure.enabled }}
        - name: agent-os-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-agent-os-kv
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      {{- with $agentOs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $agentOs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $agentOs.containerPort }}
      targetPort: http
      protocol: TCP
      name: http
  {{- /*
    componentSelector deliberately excludes chart/version — adding them makes
    the Service select nothing after the next chart bump.
  */}}
  selector:
    {{- include "fizzdragon.componentSelector" $ctx | nindent 4 }}
{{- end }}
