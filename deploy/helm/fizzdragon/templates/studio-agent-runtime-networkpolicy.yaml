{{- $runtime := .Values.studioAgentRuntime -}}
{{- $policy := $runtime.networkPolicy -}}
{{- if not $policy.enabled -}}
{{- fail "studioAgentRuntime.networkPolicy.enabled must be true" -}}
{{- end -}}
{{- if empty $policy.dns.namespaceSelector -}}
{{- fail "studioAgentRuntime.networkPolicy.dns.namespaceSelector must explicitly identify the cluster DNS namespace" -}}
{{- end -}}
{{- if empty $policy.dns.podSelector -}}
{{- fail "studioAgentRuntime.networkPolicy.dns.podSelector must explicitly identify the cluster DNS pods" -}}
{{- end -}}
{{- if empty $policy.model.cidrs -}}
{{- fail "studioAgentRuntime.networkPolicy.model.cidrs must list the exact model-provider endpoint CIDRs" -}}
{{- end -}}
{{- if empty $policy.database.cidrs -}}
{{- fail "studioAgentRuntime.networkPolicy.database.cidrs must list the exact Postgres endpoint CIDRs the Temporal server may reach" -}}
{{- end -}}
{{/*
  A prefix-length floor, not a blocklist. The previous guard was exact-string
  membership, so it admitted 10.0.0.0/16 — this cluster's own serviceCidr — and
  10.244.0.0/16, its pod CIDR. Temporal egress is now pod-selected rather than
  CIDR-based, but the database rule legitimises a private range for the first
  time, so the guard has to reason about width instead of matching literals.
*/}}
{{- range $entry := list (dict "key" "model" "cidrs" $policy.model.cidrs "floor" 16) (dict "key" "database" "cidrs" $policy.database.cidrs "floor" 24) -}}
{{- range $cidr := $entry.cidrs -}}
{{- $parts := splitList "/" $cidr -}}
{{- if ne (len $parts) 2 -}}
{{- fail (printf "studioAgentRuntime.networkPolicy.%s.cidrs entry %q is not a CIDR" $entry.key $cidr) -}}
{{- end -}}
{{- if lt (atoi (index $parts 1)) (int $entry.floor) -}}
{{- fail (printf "studioAgentRuntime NetworkPolicy forbids broad egress CIDR %s in %s.cidrs; it is wider than the /%d floor — provide the narrow endpoint range" $cidr $entry.key $entry.floor) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $temporalCtx := merge (dict "component" "temporal") . -}}
{{- $denyCtx := merge (dict "component" "studio-agent-runtime-egress-deny") . -}}
{{- $controlCtx := merge (dict "component" "studio-agent-control-egress") . -}}
{{- $activitiesCtx := merge (dict "component" "studio-agent-activities-egress") . -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" $denyCtx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $denyCtx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fizzdragon.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      fizzdragon.com/studio-agent-runtime: "true"
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" $controlCtx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $controlCtx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fizzdragon.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      fizzdragon.com/studio-agent-runtime: "true"
      fizzdragon.com/studio-agent-role: control
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $policy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $policy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ $policy.dns.port }}
        - protocol: TCP
          port: {{ $policy.dns.port }}
    {{/*
      Temporal is in-cluster, so its pod IPs are dynamic and an ipBlock cannot
      express it — the only honest CIDR would be the whole pod range, which is
      an allow-all to every workload. namespaceSelector and podSelector are keys
      of ONE list item, which is an AND; two list items would be an OR.
    */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.temporal.frontendPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" $activitiesCtx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $activitiesCtx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fizzdragon.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      fizzdragon.com/studio-agent-runtime: "true"
      fizzdragon.com/studio-agent-role: activities
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $policy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $policy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ $policy.dns.port }}
        - protocol: TCP
          port: {{ $policy.dns.port }}
    {{/*
      Temporal is in-cluster, so its pod IPs are dynamic and an ipBlock cannot
      express it — the only honest CIDR would be the whole pod range, which is
      an allow-all to every workload. namespaceSelector and podSelector are keys
      of ONE list item, which is an AND; two list items would be an OR.
    */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.temporal.frontendPort }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "fizzdragon.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: {{ $policy.gateway.port }}
    - to:
        {{- range $cidr := $policy.model.cidrs }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $policy.model.port }}
---
{{/*
  Temporal's own isolation.

  Clients are selected by a single label rather than enumerated. Listing the
  server and the two worker roles by name is what silently omits the
  namespace-registration Job — which would then be denied by its own default
  deny and deadlock the first install.

  NetworkPolicy is additive, so an Ingress-typed policy and an Egress-typed one
  isolate the same pods in both directions; a separate deny-all object would add
  zero rules and one more selector to keep in sync.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" (merge (dict "component" "temporal-ingress") .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" (merge (dict "component" "temporal-ingress") .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              fizzdragon.com/temporal-client: "true"
      ports:
        - protocol: TCP
          port: {{ $.Values.temporal.frontendPort }}
    # Replicas form their membership ring by dialling the addresses peers
    # register in the cluster_membership table, so they must reach each other.
    - from:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fizzdragon.componentName" (merge (dict "component" "temporal-egress") .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" (merge (dict "component" "temporal-egress") .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $policy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $policy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ $policy.dns.port }}
        - protocol: TCP
          port: {{ $policy.dns.port }}
    - to:
        {{- range $cidr := $policy.database.cidrs }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $policy.database.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "fizzdragon.componentSelector" $temporalCtx | nindent 14 }}
