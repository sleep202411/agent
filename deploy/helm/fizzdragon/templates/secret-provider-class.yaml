    clientID: {{ .Values.azure.workloadIdentity.clientId | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    keyvaultName: {{ .Values.azure.keyVault.name | quote }}
    objects: |
      array:
      {{- range .Values.studioAgentTemporalSecrets.mapping }}
        - |
          objectName: {{ .kv }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: {{ .Values.studioAgentTemporalSecrets.projectedName }}
      type: Opaque
      data:
        {{- range .Values.studioAgentTemporalSecrets.mapping }}
        - objectName: {{ .kv }}
