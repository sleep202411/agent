{{/*
  Projected only under mTLS. The CSI projection is fail-closed, so mapping a
  Key Vault entry that was never created breaks the whole Secret — and the
  in-cluster Temporal hop has no client certificates by design.
*/}}
{{- if and (eq .Values.studioAgentRuntime.temporal.tlsMode "mtls") .Values.studioAgentTemporalSecrets.mapping }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-studio-agent-temporal-kv
  namespace: {{ .Release.Namespace }}
