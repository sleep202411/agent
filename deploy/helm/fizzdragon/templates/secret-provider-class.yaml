{{/*
SecretProviderClass — KV → projected K8s Secret.
Pods mount the SPC volume (required for `secretObjects` projection) and
pull values via envFrom: secretRef. UAMI auth flows through the workload
identity SA token; no static credentials anywhere.
*/}}
{{- if .Values.azure.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-kv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.labels" (merge (dict "component" "kv") .) | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentity.clientId | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    keyvaultName: {{ .Values.azure.keyVault.name | quote }}
    objects: |
      array:
      {{- range .Values.secrets.mapping }}
        - |
          objectName: {{ .kv }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.projectedName }}
      type: Opaque
      data:
        {{- range .Values.secrets.mapping }}
        - objectName: {{ .kv }}
          key: {{ .env }}
        {{- end }}
{{- if .Values.serverSecrets.mapping }}
