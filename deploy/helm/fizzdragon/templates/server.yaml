{{- $mtls := eq .Values.studioAgentRuntime.temporal.tlsMode "mtls" -}}
{{- $agentPlatform := .Values.agentPlatform -}}
{{- if .Values.server.enabled -}}
{{- $component := "server" -}}
{{- $ctx := merge (dict "component" $component) . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fizzdragon.componentLabels" $ctx | nindent 8 }}
        {{- include "fizzdragon.workloadIdentityLabels" . | nindent 8 }}
        # Selected by the Temporal ingress policy; without it the client is
        # denied and every run submission fails.
        fizzdragon.com/temporal-client: "true"
    spec:
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds | default 30 }}
      {{- if .Values.azure.enabled }}
      serviceAccountName: {{ .Values.azure.workloadIdentity.serviceAccountName }}
      {{- end }}
      {{- if .Values.server.migrateOnStart }}
      initContainers:
        - name: db-migrate
          image: "{{ .Values.image.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "db:deploy"]
          env:
            {{- include "fizzdragon.sharedEnv" . | nindent 12 }}
            {{- include "fizzdragon.componentEnv" .Values.server | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.projectedName }}
            {{- if .Values.serverSecrets.mapping }}
            - secretRef:
                name: {{ .Values.serverSecrets.projectedName }}
            {{- end }}
          {{- if .Values.azure.enabled }}
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- if .Values.serverSecrets.mapping }}
            - name: server-kv-secrets
              mountPath: /mnt/server-secrets
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.containerPort }}
          env:
            {{- include "fizzdragon.sharedEnv" . | nindent 12 }}
            {{- include "fizzdragon.componentEnv" .Values.server | nindent 12 }}
            - name: TEMPORAL_ADDRESS
              value: {{ required "studioAgentRuntime.temporal.address is required" .Values.studioAgentRuntime.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ required "studioAgentRuntime.temporal.namespace is required" .Values.studioAgentRuntime.temporal.namespace | quote }}
            - name: TEMPORAL_TLS_MODE
              value: {{ required "studioAgentRuntime.temporal.tlsMode is required" .Values.studioAgentRuntime.temporal.tlsMode | quote }}
            {{- with .Values.studioAgentRuntime.temporal.serverName }}
            - name: TEMPORAL_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: STUDIO_AGENT_CONTROL_TASK_QUEUE
              value: "studio-agent-control-v1"
            - name: STUDIO_AGENT_ACTIVITY_TASK_QUEUE
              value: "studio-agent-activities-v1"
            - name: STUDIO_AGENT_WORKER_DEPLOYMENT_NAME
              value: {{ required "studioAgentRuntime.temporal.workerDeploymentName is required" .Values.studioAgentRuntime.temporal.workerDeploymentName | quote }}
            - name: STUDIO_AGENT_RELEASE
              value: {{ required "studioAgentRuntime.image.tag is required" .Values.studioAgentRuntime.image.tag | quote }}
            - name: STUDIO_AGENT_TEMPORAL_CONNECT_TIMEOUT_MS
              value: {{ .Values.studioAgentRuntime.temporal.connectTimeoutMs | quote }}
            - name: STUDIO_AGENT_TEMPORAL_HEALTH_PROBE_INTERVAL_MS
              value: {{ .Values.studioAgentRuntime.temporal.healthProbeIntervalMs | quote }}
            - name: STUDIO_AGENT_TEMPORAL_RECONNECT_MIN_DELAY_MS
              value: {{ .Values.studioAgentRuntime.temporal.reconnectMinDelayMs | quote }}
            - name: STUDIO_AGENT_TEMPORAL_RECONNECT_MAX_DELAY_MS
              value: {{ .Values.studioAgentRuntime.temporal.reconnectMaxDelayMs | quote }}
            - name: STUDIO_AGENT_TEMPORAL_POLLER_STALE_MS
              value: {{ .Values.studioAgentRuntime.temporal.pollerStaleMs | quote }}
            - name: STUDIO_AGENT_MODEL_PROVIDER
              value: "alibaba"
            - name: STUDIO_AGENT_MODEL
              value: {{ .Values.studioAgentRuntime.model.textId | quote }}
            - name: STUDIO_AGENT_VISION_MODEL
              value: {{ .Values.studioAgentRuntime.model.visionId | quote }}
            - name: STUDIO_AGENT_MODEL_TIMEOUT_MS
              value: {{ .Values.studioAgentRuntime.model.timeoutMs | quote }}
            - name: STUDIO_AGENT_MODEL_MAX_OUTPUT_TOKENS
              value: {{ .Values.studioAgentRuntime.model.maxOutputTokens | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_CHILD_DEPTH
              value: {{ .Values.studioAgentRuntime.budget.maxChildDepth | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_CHILD_RUNS
              value: {{ .Values.studioAgentRuntime.budget.maxChildRuns | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_CONCURRENT_CHILD_RUNS
              value: {{ .Values.studioAgentRuntime.budget.maxConcurrentChildRuns | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_MODEL_STEPS_PER_RUN
              value: {{ .Values.studioAgentRuntime.budget.maxModelStepsPerRun | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_MODEL_STEPS_PER_ROOT
              value: {{ .Values.studioAgentRuntime.budget.maxModelStepsPerRoot | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_CAPABILITY_INPUT_REJECTIONS_PER_ROOT
              value: {{ .Values.studioAgentRuntime.budget.maxCapabilityInputRejectionsPerRoot | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_TOTAL_TOKEN_UNITS
              value: {{ .Values.studioAgentRuntime.budget.maxTotalTokenUnits | quote }}
            - name: STUDIO_AGENT_BUDGET_MAX_CONTEXT_BYTES_PER_STEP
              value: {{ .Values.studioAgentRuntime.budget.maxContextBytesPerStep | quote }}
            - name: STUDIO_AGENT_BUDGET_IMAGE_TOKEN_RESERVE_UNITS
              value: {{ .Values.studioAgentRuntime.budget.imageTokenReserveUnits | quote }}
            - name: STUDIO_AGENT_BUDGET_MIN_OUTPUT_TOKEN_UNITS_PER_STEP
              value: {{ .Values.studioAgentRuntime.budget.minOutputTokenUnitsPerStep | quote }}
            - name: STUDIO_AGENT_BUDGET_WALL_TIME_MS
              value: {{ .Values.studioAgentRuntime.budget.wallTimeMs | quote }}
            - name: STUDIO_AGENT_ADMISSION_LEASE_MS
              value: {{ .Values.studioAgentRuntime.admission.leaseMs | quote }}
            - name: STUDIO_AGENT_ADMISSION_RECONCILE_INTERVAL_MS
              value: {{ .Values.studioAgentRuntime.admission.reconcileIntervalMs | quote }}
            - name: STUDIO_AGENT_ADMISSION_RECONCILE_BATCH_SIZE
              value: {{ .Values.studioAgentRuntime.admission.reconcileBatchSize | quote }}
            - name: STUDIO_AGENT_ADMISSION_MAX_ACTIVE_ROOT_RUNS_GLOBAL
              value: {{ .Values.studioAgentRuntime.admission.maxActiveRootRuns.global | quote }}
            - name: STUDIO_AGENT_ADMISSION_MAX_ACTIVE_ROOT_RUNS_PER_WORKSPACE
              value: {{ .Values.studioAgentRuntime.admission.maxActiveRootRuns.perWorkspace | quote }}
            - name: STUDIO_AGENT_ADMISSION_MAX_ACTIVE_ROOT_RUNS_PER_USER
              value: {{ .Values.studioAgentRuntime.admission.maxActiveRootRuns.perUser | quote }}
            - name: STUDIO_AGENT_ADMISSION_MAX_RESERVED_TOKEN_UNITS_GLOBAL
              value: {{ .Values.studioAgentRuntime.admission.maxReservedTokenUnits.global | quote }}
            - name: STUDIO_AGENT_ADMISSION_MAX_RESERVED_TOKEN_UNITS_PER_WORKSPACE
              value: {{ .Values.studioAgentRuntime.admission.maxReservedTokenUnits.perWorkspace | quote }}
            - name: STUDIO_AGENT_ADMISSION_MAX_RESERVED_TOKEN_UNITS_PER_USER
              value: {{ .Values.studioAgentRuntime.admission.maxReservedTokenUnits.perUser | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_TTL_MS
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.ttlMs | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_CLEANUP_POLL_INTERVAL_MS
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.pollIntervalMs | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_CLEANUP_BATCH_SIZE
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.batchSize | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_CLEANUP_DISCOVERY_BATCH_SIZE
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.discoveryBatchSize | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_CLEANUP_LEASE_MS
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.leaseMs | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_CLEANUP_MAX_ATTEMPTS
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.maxAttempts | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_CLEANUP_RETRY_BASE_MS
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.retryBaseMs | quote }}
            - name: STUDIO_AGENT_ATTACHMENT_CLEANUP_RETRY_MAX_MS
              value: {{ .Values.studioAgentRuntime.attachmentCleanup.retryMaxMs | quote }}
            {{- /* app.module.ts evaluates AGENT_PLATFORM_ENABLED at module import
                   and throws when it is unset under NODE_ENV=production, so this
                   whole block belongs to the process that runs main.js. The
                   db-migrate initContainer only shells out to prisma and must not
                   carry it — a copy there satisfies no reader and hides the gap. */}}
            {{- /* Derived from the rendered Service, never a literal — the
                   gateway's default is 127.0.0.1:4301, which in a pod is itself. */}}
            - name: AGENT_OS_WORKER_URL
              value: {{ printf "http://%s:%v" (include "fizzdragon.componentName" (merge (dict "component" "agent-os") .)) .Values.agentOs.containerPort | quote }}
            - name: AGENT_PLATFORM_ENABLED
              value: {{ $agentPlatform.enabled | quote }}
            {{- if $agentPlatform.enabled }}
            - name: AGENT_PLATFORM_URL
              value: {{ printf "http://%s:%v" (include "fizzdragon.componentName" (merge (dict "component" "agent-platform-api") .)) $agentPlatform.api.port | quote }}
            - name: AGENT_PLATFORM_JWT_KEY_ID
              value: {{ required "agentPlatform.gateway.serverSigningKeyId is required" $agentPlatform.gateway.serverSigningKeyId | quote }}
            - name: AGENT_PLATFORM_JWT_ISSUER
              value: {{ required "agentPlatform.gateway.jwtIssuer is required" $agentPlatform.gateway.jwtIssuer | quote }}
            - name: AGENT_PLATFORM_JWT_AUDIENCE
              value: {{ required "agentPlatform.gateway.jwtAudience is required" $agentPlatform.gateway.jwtAudience | quote }}
            {{- /* The BASE queue, identical to the Worker's TEMPORAL_TASK_QUEUE.
                   Both sides derive their lanes from it — the Worker through
                   agentTaskQueues(), the gateway by appending -document — so a
                   literal or a pre-suffixed value here dispatches long-document
                   analysis onto a queue no Worker polls, silently and forever. */}}
            - name: AGENT_PLATFORM_TEMPORAL_TASK_QUEUE
              value: {{ required "agentPlatform.temporal.taskQueue is required" $agentPlatform.temporal.taskQueue | quote }}
            - name: AGENT_DOMAIN_JWT_ISSUER
              value: {{ required "agentPlatform.gateway.domainJwtIssuer is required" $agentPlatform.gateway.domainJwtIssuer | quote }}
            - name: AGENT_DOMAIN_JWT_AUDIENCE
              value: {{ required "agentPlatform.gateway.domainJwtAudience is required" $agentPlatform.gateway.domainJwtAudience | quote }}
            - name: AGENT_ADMISSION_PROVIDER_LANE
              value: {{ required "agentPlatform.admission.providerLane is required" $agentPlatform.admission.providerLane | quote }}
            - name: AGENT_ADMISSION_RETRY_AFTER_SECONDS
              value: {{ required "agentPlatform.admission.retryAfterSeconds is required" $agentPlatform.admission.retryAfterSeconds | quote }}
            - name: AGENT_ADMISSION_RESERVED_TOKEN_UNITS_PER_RUN
              value: {{ required "agentPlatform.admission.reservation.tokenUnitsPerRun is required" $agentPlatform.admission.reservation.tokenUnitsPerRun | quote }}
            - name: AGENT_ADMISSION_RESERVED_COST_MICROUSD_PER_RUN
              value: {{ required "agentPlatform.admission.reservation.costMicrousdPerRun is required" $agentPlatform.admission.reservation.costMicrousdPerRun | quote }}
            - name: AGENT_ADMISSION_MAX_ACTIVE_GLOBAL
              value: {{ required "agentPlatform.admission.maxActive.global is required" $agentPlatform.admission.maxActive.global | quote }}
            - name: AGENT_ADMISSION_MAX_ACTIVE_PER_WORKSPACE
              value: {{ required "agentPlatform.admission.maxActive.perWorkspace is required" $agentPlatform.admission.maxActive.perWorkspace | quote }}
            - name: AGENT_ADMISSION_MAX_ACTIVE_PER_ACTOR
              value: {{ required "agentPlatform.admission.maxActive.perActor is required" $agentPlatform.admission.maxActive.perActor | quote }}
            - name: AGENT_ADMISSION_MAX_ACTIVE_PER_PROVIDER_LANE
              value: {{ required "agentPlatform.admission.maxActive.perProviderLane is required" $agentPlatform.admission.maxActive.perProviderLane | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_TOKEN_UNITS_GLOBAL
              value: {{ required "agentPlatform.admission.maxReservedTokenUnits.global is required" $agentPlatform.admission.maxReservedTokenUnits.global | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_TOKEN_UNITS_PER_WORKSPACE
              value: {{ required "agentPlatform.admission.maxReservedTokenUnits.perWorkspace is required" $agentPlatform.admission.maxReservedTokenUnits.perWorkspace | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_TOKEN_UNITS_PER_ACTOR
              value: {{ required "agentPlatform.admission.maxReservedTokenUnits.perActor is required" $agentPlatform.admission.maxReservedTokenUnits.perActor | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_TOKEN_UNITS_PER_PROVIDER_LANE
              value: {{ required "agentPlatform.admission.maxReservedTokenUnits.perProviderLane is required" $agentPlatform.admission.maxReservedTokenUnits.perProviderLane | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_COST_MICROUSD_GLOBAL
              value: {{ required "agentPlatform.admission.maxReservedCostMicrousd.global is required" $agentPlatform.admission.maxReservedCostMicrousd.global | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_COST_MICROUSD_PER_WORKSPACE
              value: {{ required "agentPlatform.admission.maxReservedCostMicrousd.perWorkspace is required" $agentPlatform.admission.maxReservedCostMicrousd.perWorkspace | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_COST_MICROUSD_PER_ACTOR
              value: {{ required "agentPlatform.admission.maxReservedCostMicrousd.perActor is required" $agentPlatform.admission.maxReservedCostMicrousd.perActor | quote }}
            - name: AGENT_ADMISSION_MAX_RESERVED_COST_MICROUSD_PER_PROVIDER_LANE
              value: {{ required "agentPlatform.admission.maxReservedCostMicrousd.perProviderLane is required" $agentPlatform.admission.maxReservedCostMicrousd.perProviderLane | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.projectedName }}
            {{- if .Values.serverSecrets.mapping }}
            - secretRef:
                name: {{ .Values.serverSecrets.projectedName }}
            {{- end }}
            {{- if $mtls }}
            - secretRef:
                name: {{ .Values.studioAgentTemporalSecrets.projectedName }}
            {{- end }}
            {{- if $agentPlatform.enabled }}
            - secretRef:
                name: {{ .Values.agentPlatformServerSecrets.projectedName }}
            {{- end }}
            - secretRef:
                name: {{ .Values.studioAgentGatewaySecrets.projectedName }}
            {{- /* Secrets created outside Key Vault projection (kubectl create
                   secret). `optional` so a cell that has not been given one yet
                   starts normally instead of wedging every pod on a missing
                   reference — the feature reading it degrades, the server does not. */}}
            {{- range .Values.server.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
            {{- /* The gateway<->worker token, checked in both directions.
                   Unconditional: the module loads regardless, and the config
                   service throws in its constructor without it. */}}
            - secretRef:
                name: {{ .Values.agentOsServerSecrets.projectedName }}
          {{- if .Values.azure.enabled }}
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
            - name: agent-os-server-secrets
              mountPath: /mnt/agent-os-server-secrets
              readOnly: true
            {{- if .Values.serverSecrets.mapping }}
            - name: server-kv-secrets
              mountPath: /mnt/server-secrets
              readOnly: true
            {{- end }}
            {{- if $mtls }}
            - name: studio-agent-temporal-secrets
              mountPath: /mnt/studio-agent-temporal-secrets
              readOnly: true
            {{- end }}
            {{- if $agentPlatform.enabled }}
            - name: agent-platform-server-secrets
              mountPath: /mnt/agent-platform-server-secrets
              readOnly: true
            {{- end }}
            - name: studio-agent-gateway-secrets
              mountPath: /mnt/studio-agent-gateway-secrets
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Pause so the endpoints controller deregisters this pod from the
                # Service before SIGTERM — new + in-flight connections drain to
                # healthy pods; the WS gateway then closes sockets on shutdown.
                command: ["sh", "-c", "sleep 8"]
      {{- if .Values.azure.enabled }}
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-kv
        - name: agent-os-server-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-agent-os-server-kv
        {{- if .Values.serverSecrets.mapping }}
        - name: server-kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-server-kv
        {{- end }}
        {{- if $mtls }}
        - name: studio-agent-temporal-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-studio-agent-temporal-kv
        {{- end }}
        {{- if $agentPlatform.enabled }}
        - name: agent-platform-server-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-agent-platform-server-kv
        {{- end }}
        - name: studio-agent-gateway-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-studio-agent-gateway-kv
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.containerPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fizzdragon.componentSelector" $ctx | nindent 4 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  # Keep >=1 server pod serving through voluntary disruptions (node drain, rollout).
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
{{- end }}
