{{- if .Values.server.enabled -}}
{{- $component := "server" -}}
{{- $ctx := merge (dict "component" $component) . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fizzdragon.componentLabels" $ctx | nindent 8 }}
        {{- include "fizzdragon.workloadIdentityLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds | default 30 }}
      {{- if .Values.azure.enabled }}
      serviceAccountName: {{ .Values.azure.workloadIdentity.serviceAccountName }}
      {{- end }}
      {{- if .Values.server.migrateOnStart }}
      initContainers:
        - name: db-migrate
          image: "{{ .Values.image.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "db:deploy"]
          env:
            {{- include "fizzdragon.sharedEnv" . | nindent 12 }}
            {{- include "fizzdragon.componentEnv" .Values.server | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.projectedName }}
            {{- if .Values.serverSecrets.mapping }}
            - secretRef:
                name: {{ .Values.serverSecrets.projectedName }}
            {{- end }}
          {{- if .Values.azure.enabled }}
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- if .Values.serverSecrets.mapping }}
            - name: server-kv-secrets
              mountPath: /mnt/server-secrets
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.containerPort }}
          env:
            {{- include "fizzdragon.sharedEnv" . | nindent 12 }}
            {{- include "fizzdragon.componentEnv" .Values.server | nindent 12 }}
            - name: AGENT_OS_ENABLED
              value: {{ .Values.agentOs.enabled | quote }}
            {{- if .Values.agentOs.enabled }}
            {{- /* Derived from the rendered Service, never a literal — the
                   gateway's default is 127.0.0.1:4301, which in a pod is itself. */}}
            - name: AGENT_OS_WORKER_URL
              value: {{ printf "http://%s:%v" (include "fizzdragon.componentName" (merge (dict "component" "agent-os") .)) .Values.agentOs.containerPort | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.projectedName }}
            {{- if .Values.serverSecrets.mapping }}
            - secretRef:
                name: {{ .Values.serverSecrets.projectedName }}
            {{- end }}
            {{- /* Secrets created outside Key Vault projection (kubectl create
                   secret). `optional` so a cell that has not been given one yet
                   starts normally instead of wedging every pod on a missing
                   reference — the feature reading it degrades, the server does not. */}}
            {{- range .Values.server.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
                optional: true
            {{- end }}
            {{- if .Values.agentOs.enabled }}
            {{- /* The gateway<->worker token, checked in both directions. */}}
            - secretRef:
                name: {{ .Values.agentOsServerSecrets.projectedName }}
            {{- end }}
          {{- if .Values.azure.enabled }}
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- if .Values.agentOs.enabled }}
            - name: agent-os-server-secrets
              mountPath: /mnt/agent-os-server-secrets
              readOnly: true
            {{- end }}
            {{- if .Values.serverSecrets.mapping }}
            - name: server-kv-secrets
              mountPath: /mnt/server-secrets
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Pause so the endpoints controller deregisters this pod from the
                # Service before SIGTERM — new + in-flight connections drain to
                # healthy pods; the WS gateway then closes sockets on shutdown.
                command: ["sh", "-c", "sleep 8"]
      {{- if .Values.azure.enabled }}
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-kv
        {{- if .Values.agentOs.enabled }}
        - name: agent-os-server-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-agent-os-server-kv
        {{- end }}
        {{- if .Values.serverSecrets.mapping }}
        - name: server-kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-server-kv
        {{- end }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.containerPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fizzdragon.componentSelector" $ctx | nindent 4 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
spec:
  # Keep >=1 server pod serving through voluntary disruptions (node drain, rollout).
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
{{- end }}
