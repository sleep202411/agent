{{- $runtime := .Values.studioAgentRuntime -}}
{{- $temporalAddress := required "studioAgentRuntime.temporal.address is required" $runtime.temporal.address -}}
{{- $temporalNamespace := required "studioAgentRuntime.temporal.namespace is required" $runtime.temporal.namespace -}}
{{- $internalBaseUrl := required "studioAgentRuntime.internalBaseUrl is required" $runtime.internalBaseUrl -}}
{{- $modelBaseUrl := required "studioAgentRuntime.model.baseUrl is required" $runtime.model.baseUrl -}}
{{- $textModelId := required "studioAgentRuntime.model.textId is required" $runtime.model.textId -}}
{{- $visionModelId := required "studioAgentRuntime.model.visionId is required" $runtime.model.visionId -}}
{{- $imageTag := required "studioAgentRuntime.image.tag is required" $runtime.image.tag -}}
{{/*
  The Temporal build ID is the image tag. They were two values that had to be
  equal, maintained apart: deploy-com-aks.sh's bump_tag() arms on `repository:`
  and rewrites the following `tag:`, so it could never reach a sibling
  `release:` key — the runtime was undeployable by its own deploy script.
*/}}
{{- $release := $imageTag -}}
{{- $workerDeploymentName := required "studioAgentRuntime.temporal.workerDeploymentName is required" $runtime.temporal.workerDeploymentName -}}
{{/*
  Plaintext is permitted for exactly one endpoint: the in-cluster Temporal
  Service this chart renders. That hop never leaves the node network, so a CA
  plus client certs would buy nothing the cluster boundary does not already
  give. Any other address is off-cluster by definition and must be mTLS —
  comparing against the rendered Service name makes that impossible to get
  wrong by editing values alone.
*/}}
{{- $inClusterTemporal := printf "%s:%d" (include "fizzdragon.componentName" (merge (dict "component" "temporal") $)) (int .Values.temporal.frontendPort) -}}
{{- $mtls := eq $runtime.temporal.tlsMode "mtls" -}}
{{- if ne $runtime.temporal.tlsMode "mtls" -}}
{{- if ne $temporalAddress $inClusterTemporal -}}
{{- fail (printf "studioAgentRuntime.temporal.tlsMode must be mtls for %s; plaintext is permitted only for this chart's in-cluster Temporal Service (%s)" $temporalAddress $inClusterTemporal) -}}
{{- end -}}
{{- end -}}
{{- if or (eq $imageTag "set-at-deploy") (eq $imageTag "latest") -}}
{{- fail "studioAgentRuntime.image.tag must be an immutable deployment revision; it is also the Temporal build ID that pins workflow histories" -}}
{{- end -}}
{{- if ne $workerDeploymentName "fizzdragon-studio-agent" -}}
{{- fail "studioAgentRuntime.temporal.workerDeploymentName must remain fizzdragon-studio-agent for pinned workflow compatibility" -}}
{{- end -}}
{{- if le (int $runtime.terminationGracePeriodSeconds) (div (int $runtime.shutdownForceMs) 1000) -}}
{{- fail "studioAgentRuntime.terminationGracePeriodSeconds must exceed shutdownForceMs" -}}
{{- end -}}
{{- range $role := list "control" "activities" }}
{{- $isControl := eq $role "control" -}}
{{- $roleValues := index $runtime $role -}}
{{- $component := ternary "studio-agent-control" "studio-agent-activities" $isControl -}}
{{- $releaseHash := $release | sha256sum | trunc 12 -}}
{{- $versionedComponent := printf "%s-%s" $component $releaseHash -}}
{{- $entrypoint := ternary "dist/worker-control.js" "dist/worker-activities.js" $isControl -}}
{{- $ctx := merge (dict "component" $versionedComponent) $ -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
    fizzdragon.com/studio-agent-runtime: "true"
    fizzdragon.com/studio-agent-role: {{ $role | quote }}
    fizzdragon.com/studio-agent-build: {{ $releaseHash | quote }}
  annotations:
    helm.sh/resource-policy: keep
    fizzdragon.com/studio-agent-deployment-name: {{ $workerDeploymentName | quote }}
    fizzdragon.com/studio-agent-build-id: {{ $release | quote }}
spec:
  replicas: {{ $roleValues.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fizzdragon.componentLabels" $ctx | nindent 8 }}
        fizzdragon.com/studio-agent-runtime: "true"
        fizzdragon.com/studio-agent-role: {{ $role | quote }}
        # Selected by the Temporal ingress policy; without it the worker cannot
        # poll its task queue and the whole execution plane stalls silently.
        fizzdragon.com/temporal-client: "true"
        fizzdragon.com/studio-agent-build: {{ $releaseHash | quote }}
        {{- include "fizzdragon.workloadIdentityLabels" $ | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $runtime.terminationGracePeriodSeconds }}
      enableServiceLinks: false
      {{- if $.Values.azure.enabled }}
      serviceAccountName: {{ $.Values.azure.workloadIdentity.serviceAccountName }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component }}
          image: "{{ $.Values.image.registry }}/{{ $runtime.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["node", {{ $entrypoint | quote }}]
          ports:
            - name: health
              containerPort: {{ $runtime.healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $runtime.metricsPort }}
              protocol: TCP
          env:
            - name: STUDIO_AGENT_RELEASE
              value: {{ $release | quote }}
            - name: TEMPORAL_ADDRESS
              value: {{ $temporalAddress | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ $temporalNamespace | quote }}
            - name: TEMPORAL_TLS_MODE
              value: {{ $runtime.temporal.tlsMode | quote }}
            {{- with $runtime.temporal.serverName }}
            - name: TEMPORAL_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: STUDIO_AGENT_CONTROL_TASK_QUEUE
              value: "studio-agent-control-v1"
            - name: STUDIO_AGENT_ACTIVITY_TASK_QUEUE
              value: "studio-agent-activities-v1"
            - name: STUDIO_AGENT_WORKER_DEPLOYMENT_NAME
              value: {{ $workerDeploymentName | quote }}
            - name: STUDIO_AGENT_WORKER_SHUTDOWN_GRACE_MS
              value: {{ $runtime.shutdownGraceMs | quote }}
            - name: STUDIO_AGENT_WORKER_SHUTDOWN_FORCE_MS
              value: {{ $runtime.shutdownForceMs | quote }}
            - name: STUDIO_AGENT_HEALTH_HOST
              value: "0.0.0.0"
            - name: STUDIO_AGENT_HEALTH_PORT
              value: {{ $runtime.healthPort | quote }}
            - name: STUDIO_AGENT_METRICS_BIND_ADDRESS
              value: {{ printf "0.0.0.0:%v" $runtime.metricsPort | quote }}
            {{- if $isControl }}
            - name: STUDIO_AGENT_CONTROL_MAX_CONCURRENT_WORKFLOW_TASKS
              value: {{ $roleValues.maxConcurrentWorkflowTasks | quote }}
            - name: STUDIO_AGENT_CONTROL_MAX_CONCURRENT_WORKFLOW_POLLS
              value: {{ $roleValues.maxConcurrentWorkflowPolls | quote }}
            {{- else }}
            - name: STUDIO_AGENT_ACTIVITY_MAX_CONCURRENT_TASKS
              value: {{ $roleValues.maxConcurrentTasks | quote }}
            - name: STUDIO_AGENT_ACTIVITY_MAX_CONCURRENT_POLLS
              value: {{ $roleValues.maxConcurrentPolls | quote }}
            - name: STUDIO_AGENT_INTERNAL_BASE_URL
              value: {{ $internalBaseUrl | quote }}
            - name: STUDIO_AGENT_INTERNAL_TIMEOUT_MS
              value: {{ $runtime.gatewayTimeoutMs | quote }}
            - name: ALIBABA_BASE_URL
              value: {{ $modelBaseUrl | quote }}
            - name: STUDIO_AGENT_MODEL
              value: {{ $textModelId | quote }}
            - name: STUDIO_AGENT_VISION_MODEL
              value: {{ $visionModelId | quote }}
            - name: STUDIO_AGENT_MODEL_TIMEOUT_MS
              value: {{ $runtime.model.timeoutMs | quote }}
            - name: STUDIO_AGENT_MODEL_MAX_OUTPUT_TOKENS
              value: {{ $runtime.model.maxOutputTokens | quote }}
            {{- end }}
          envFrom:
            {{- if $mtls }}
            - secretRef:
                name: {{ $.Values.studioAgentTemporalSecrets.projectedName }}
            {{- end }}
            {{- if not $isControl }}
            - secretRef:
                name: {{ $.Values.studioAgentGatewaySecrets.projectedName }}
            - secretRef:
                name: {{ $.Values.studioAgentModelSecrets.projectedName }}
            - secretRef:
                name: {{ $.Values.studioAgentDeliverySecrets.projectedName }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if $.Values.azure.enabled }}
          volumeMounts:
            {{- if $mtls }}
            - name: studio-agent-temporal-secrets
              mountPath: /mnt/studio-agent-temporal-secrets
              readOnly: true
            {{- end }}
            {{- if not $isControl }}
            - name: studio-agent-gateway-secrets
              mountPath: /mnt/studio-agent-gateway-secrets
              readOnly: true
            - name: studio-agent-model-secrets
              mountPath: /mnt/studio-agent-model-secrets
              readOnly: true
            - name: studio-agent-delivery-secrets
              mountPath: /mnt/studio-agent-delivery-secrets
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $roleValues.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      {{- if $.Values.azure.enabled }}
      volumes:
        {{- if $mtls }}
        - name: studio-agent-temporal-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $.Release.Name }}-studio-agent-temporal-kv
        {{- end }}
        {{- if not $isControl }}
        - name: studio-agent-gateway-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $.Release.Name }}-studio-agent-gateway-kv
        - name: studio-agent-model-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $.Release.Name }}-studio-agent-model-kv
        # Delivery credential, ACTIVITY worker only. This worker is the single
        # publisher; the control worker runs deterministic workflows and is
        # deliberately not given the key.
        - name: studio-agent-delivery-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $.Release.Name }}-studio-agent-delivery-kv
        {{- end }}
      {{- end }}
      {{- with $runtime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $runtime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fizzdragon.componentName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" $ctx | nindent 4 }}
    fizzdragon.com/studio-agent-runtime: "true"
    fizzdragon.com/studio-agent-role: {{ $role | quote }}
    fizzdragon.com/studio-agent-build: {{ $releaseHash | quote }}
  annotations:
    helm.sh/resource-policy: keep
    fizzdragon.com/studio-agent-deployment-name: {{ $workerDeploymentName | quote }}
    fizzdragon.com/studio-agent-build-id: {{ $release | quote }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "fizzdragon.componentSelector" $ctx | nindent 6 }}
{{ end }}
