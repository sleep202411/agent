{{/*
Mastra libsql shared storage. Azure Files RWX so agent + agent-worker
can both mount /app/data. Standard LRS — cheapest tier; SQLite over
SMB is fine because mastra.db is written from a single process (the
agent does reads; agent-worker does writes via workflow steps).
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-agent-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fizzdragon.componentLabels" (merge (dict "component" "agent-data") .) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.agentData.storageClass }}
  resources:
    requests:
      storage: {{ .Values.agentData.size }}
