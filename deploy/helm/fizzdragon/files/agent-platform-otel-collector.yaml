extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/agent_observability:
    directory: ${env:OTEL_STORAGE_DIRECTORY}
    create_directory: true
    fsync: true
    max_size: 21474836480
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTEL_STORAGE_COMPACTION_DIRECTORY}
      cleanup_on_start: true
      rebound_needed_threshold_mib: 2048
      rebound_trigger_threshold_mib: 512

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 15

exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    username: ${env:CLICKHOUSE_USERNAME}
    password: ${env:CLICKHOUSE_PASSWORD}
    database: ${env:CLICKHOUSE_DATABASE}
    create_schema: false
    async_insert: true
    compress: lz4
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/agent_observability
      num_consumers: 10
      queue_size: 100000
      sizer: items
      block_on_overflow: false
      batch:
        min_size: 5000
        max_size: 10000
        flush_timeout: 5s
        sizer: items
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions:
    - health_check
    - file_storage/agent_observability
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
