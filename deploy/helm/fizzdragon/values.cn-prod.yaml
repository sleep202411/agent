# ============================================================================
# CN production — ACK cluster `fizzdragon-cn` (cn-hangzhou, account 5941…8385).
# Layered on top of values.yaml:  helm upgrade -f values.yaml -f values.cn-prod.yaml
#
# Azure layer is OFF here. The projected Secrets (`fizzdragon-secrets`,
# `fizzdragon-server-secrets`) are created out-of-band with kubectl from the
# prod-cn .env — same trust model as the out-of-band TLS Secrets on AKS.
# The stack shares NOTHING with the Java backend: dedicated VPC
# (vpc-bp1yeuzyrd2zjlfb7vcro), own RDS PG (pgm-1ud5k5e8ed864ld6), own Redis
# (r-1udd94dcf121a354). Java is reached only as a public HTTPS API.
# ============================================================================
azure:
  enabled: false

image:
  # ACR EE instance `fizzdragon` (cri-9fw21oj7s91k326l) via the VPC endpoint
  # (vpc-bp1yeuzyrd2zjlfb7vcro is linked; PrivateZone resolves this domain to
  # an in-VPC IP). The VPC path is REQUIRED, not an optimization: this intl
  # account is a post-2025-03 "new OSS user", so the registry's blob redirects
  # to the backing bucket's default public OSS endpoint are policy-blocked
  # (PublicEndpointForbidden) — only internal-endpoint pulls work.
  # Pushes from dev machines use the PUBLIC domain (fizzdragon-registry.…)
  # which still needs the endpoint IP ACL.
  # Pull auth: `acr-pull` docker-registry Secret on the default SA
  # (fixed password via ResetLoginPassword).
  registry: fizzdragon-registry-vpc.cn-hangzhou.cr.aliyuncs.com/fizzdragon
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  entries:
    # Validation host, live since day 1. The production host entry below is
    # commented until DNS cutover — adding it earlier just makes cert-manager
    # fail HTTP-01 (DNS still points at the old stack) and back off for hours.
    - name: test
      host: cn-ack.fizzspace.cn
      secretName: fizzdragon-cn-test-tls
      certManager: letsencrypt-prod
      rewriteTarget: ""
      adminUi: false # admin-ui disabled on CN v1 (build broken at HEAD)
    # Live CN platform host (fizzdragon.fizzspace.cn stays = Java until freed).
    - name: studio-cn
      host: fizzstudio.fizzspace.cn
      secretName: fizzdragon-cn-studio-tls
      certManager: letsencrypt-prod
      rewriteTarget: ""
      adminUi: false
    # Dedicated admin console host (mirrors .com's admin.fizzdragon.com).
    # adminUiOnly → no web/aurora on this host; served at ROOT (basePath "")
    # via adminUi.env.NEXT_PUBLIC_ADMIN_UI_BASE_PATH="/" + adminUi.ingress.path="/".
    - name: admin-cn
      host: admin.fizzspace.cn
      secretName: admin-fizzspace-cn-tls
      certManager: letsencrypt-prod
      rewriteTarget: ""
      adminUi: true
      adminUiOnly: true
    # Cutover 2026-06-26: fizzdragon.fizzspace.cn DNS now points at this ACK LB
    # (was the Java ECS, whose cert expired — broke web /content proxy AND the
    # released mobile app, which calls https://fizzdragon.fizzspace.cn/content).
    # Uses the *.fizzspace.cn wildcard via the pre-seeded fizzdragon-cn-tls
    # Secret (certManager: "") — no HTTP-01 gap on cutover. adminUi OFF: the .cn
    # admin is on admin.fizzspace.cn; a main admin-ui sub-ingress would collide
    # with the web "/" path (same bug fixed on .com main-ingress).
    - name: main
      host: fizzdragon.fizzspace.cn
      secretName: fizzdragon-cn-tls
      certManager: ""
      rewriteTarget: ""
      adminUi: false
    # Standalone FizzStudio canvas (apps/studio) on its own CN host. service:
    # studio routes the host root to fizzdragon-studio; the chart auto-renders a
    # sibling -aurora-ingress (studio.fizzspace.cn/aurora/* -> fizzdragon-server).
    # Reuses the pre-seeded *.fizzspace.cn wildcard (fizzdragon-cn-tls,
    # certManager "") like the `main` entry — no HTTP-01 gap.
    - name: studio-app
      host: studio.fizzspace.cn
      secretName: fizzdragon-cn-tls
      certManager: ""
      rewriteTarget: ""
      adminUi: false
      service: studio

sharedEnv:
  # Java backend moved to its OWN host java.fizzspace.cn (valid HTTPS) so
  # fizzdragon.fizzspace.cn can be cut over to THIS ACK cluster without our
  # backend's Java calls looping back to ourselves. Cutover 2026-06-26. (The
  # old fizzdragon.fizzspace.cn cert on the Java ECS had also expired.)
  JAVA_STUDIO_URL: https://java.fizzspace.cn/studio
  JAVA_CONTENT_URL: https://java.fizzspace.cn/content
  USER_AVATAR_BASE_URL: https://avatar.fizzspace.cn
  # OSS media pipeline. This account blocks the OSS public endpoint
  # (PublicEndpointForbidden), so server/worker uploads + reads use the OSS
  # INTERNAL endpoint (pods run in the same VPC). Public serving goes through a
  # CDN custom domain: media.fizzspace.cn → Aliyun CDN → fizzdragon-ai-outputs
  # OSS origin. The resolver emits media.fizzspace.cn URLs via the base below.
  OSS_INTERNAL: "true"
  MEDIA_PUBLIC_BASE_URL_ALIYUN_OSS: https://media.fizzspace.cn
  # Browser-facing signed URLs (upload PUT + signed read GET): the OSS public
  # endpoint is blocked and the internal endpoint is browser-unreachable, so
  # these are signed against the direct-OSS custom domain CNAME bound to
  # fizzdragon-ai-outputs (oss.fizzspace.cn, *.fizzspace.cn wildcard cert).
  # Distinct from the read CDN above (media.fizzspace.cn, public unsigned GET).
  OSS_PUBLIC_BASE_URL: https://oss.fizzspace.cn
  # Bailian, Beijing region — a different account, key and catalogue from .com's
  # Singapore workspace, so this is not a mirror of values.yaml. Reaching the
  # international endpoint from inside China would cross the border on every
  # turn and put user scripts on foreign infrastructure.
  #
  # Workspace-scoped domain, which Alibaba recommends over shared dashscope.
  # Verified from this repo: 175 models, and all five shipped Agent OS profiles
  # complete the propose → approve → write path here.
  ALIBABA_BASE_URL: https://llm-crovnhlv7n5y9hfm.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  # Mirrors prod-cn .env: deepseek providers, model names from code defaults.
  STORYOS_ROUTER_PROVIDER: deepseek
  STORYOS_ROUTER_MODEL: null
  STORYOS_PERSONA_PROVIDER: deepseek
  STORYOS_PERSONA_MODEL: null
  # Azure-only agent LLM entries from base values — removed on CN.
  AZURE_OPENAI_BASE_URL: null
  AZURE_OPENAI_API_VERSION: null
  AZURE_BLOB_CONTAINER: null

# Same projected Secret names as .com so templates stay identical; contents
# come from kubectl, not Key Vault. The `kv:` fields are unused when
# azure.enabled=false — the `env:` list documents the expected keys.
serverSecrets:
  projectedName: fizzdragon-server-secrets
  mapping:
    # Required by the project publication gateway. Provision the regional
    # Java admin credential in this out-of-band Secret before server rollout.
    - kv: java-admin-api-token
      env: JAVA_ADMIN_API_TOKEN
    # CN v1: no Airwallex (billing not enabled on CN yet).
    # Required before server rollout: 32 random bytes encoded as 64 hex characters.
    # Preserve this key; saved creator bank details depend on it.
    - kv: creator-payout-details-key
      env: CREATOR_PAYOUT_DETAILS_KEY
    - kv: admin-mfa-secret-key
      env: ADMIN_MFA_SECRET_KEY
    # Token-signing secret for the self-hosted realtime WS plane
    # (REALTIME_TRANSPORT=self-hosted). Web PubSub is unavailable on CN, so the
    # in-cluster /ws/realtime gateway mints + verifies HMAC tokens with this.
    # Must be present in the out-of-band fizzdragon-server-secrets (kubectl).
    - kv: realtime-ws-secret
      env: REALTIME_WS_SECRET
    # Conversations and notification fan-out still use Ably REST even though
    # asset/entity realtime is self-hosted. Provision a CN-approved key before
    # deploying the current server; preflight checks the key without printing it.
    - kv: ably-api-key
      env: ABLY_API_KEY

web:
  replicaCount: 1
  image:
    tag: set-at-deploy
  # Single untainted node — drop the .com pool selector/taints.
  nodeSelector: null
  tolerations: null

adminUi:
  # Enabled on its own host admin.fizzspace.cn (ingress entry `admin-cn`,
  # adminUiOnly). Served at ROOT: base path "/" → Next.js basePath "" and the
  # chart's app-root annotation becomes a no-op; ingress.path + readiness move
  # off /admin to /. (admin-ui builds fine at main — the old HEAD-break is gone.)
  enabled: true
  replicaCount: 1
  image:
    tag: set-at-deploy
  readinessPath: /login
  livenessPath: /login
  ingress:
    enabled: true
    path: /
  env:
    ADMIN_SITE: cn
    NEXT_PUBLIC_ADMIN_UI_BASE_PATH: "/"
    # 资讯 admin → the CN Java (else inherits base values.yaml's .com host and
    # silently edits the .com news store). NOTE: java.fizzspace.cn's
    # /content/api/admin/news currently 500s (Java-side handler bug); pointing
    # here is the correct target — the 500 is for the Java team to fix.
    NEWS_API_BASE_URL: https://java.fizzspace.cn/content
    TEXT_GAME_API_BASE_URL: https://java.fizzspace.cn/studio
  nodeSelector: null
  tolerations: null

studio:
  # Enabled on CN: standalone canvas at studio.fizzspace.cn (ingress entry
  # `studio-app` below, service: studio). studio.yaml injects ONLY studio.env
  # (NOT sharedEnv), so the CN Java URLs MUST be repeated here — else
  # next.config.ts falls back to its java.fizzdragon.com / studio.fizzdragon.com
  # code defaults and proxies /user (login) + /api (CRUD) + /aurora to .com.
  enabled: true
  replicaCount: 1
  image:
    tag: set-at-deploy
  env:
    # Deployment cell — the layout reads this at RUNTIME and hands it to the client
    # via RegionProvider (studio bakes no NEXT_PUBLIC_*, and NEXT_PUBLIC_* would be
    # compile-inlined anyway). Gates CN commerce: CNY one-off membership + WeChat 扫码.
    SITE_REGION: cn
    AURORA_PROXY_TARGET: http://fizzdragon-server:3001
    AURORA_STRIP_PREFIX: "1"
    JAVA_CONTENT_URL: https://java.fizzspace.cn/content
    JAVA_STUDIO_URL: https://java.fizzspace.cn/studio
  # Single untainted CN node — drop the .com pool:worker selector/taints
  # (base values.yaml) or the pod stays Pending/unschedulable.
  nodeSelector: null
  tolerations: null

server:
  # Google Vertex models are not offered in CN. Do not inherit COM's identity
  # configuration or advertise models that require the Google API path.
  googleVertex:
    enabled: false
  replicaCount: 1
  # CN migrations are an explicit, separately approved Job. Never couple
  # irreversible schema/data changes to an ordinary pod rollout.
  migrateOnStart: false
  image:
    tag: set-at-deploy
  # R2 is .com-only. CN has always written to Alibaba OSS and must not inherit
  # even an optional reference to the .com credential Secret.
  extraSecretRefs: []
  env:
    NEXT_PUBLIC_SITE_REGION: cn
    # Do not inherit COM certificate IDs. Provision from the CN Java catalogue.
    CREW_QUALIFICATION_CATALOG_JSON: null
    REFERRAL_INVITE_BASE_URL: https://fizzdragon.fizzspace.cn
    # Legacy Java stores project covers as relative keys in the CN `shotive`
    # bucket. This explicit override prevents the CN cell from ever inheriting
    # the .com Singapore bucket when resolving those keys.
    LEGACY_OSS_BASE_URL: https://shotive.oss-cn-hangzhou.aliyuncs.com
    # CN mobile H5 generation defaults — explicit even though they match .com
    # today, so the two cells can drift deliberately. Both ids are validated
    # against the CN catalog at server boot; minimax-h3-max is deliberately
    # NOT used (it has never been catalogued in any production cell).
    AGENT_OS_MOBILE_IMAGE_MODEL: wan-image-2.7
    # Qualified against this region's endpoint with isolated Story tool fixtures.
    AGENT_OS_MOBILE_CHAT_MODEL: qwen3.7-plus
    AGENT_OS_MOBILE_VIDEO_MODEL: minimax-h3
    # CN banner bucket for crew logos (relative keys). Admin DTOs resolve
    # crew.logo with this base; never inherit the .com Singapore banner bucket.
    BANNER_BASE_URL: https://banner.fizzspace.cn
    # CN-local CDN mirror for the Git-governed Project Skill preview media.
    PROJECT_SKILL_PREVIEW_BASE_URL: https://media.fizzspace.cn/product-skills/previews/v1
    # Mirrors prod-cn .env (2026-06-10).
    AI_PROVIDER: deepseek
    # Provider credentials are provisioned separately; both gates fail at boot
    # if their required key is absent.
    WORLD_MODEL_HAPPY_OYSTER_ENABLED: "true"
    MINIMAX_ENABLED: "true"
    # Remove .com-only storage endpoints and analytics identifiers. Existing CN
    # rows live in the separate CN database and are OSS-backed.
    S3_ENDPOINT: null
    S3_BUCKET: null
    S3_REGION: null
    S3_FORCE_PATH_STYLE: null
    MEDIA_PUBLIC_BASE_URL_S3_COMPATIBLE: null
    MEDIA_PUBLIC_BASE_URL_AZURE_BLOB: null
    AXON_PIXEL_ID: null
    # OSS video → HLS. IMM transcodes uploaded episode videos and, through the
    # cn-only adaptiveStoryPlayback reconcile, free published story clips into
    # ABR HLS under hls/{assetId}/. Takedowns and lifecycle GC delete that
    # prefix, then refresh media.fizzspace.cn by URL (`aliyun` mode also
    # executes purge_cdn actions). The server has no defaults for these and
    # refuses to boot on this cell without them. acct5 owns the IMM project,
    # the bucket and the CDN domain, so both clients reuse OSS_ACCESS_KEY_* from
    # fizzdragon-secrets (that RAM user needs cdn:RefreshObjectCaches). Set
    # IMM_ENDPOINT / ALIYUN_CDN_ENDPOINT only if pods cannot reach the public
    # API hosts.
    IMM_PROJECT_NAME: fizzdragon-cn
    IMM_REGION: cn-hangzhou
    MEDIA_CDN_PURGE_MODE: aliyun
    # BytePlus ModelArk ASSETS plane — same intl BytePlus account as .com (verified
    # same inference key). AK/SK live in the out-of-band fizzdragon-server-secrets
    # (added via kubectl, NOT Key Vault — azure.enabled=false here). ACR expiry +
    # endpoint (default ap-southeast-1) match .com.
    MEDIA_ASSET_AIGC_REGISTRATION_ENABLED: "true"
    BYTEPLUS_ACR_EXPIRES_AT: "2027-06-29T16:59:59+08:00"
    DISABLE_CONTENT_MODERATION: "true"
    # Return-URL allowlist (DECLARATIVE — never hardcode host origins in code):
    # fizzstudio.fizzspace.cn = apps/web (社区), studio.fizzspace.cn = apps/studio (算力).
    # billing.service auto-includes fizzdragon.fizzspace.cn + the .com hosts.
    BILLING_ALLOWED_RETURN_ORIGINS: "https://fizzstudio.fizzspace.cn,https://studio.fizzspace.cn"
    # No payment provider wired on CN yet.
    PAYMENT_PROVIDER: null
    AIRWALLEX_API_BASE_URL: null
    # Azure Web PubSub doesn't serve CN, so realtime asset/entity pushes use the
    # in-cluster self-hosted WS plane (/aurora/ws/realtime, fanned out via Redis).
    # Requires REALTIME_WS_SECRET (see serverSecrets above). Routed through the
    # existing /aurora/* ingress — nginx upgrades WS on that path automatically.
    REALTIME_TRANSPORT: self-hosted
    # Legacy Java MySQL bridge → CN Java PolarDB (READ-ONLY; /aurora/creators reads
    # client_user). USER/PASSWORD come from fizzdragon-server-secrets. The PolarDB
    # public endpoint must whitelist the ACK egress IP (whitelist group
    # `ack_cn_server`); if that egress IP changes, re-add it (or set up VPC peering
    # to the private endpoint pc-1ud0tty6lw28dgg34.mysql.polardb.rds.aliyuncs.com).
    LEGACY_MYSQL_ENABLED: "true"
    LEGACY_MYSQL_HOST: fizzdragon.mysql.polardb.rds.aliyuncs.com
    LEGACY_MYSQL_DATABASE: fizzdragon_client
    # Bootstrap admin for admin.fizzspace.cn (created at server start by
    # ensureBootstrapAdmin). Password is in fizzdragon-server-secrets
    # (ADMIN_BOOTSTRAP_PASSWORD). MFA off for first login — change password +
    # enable MFA from the console after. REQUIRE_MFA stays false until then.
    ADMIN_BOOTSTRAP_EMAIL: "505421473@qq.com"
    ADMIN_BOOTSTRAP_REQUIRE_MFA: "false"
  nodeSelector: null
  tolerations: null

agent:
  replicaCount: 1
  image:
    # Legacy StoryOS is frozen. 7b94af76's API image crashes during Mastra
    # bootstrap; this is the last verified CN API image and is deliberately not
    # advanced by the normal platform release path.
    tag: 9b0ebfba
  nodeSelector: null
  tolerations: null

agentWorker:
  replicaCount: 1
  image:
    # The worker from the current CN release is healthy. It stays independently
    # pinned because API and worker health diverged despite sharing one image.
    tag: 7b94af76
  env:
    # Mirrors prod-cn .env (2026-06-10): same throughput as the compose stack.
    WORKER_CONCURRENCY: "8"
    IMAGE_WORKER_CONCURRENCY: "1"
    STORYBOARD_GENERATE_CONCURRENCY: "6"
  nodeSelector: null
  tolerations: null
  keda:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    # Aliyun community Redis is plaintext :6379.
    enableTLS: "false"

# Agent OS, CN cell. The .com defaults are inherited except where this cell
# genuinely differs: the model host, and the scheduling hints — CN runs one
# untainted node, so .com's `pool: worker` selector would leave the pod Pending
# forever behind a green chart.
#
# Secrets are out-of-band here (no Key Vault; azure.enabled=false makes the CSI
# volume inert), so `fizzdragon-agent-os-secrets` and
# `fizzdragon-agent-os-server-secrets` are created with kubectl. The worker
# refuses to boot if any of its four keys is missing.
agentOs:
  enabled: true
  replicaCount: 1
  image:
    tag: set-at-deploy
  # Bailian's mainland endpoint. The shipped profile table needs no per-cell
  # override: all five ids (qwen3.8-max, qwen3.7-plus, deepseek-v4-pro, glm-5.2,
  # kimi-k2.7-code) were verified to answer here on 2026-08-24, so only the host
  # differs from .com.
  model:
    baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
  nodeSelector: null
  tolerations: null

# App production uses the existing CN authoring route and qualified media catalog.
appStoryAgent:
  enabled: true
  image:
    tag: "d8b5bafe9bbe5bb511e829ff3cf7fc30ae4636d1"
  model:
    name: qwen-plus
    baseUrl: https://llm-crovnhlv7n5y9hfm.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    author: qwen-plus
    image: wan-image-2.7
    video: minimax-h3-max
  authorizationPoints: "1000000"
  secrets:
    apiKey:
      name: fizzdragon-app-story-agent-provider
    internalToken:
      name: fizzdragon-app-story-agent-internal

# Independent Harness authoring uses the CN provider and private regional volume.
gameAgent:
  enabled: true
  image:
    tag: "bf3f7eb16d016cea340f5b22832ad3b2175306ae"
  persistence:
    storageClassName: alicloud-disk-essd
  model:
    name: qwen3.8-max-0902
    baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
  studioOrigin: https://studio.fizzspace.cn
  secrets:
    apiKey:
      name: fizzdragon-game-agent-provider
    internalToken:
      name: fizzdragon-game-agent-internal
