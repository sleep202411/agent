# csi-secrets-store-provider-azure Helm values — fizzdragon-com AKS
#
# Pinned chart: csi-secrets-store-provider-azure/csi-secrets-store-provider-azure 1.8.1
# This chart bundles the upstream secrets-store-csi-driver 1.5.6 as a subchart.
#
# Install:
#   helm upgrade --install csi-azure-provider \
#     csi-secrets-store-provider-azure/csi-secrets-store-provider-azure \
#     -n kube-system \
#     --version 1.8.1 \
#     -f deploy/helm/cluster-bootstrap/csi-secrets-store-provider-azure-values.yaml

# --- Azure-specific provider config ---
linux:
  enabled: true
  # DaemonSet must run on BOTH pools so any pod can use the provider.
  tolerations:
    - key: workload
      operator: Equal
      value: worker
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

# No Windows nodes in our cluster.
windows:
  enabled: false

# --- Upstream secrets-store-csi-driver subchart config ---
secrets-store-csi-driver:
  install: true  # ensure the subchart deploys

  # Rotate mounted secrets when Key Vault content changes.
  enableSecretRotation: true
  rotationPollInterval: 2m

  # Sync the CSI volume mount into a K8s Secret so apps can read via env vars.
  syncSecret:
    enabled: true

  linux:
    # Subchart's own DaemonSet tolerations — needs to match the parent.
    tolerations:
      - key: workload
        operator: Equal
        value: worker
        effect: NoSchedule
      - key: CriticalAddonsOnly
        operator: Exists
    resources:
      secretsStore:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          cpu: 200m
          memory: 200Mi

  # Token requests for Workload Identity OIDC federation with Azure AD.
  tokenRequests:
    - audience: api://AzureADTokenExchange
