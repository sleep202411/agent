plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.fizzdragon.timelineexport'
version = '1.0.0'
android {
  namespace 'expo.modules.fizztimelineexport'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
dependencies {
  // Match the installed expo-video / expo-audio Media3 version.
  implementation 'androidx.media3:media3-transformer:1.9.0'
}
