<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2048"
  height="2048"
  viewBox="0 0 2048 2048"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Jinling Rumeng pale-red seal alpha mask, version 1</title>
  <desc id="description">
    A controlled abstract broken-square seal made from three water and folded-page motifs. It
    contains no text, surname, religious mark, or generated glyph.
  </desc>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-linecap="square"
    stroke-linejoin="miter"
  >
    <!-- Broken outer boundary and authored wear cuts are encoded as explicit path gaps. -->
    <path stroke-width="132" d="M390 450 L390 352 L814 352 M942 352 L1556 352 L1556 702" />
    <path
      stroke-width="132"
      d="M1556 868 L1556 1204 M1556 1326 L1556 1696 L1284 1696 M1160 1696 L492 1696"
    />
    <path stroke-width="132" d="M328 1540 L328 950 M328 806 L328 604" />

    <!-- Three abstract strokes: water, folded leaf, and receding water. -->
    <path
      stroke-width="118"
      d="M590 690 C760 584 944 598 1094 704 C1214 790 1320 800 1432 720"
    />
    <path
      stroke-width="112"
      d="M570 1040 C744 900 910 914 1034 1048 L1160 1184 C1264 1294 1362 1260 1440 1172"
    />
    <path
      stroke-width="104"
      d="M578 1408 C724 1310 876 1312 1008 1390 C1148 1474 1290 1464 1436 1362"
    />
  </g>
</svg>
