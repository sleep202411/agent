# Local dev Postgres + Redis + S3-compatible object storage.
# `docker compose -f docker-compose.dev.yml up -d` to start;
# `docker compose -f docker-compose.dev.yml down` to stop;
# `docker compose -f docker-compose.dev.yml down -v` to wipe data.
#
# Production deploys use managed services (Azure Database for PostgreSQL,
# Azure Cache for Redis, Cloudflare R2 / Alibaba OSS); this file is dev-only.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fizzdragon-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: fizzdragon
      POSTGRES_USER: fizzdragon
      POSTGRES_PASSWORD: fizzdragon
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizzdragon"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fizzdragon-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: fizzdragon-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fizzdragon
      MINIO_ROOT_PASSWORD: fizzdragon-local-storage
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:9527,http://127.0.0.1:9527
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
  redis-data:
  minio-data:
