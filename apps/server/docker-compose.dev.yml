# Local dev Postgres + Redis for Foundry persistence + BullMQ queue.
# `docker compose -f docker-compose.dev.yml up -d` to start;
# `docker compose -f docker-compose.dev.yml down` to stop;
# `docker compose -f docker-compose.dev.yml down -v` to wipe data.
#
# Production deploys use managed services (Azure Database for PostgreSQL,
# Azure Cache for Redis); this file is dev-only.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fizzdragon-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: fizzdragon
      POSTGRES_USER: fizzdragon
      POSTGRES_PASSWORD: fizzdragon
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizzdragon"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fizzdragon-redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg-data:
  redis-data:
